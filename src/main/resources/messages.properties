chat.weather=Sóng chưa xem được dự báo thời tiết hôm nay 🙈 Hạ Long đẹp nhất vào **tháng 3 – 5** và **tháng 9 – 11**, trời mát, biển êm ☀️ Mùa hè (tháng 6 – 8) nóng, hợp tắm biển và lặn nhưng có thể có bão, bạn theo dõi dự báo trước khi đi tour nha. Mùa đông (tháng 12 – 2) se lạnh và hay có mưa phùn, nhớ mang áo khoác đó! 🧥
chat.explore.intro=Quanh Sóng Xanh có nhiều chỗ xinh để đi lắm nè 🗺️
chat.explore.1=• **Du thuyền vịnh Hạ Long** — đi giữa gần 2.000 đảo đá vôi
chat.explore.2=• **Hang Sửng Sốt** — hang động đẹp bậc nhất vịnh
chat.explore.3=• **Đảo Ti Tốp** — leo đỉnh ngắm toàn cảnh, tắm biển
chat.explore.4=• **Hòn Trống Mái** — biểu tượng của Hạ Long
chat.explore.5=• **Lặn ngắm san hô & chèo kayak** — đặt tour lặn ngay tại resort
chat.explore.outro=Bạn đặt tour lặn ngay trên trang đơn phòng, hoặc hỏi lễ tân để mua vé du thuyền nha 🚤
chat.food=Tới Hạ Long nhớ thử **chả mực giã tay**, **sá sùng**, **ngán**, **bánh cuốn chả mực** và hải sản tươi ở **chợ Hạ Long** nha 😋 Tối về Sóng Xanh đặt combo hải sản nướng hoặc lẩu, ngồi ngắm vịnh là hết ý!
chat.book.intro=Đặt phòng ở Sóng Xanh dễ lắm nè 📝
chat.book.1=• Vào **Danh sách phòng**, chọn phòng bạn thích
chat.book.2=• Chọn ngày nhận và ngày trả trên lịch
chat.book.3=• Điền họ tên, số điện thoại, email rồi bấm xác nhận
chat.book.4=• Nếu cần cọc, quét mã QR để chuyển cọc giữ phòng
chat.book.outro=Xong là có email xác nhận gửi tới bạn liền!
chat.cancel=Bạn đăng nhập → **Lịch sử đặt phòng** → mở đơn → bấm **Hủy đặt phòng** (khi đơn chưa nhận phòng) nha. Muốn dời lịch thì ở trang đơn dùng mục **Đổi ngày lưu trú** — hệ thống báo ngay phòng còn trống và giá mới (trước giờ nhận phòng ít nhất 6 tiếng). Cần gấp thì nhắn Zalo cho Sóng là nhanh nhất 💬
chat.thanks=Không có gì đâu nè 🥰 Chúc bạn có chuyến đi biển thật vui. Cần gì cứ gọi Sóng nha!
chat.bye=Tạm biệt bạn 👋 Hẹn gặp bạn ở vịnh Hạ Long nha 🌊
chat.unknown.intro=Ui, câu này Sóng chưa hiểu lắm 🥺 Bạn thử hỏi kiểu:
chat.unknown.1=• "Phòng view biển giá bao nhiêu?"

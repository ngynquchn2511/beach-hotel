spring.application.name=beach-hotel

# Database - doi lai username/password cho phu hop voi may cua ban
spring.datasource.url=jdbc:mysql://localhost:3306/beach_hotel?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Upload anh (phong, combo...)
# Video danh gia toi da 30MB/tep (anh van chan o 5MB trong FileStorageService)
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=160MB
# Doc het request qua co de tra ve thong bao than thien thay vi ngat ket noi
server.tomcat.max-swallow-size=200MB
app.upload.base-dir=uploads

# Anh nen tung trang da di kem project (static/page-images). Dat PAGE_IMAGES_DIR neu muon dung thu muc anh rieng (uu tien hon)
app.page-images.dir=${PAGE_IMAGES_DIR:}

# Tao san 4 hang phong + 10 phong + 3 combo hai san mau khi DB con trong (chi dung tren may dev, prod tat)
app.seed-sample-rooms=true

# Du lieu demo nhu that ~16 thang van hanh (DemoDataSeeder) - chi bat 1 lan tren may dev: DEMO_DATA=true
app.seed-demo-data=${DEMO_DATA:false}

# Dia chi website, dung de tao link xem don gui trong email
app.base-url=${APP_BASE_URL:http://localhost:8080}

# So dien thoai Zalo cua resort - nut "Nhan Zalo" noi tren web. De trong (ZALO_PHONE=) thi an nut
app.contact.zalo-phone=${ZALO_PHONE:0337196258}

# Email tu dong: nhac lich truoc ngay nhan phong + moi danh gia sau tra phong (GuestEmailScheduler, moi gio).
# May dev TAT mac dinh vi du lieu gia lap dung dia chi gmail that - bat bang GUEST_EMAILS_ENABLED=true khi can thu
app.mail.guest-emails.enabled=${GUEST_EMAILS_ENABLED:false}

# Server
server.port=8080

# Hien chi tiet loi tren trinh duyet de de debug (chi dung trong qua trinh phat trien)
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always

# Song ngu Viet/Anh cho trang khach: mac dinh tieng Viet, doi bang ?lang=en (nho qua cookie) - cau hinh trong WebConfig.
# Locale cung quyet dinh dau phan cach hang nghin cua #numbers.formatDecimal(): vi -> 1.500.000, en -> 1,500,000

# Cau hinh gui email xac nhan dat phong (Gmail SMTP)
# Dat bien moi truong MAIL_USERNAME va MAIL_PASSWORD truoc khi chay ung dung.
# MAIL_PASSWORD phai la Gmail App Password 16 ky tu, khong phai mat khau Gmail thuong.
# Vi du PowerShell: $env:MAIL_USERNAME="your@gmail.com"; $env:MAIL_PASSWORD="xxxx xxxx xxxx xxxx"
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Thanh toan chuyen khoan khi check-out - QR VietQR (doi lai thong tin tai khoan nhan tien cua khach san)
# bank-id: ma ngan hang theo VietQR (VD: MB, VCB, TCB, ACB, BIDV, ICB...)
app.payment.bank-id=${PAYMENT_BANK_ID:MSB}
app.payment.account-no=${PAYMENT_ACCOUNT_NO:7825112004}
app.payment.account-name=${PAYMENT_ACCOUNT_NAME:NGUYEN QUOC HOAN}

# Dat coc online qua VNPay (sandbox). Dang ky tai khoan test tai https://sandbox.vnpayment.vn/devreg/
# roi dien 2 bien moi truong duoi day; bo trong thi an nut VNPay, khach chuyen khoan QR nhu cu.
# IPN URL khai bao voi VNPay: <dia chi public>/payment/vnpay/ipn
app.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
# Xac thuc 2 buoc (ma OTP qua email) khi dang nhap cong quan tri. Chua cau hinh mail thi tu bo qua
app.security.admin-otp=${ADMIN_OTP:true}
# API hoan tien (nut "Hoan qua VNPay" o trang don cua le tan)
app.vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}

# Bao cao cuoi ngay (night audit) gui luc 23h30: danh sach email cach nhau dau phay; bo trong = gui cac tai khoan ADMIN
app.daily-report.recipients=${DAILY_REPORT_TO:}
app.daily-report.enabled=${DAILY_REPORT_ENABLED:true}

# Tro ly phan tich quan tri bang AI (Claude): dat ANTHROPIC_API_KEY de bat; bo trong = chi co nhan dinh tu dong
app.ai.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=${AI_MODEL:claude-haiku-5-5}
app.ai.enabled=${AI_ENABLED:true}
app.ai.fallbacks=${AI_FALLBACKS:auto}
# Bao cao quan tri thang (lai lo + nhan dinh) gui 8h ngay 1 cho cung nguoi nhan bao cao cuoi ngay
app.monthly-report.enabled=${MONTHLY_REPORT_ENABLED:true}

<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="#{error.title}">Không tìm thấy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="p-5 bg-white rounded shadow-sm text-center" style="max-width: 560px;">
        <i class="bi bi-compass d-block mb-3" style="font-size: 3rem; color: var(--blue);"></i>
        <h1 class="fw-bold mb-3" th:utext="#{error.heading}">Không tìm thấy <span class="gradient-text">nội dung</span></h1>
        <p class="text-muted mb-4" th:text="${errorMessage != null} ? ${errorMessage} : #{error.default}">Nội dung bạn tìm không tồn tại hoặc đã bị thay đổi.</p>
        <a th:href="@{/}" class="btn btn-primary" th:text="#{auth.register.home}">Về trang chủ</a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

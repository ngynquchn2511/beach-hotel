<!-- Anh / video dinh kem cua 1 danh gia: anh bam de xem lon (tab moi), video phat ngay tai cho.
     Style viet inline de nhung duoc o bat ky trang nao (trang khach, trang quan tri) ma khong can them CSS. -->
<div th:fragment="gallery(items)" th:if="${items != null and !#lists.isEmpty(items)}"
     style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
    <th:block th:each="m : ${items}">
        <a th:unless="${m.video}" th:href="${m.url}" target="_blank" rel="noopener" th:title="#{review.media.photo}">
            <img th:src="${m.url}" loading="lazy" th:alt="#{review.media.photo}"
                 style="width: 112px; height: 84px; object-fit: cover; border-radius: 8px; border: 1.5px solid #0e3a52; display: block;">
        </a>
        <video th:if="${m.video}" th:src="${m.url}" controls preload="metadata" playsinline th:title="#{review.media.video}"
               style="width: 168px; height: 112px; border-radius: 8px; border: 1.5px solid #0e3a52; background: #000;"></video>
    </th:block>
</div>

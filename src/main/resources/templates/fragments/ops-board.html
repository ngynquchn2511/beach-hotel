<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- Dung chung cho Tong quan (quan tri) va Hom nay (le tan): danh sach viec ton + so do phong -->
<body>
    <style th:fragment="styles">
        .xb-card { background: #fff; border-radius: .75rem; box-shadow: 0 1px 3px rgba(19,57,94,.12); padding: 1rem; height: 100%; }
        .xb-title { font-weight: 700; font-size: .95rem; margin-bottom: .6rem; display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
        .xb-title a { font-weight: 500; font-size: .8rem; }
        .xb-alert { display: flex; align-items: center; gap: .6rem; padding: .45rem .7rem; border-radius: .5rem; text-decoration: none; color: inherit; border-left: 4px solid; margin-bottom: .35rem; }
        .xb-alert:hover { filter: brightness(.97); }
        .xb-alert .cnt { margin-left: auto; font-weight: 800; font-size: 1.05rem; }
        .xb-alert.danger { background: #fdecee; border-color: #dc3545; }
        .xb-alert.warning { background: #fff6e0; border-color: #f0ad00; }
        .xb-alert.info { background: #eaf5fc; border-color: #3d9bd6; }
    </style>

                <div th:fragment="alerts(board)" class="xb-card mb-3" id="can-xu-ly">
                    <div class="xb-title">
                        <span><i class="bi bi-exclamation-triangle-fill text-warning me-1"></i>Cần xử lý
                            <span class="badge bg-danger ms-1" th:if="${board.urgentCount > 0}" th:text="${board.urgentCount} + ' gấp'"></span>
                            <span class="badge bg-secondary ms-1" th:text="${board.alertTotal} + ' việc'"></span></span>
                    </div>
                    <div th:if="${#lists.isEmpty(board.alerts)}" class="text-success fw-semibold">
                        <i class="bi bi-check-circle-fill"></i> Không có việc tồn. Mọi thứ đang ổn.
                    </div>
                    <div class="row g-2" th:unless="${#lists.isEmpty(board.alerts)}">
                        <div class="col-md-6" th:each="a : ${board.alerts}">
                            <a class="xb-alert" th:classappend="${a.level}" th:href="@{${a.link}}">
                                <i class="bi" th:classappend="${a.icon}"></i>
                                <span th:text="${a.label}"></span>
                                <span class="cnt" th:text="${a.count}"></span>
                                <i class="bi bi-chevron-right small text-muted"></i>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- 3. So do phong: chia theo tang, moi o 1 trang thai ro rang (bieu tuong + chu), thanh ti le + loc theo chu thich -->
                <div th:fragment="roomMap(rooms, ops)" class="xb-card mb-3" id="so-do-phong"
                     th:with="BS=${T(com.hotel.service.ExecutiveBoardService)}, cnt=${BS.stateCounts(rooms)}, total=${#lists.size(rooms)},
                              leaving=${#lists.size(rooms.?[leavingToday])}">
                    <style>
                        .rm-bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: #eef2f6; margin-bottom: .6rem; }
                        .rm-bar > div { height: 100%; }
                        .rm-chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .5rem; }
                        .rm-chip { display: inline-flex; align-items: center; gap: .35rem; border: 1.5px solid #dfe6ee; background: #fff; border-radius: 999px;
                            padding: .2rem .65rem; font-size: .8rem; cursor: pointer; color: #1f3b57; }
                        .rm-chip b { font-size: .95rem; }
                        .rm-chip .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
                        .rm-chip.on { border-color: #13395e; box-shadow: 0 0 0 2px rgba(19,57,94,.15); }
                        .rm-help { font-size: .75rem; color: #6c7a89; margin-bottom: .6rem; }
                        .rm-floor { display: flex; gap: .6rem; align-items: stretch; padding: .45rem 0; border-top: 1px dashed #e3e9ef; }
                        .rm-floor:first-of-type { border-top: 0; }
                        .rm-floor-lbl { flex: 0 0 58px; display: flex; flex-direction: column; justify-content: center; align-items: center;
                            background: #f4f7fa; border-radius: .5rem; font-weight: 800; color: #13395e; font-size: .9rem; line-height: 1.1; }
                        .rm-floor-lbl small { font-weight: 500; font-size: .65rem; color: #6c7a89; }
                        .rm-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: .4rem; }
                        .rm { position: relative; display: block; border-radius: .55rem; padding: .35rem .45rem; border: 1.5px solid transparent;
                            font-size: .72rem; line-height: 1.25; text-decoration: none; color: inherit; transition: opacity .15s, transform .1s; min-height: 58px; }
                        a.rm:hover { transform: translateY(-2px); box-shadow: 0 3px 8px rgba(19,57,94,.18); }
                        #so-do-phong .rm { text-decoration: none; }
                        #so-do-phong .rm * { color: inherit; }
                        .rm .top { display: flex; justify-content: space-between; align-items: center; }
                        .rm .no { font-weight: 800; font-size: .95rem; }
                        .rm .top i { font-size: .95rem; }
                        .rm .st { font-weight: 700; }
                        .rm .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .9; }
                        .rm .leave { position: absolute; top: -7px; right: 4px; font-size: .6rem; font-weight: 700; padding: 0 .35rem; border-radius: .4rem;
                            background: #f08c00; color: #fff; }
                        #so-do-phong .rm.free { background: #eaf8ef; border-color: #a6dcb8; color: #17663a; }
                        #so-do-phong .rm.arriving { background: #e7f3fd; border: 1.5px dashed #3d9bd6; color: #0b5c94; }
                        #so-do-phong .rm.occupied { background: #13395e; color: #fff; }
                        #so-do-phong .rm.overdue { background: #dc3545; color: #fff; }
                        #so-do-phong .rm.dirty { background: #fff4cf; border-color: #f2c24d; color: #7a5600; }
                        #so-do-phong .rm.maintenance { background: repeating-linear-gradient(135deg, #f3f4f6, #f3f4f6 6px, #e6e8eb 6px, #e6e8eb 12px);
                            border-color: #b8bec5; color: #5f6b76; }
                        #so-do-phong.filtering .rm:not(.hit) { opacity: .18; }
                    </style>
                    <div class="xb-title">
                        <span><i class="bi bi-grid-3x3-gap me-1"></i>Sơ đồ phòng
                            <span class="text-muted fw-normal small" th:text="'· ' + ${total} + ' phòng'"></span></span>
                        <a th:href="@{/admin/room-calendar}" th:if="${ops}">Lịch phòng <i class="bi bi-arrow-right"></i></a>
                    </div>

                    <!-- Thanh ti le trang thai -->
                    <div class="rm-bar" th:if="${total > 0}">
                        <div th:each="e : ${cnt}" th:if="${e.value > 0}" th:style="'width:' + ${e.value * 100.0 / total} + '%;background:' + ${BS.stateColor(e.key)}"
                             th:title="${BS.stateLabel(e.key)} + ': ' + ${e.value} + ' phòng'"></div>
                    </div>

                    <!-- Chu thich = nut loc -->
                    <div class="rm-chips">
                        <button type="button" class="rm-chip on" data-rm-filter="">Tất cả <b th:text="${total}"></b></button>
                        <button type="button" th:each="e : ${cnt}" class="rm-chip" th:attr="data-rm-filter=${e.key}" th:disabled="${e.value == 0}">
                            <span class="dot" th:style="'background:' + ${BS.stateColor(e.key)}"></span>
                            <span th:text="${BS.stateLabel(e.key)}"></span> <b th:text="${e.value}"></b>
                        </button>
                        <button type="button" class="rm-chip" data-rm-filter="leave" th:disabled="${leaving == 0}">
                            <span class="dot" style="background:#f08c00"></span>Trả phòng hôm nay <b th:text="${leaving}"></b>
                        </button>
                    </div>
                    <div class="rm-help"><i class="bi bi-info-circle me-1"></i>Bấm vào một ô chú thích để chỉ hiện các phòng đó<span th:if="${ops}">; bấm vào phòng có khách để mở đơn đặt phòng</span>.</div>

                    <!-- Tung tang -->
                    <div th:each="f : ${BS.byFloor(rooms)}" class="rm-floor">
                        <div class="rm-floor-lbl">
                            <span th:text="${f.key.matches('\d+')} ? 'Tầng ' + ${f.key} : 'Khu ' + ${f.key}"></span>
                            <small th:text="${#lists.size(f.value)} + ' phòng'"></small>
                        </div>
                        <div class="rm-grid">
                            <th:block th:each="t : ${f.value}" th:with="st=${t.state}, link=${ops and t.guest != null}">
                                <a class="rm" th:classappend="${st} + (${t.leavingToday} ? ' leave-today' : '')"
                                   th:attr="data-state=${st}, data-leave=${t.leavingToday}"
                                   th:href="${link} ? @{/admin/bookings/{id}(id=${t.guest.id})} : null"
                                   th:title="'Phòng ' + ${t.room.roomNumber} + ' · ' + ${t.room.roomType.name} + ' · ' + ${BS.stateLabel(st)}
                                        + (${t.guest != null} ? ' · Khách: ' + ${t.guest.guestName != null ? t.guest.guestName : ''} + ' (' + ${#temporals.format(t.guest.checkInDate, 'dd/MM')} + ' → ' + ${#temporals.format(t.guest.checkOutDate, 'dd/MM')} + ')' : '')">
                                    <span class="leave" th:if="${t.leavingToday}">Trả hôm nay</span>
                                    <div class="top">
                                        <span class="no" th:text="${t.room.roomNumber}"></span>
                                        <i class="bi" th:classappend="${BS.stateIcon(st)}"></i>
                                    </div>
                                    <th:block th:switch="${st}">
                                        <th:block th:case="'overdue'">
                                            <div class="st" th:text="'Quá hạn ' + ${t.overdueDays} + ' ngày'"></div>
                                            <div class="who" th:text="${t.shortGuest} ?: ('trả ' + ${#temporals.format(t.guest.checkOutDate, 'dd/MM')})"></div>
                                        </th:block>
                                        <th:block th:case="'occupied'">
                                            <div class="st" th:text="${t.guest != null} ? 'Ở đến ' + ${#temporals.format(t.guest.checkOutDate, 'dd/MM')} : 'Có khách'"></div>
                                            <div class="who" th:if="${t.shortGuest != null}" th:text="${t.shortGuest}"></div>
                                        </th:block>
                                        <th:block th:case="'arriving'">
                                            <div class="st">Đến hôm nay</div>
                                            <div class="who" th:if="${t.shortGuest != null}" th:text="${t.shortGuest}"></div>
                                        </th:block>
                                        <div th:case="'dirty'" class="st">Chờ dọn</div>
                                        <div th:case="'maintenance'" class="st">Bảo trì</div>
                                        <div th:case="*" class="st">Trống</div>
                                    </th:block>
                                </a>
                            </th:block>
                        </div>
                    </div>
                    <script>
                        (function () {
                            var box = document.getElementById('so-do-phong');
                            var chips = box.querySelectorAll('[data-rm-filter]');
                            chips.forEach(function (c) {
                                c.addEventListener('click', function () {
                                    var f = c.getAttribute('data-rm-filter');
                                    if (c.classList.contains('on') && f) { f = ''; }
                                    chips.forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-rm-filter') === f); });
                                    box.classList.toggle('filtering', f !== '');
                                    box.querySelectorAll('.rm').forEach(function (r) {
                                        var hit = f === 'leave' ? r.getAttribute('data-leave') === 'true' : r.getAttribute('data-state') === f;
                                        r.classList.toggle('hit', hit);
                                    });
                                });
                            });
                        })();
                    </script>
                </div>
</body>
</html>

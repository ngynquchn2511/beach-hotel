<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{group.confirmTitle}">Đặt nhiều phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut" th:style="'--page-bg: url(' + @{/page-images/xacnhandatphong.jpg} + ')'">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1" style="max-width: 760px;">
    <div class="eaut-head">
        <div class="eyebrow" th:text="#{group.eyebrow}">Gia đình / đoàn</div>
        <h1 th:text="#{group.confirmTitle}">Đặt nhiều phòng</h1>
        <div class="divider"></div>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="bg-white p-4 rounded shadow-sm mb-4">
        <p class="mb-2" th:text="#{group.dates(${#temporals.format(checkIn, 'dd/MM/yyyy')}, ${#temporals.format(checkOut, 'dd/MM/yyyy')}, ${nights})}"></p>
        <table class="table align-middle mb-0">
            <tbody>
            <tr th:each="l : ${lines}">
                <td><b th:text="#{common.room(${l.room.roomNumber})}"></b>
                    <div class="small text-muted" th:text="${l.room.roomType.localizedName}"></div></td>
                <td class="text-end">
                    <div th:text="${#numbers.formatDecimal(l.total, 1, 'POINT', 0, 'COMMA')} + ' VND'"></div>
                    <div class="small text-success" th:if="${l.promotionAmount.signum() > 0}"
                         th:text="'-' + ${#numbers.formatDecimal(l.promotionAmount, 1, 'POINT', 0, 'COMMA')} + ' VND'"></div>
                </td>
            </tr>
            <tr class="fw-bold">
                <td th:text="#{group.total}">Tổng tiền phòng</td>
                <td class="text-end" th:text="${#numbers.formatDecimal(grandTotal, 1, 'POINT', 0, 'COMMA')} + ' VND'"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <form th:action="@{/customer/bookings/group/new}" method="post" class="bg-white p-4 rounded shadow-sm">
        <input type="hidden" name="checkIn" th:value="${checkIn}">
        <input type="hidden" name="checkOut" th:value="${checkOut}">
        <input type="hidden" name="roomIds" th:each="id : ${roomIds}" th:value="${id}">

        <h5 class="fw-bold mb-3" th:text="#{success.guestInfo}">Thông tin người nhận phòng</h5>
        <div class="row g-3 mb-3">
            <div class="col-md-4"><label class="form-label" th:text="#{confirm.fullName}">Họ tên</label>
                <input type="text" name="guestName" class="form-control" maxlength="100" required th:value="${guestName}"></div>
            <div class="col-md-4"><label class="form-label" th:text="#{confirm.phone}">Số điện thoại</label>
                <input type="text" name="guestPhone" class="form-control" maxlength="20" required th:value="${guestPhone}"></div>
            <div class="col-md-4"><label class="form-label" th:text="#{confirm.email}">Email</label>
                <input type="email" name="guestEmail" class="form-control" maxlength="100" required th:value="${guestEmail}"></div>
            <div class="col-md-6"><label class="form-label" th:text="#{confirm.checkInTime}">Giờ nhận phòng</label>
                <select name="checkInTime" class="form-select"><option th:each="t : ${checkInOptions}" th:value="${t}" th:text="${t}"></option></select></div>
            <div class="col-md-6"><label class="form-label" th:text="#{confirm.checkOutTime}">Giờ trả phòng</label>
                <select name="checkOutTime" class="form-select">
                    <option th:each="t : ${checkOutOptions}" th:value="${t}" th:text="${t}" th:selected="${t.hour == 12}"></option></select></div>
        </div>

        <h6 class="fw-bold" th:text="#{group.guestsPerRoom}">Số khách mỗi phòng</h6>
        <div class="row g-2 mb-3">
            <div class="col-6 col-md-4" th:each="l : ${lines}">
                <label class="form-label small" th:for="'g' + ${l.room.id}" th:text="#{common.room(${l.room.roomNumber})}"></label>
                <input type="number" class="form-control form-control-sm" min="1" th:max="${l.room.roomType.maxGuests}"
                       th:id="'g' + ${l.room.id}" th:name="'guests_' + ${l.room.id}" th:value="${l.room.roomType.maxGuests}" required>
            </div>
        </div>
        <p class="small text-muted" th:text="#{group.note}"></p>
        <button type="submit" class="btn btn-primary w-100" th:text="#{group.submit(${#lists.size(lines)})}">Đặt các phòng</button>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

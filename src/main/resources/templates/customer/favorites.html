<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{favorite.title}">Phòng yêu thích</title>
    <meta name="robots" content="noindex">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
    <style>
        .fav-card img, .fav-card .no-image { height: 180px; object-fit: cover; }
        .fav-card .no-image { display: grid; place-items: center; background: #eaf6ff; color: #6b8aa6; }
    </style>
</head>
<body class="eaut">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1">
    <div class="eaut-head">
        <div class="eyebrow" th:text="#{history.eyebrow}">Tài khoản của bạn</div>
        <h1 th:utext="#{favorite.heading}">Phòng <span class="gradient-text">yêu thích</span></h1>
        <div class="divider"></div>
    </div>

    <div th:if="${favoriteMessage}" class="alert alert-success" role="status" th:text="${favoriteMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div th:if="${#lists.isEmpty(rooms)}" class="alert alert-info">
        <span th:text="#{favorite.empty}">Bạn chưa lưu phòng nào. Bấm biểu tượng trái tim ở trang phòng để lưu lại.</span>
        <a th:href="@{/rooms}" th:text="#{favorite.browse}">Xem danh sách phòng</a>
    </div>

    <div class="row g-4" th:if="${not #lists.isEmpty(rooms)}">
        <div class="col-sm-6 col-lg-4" th:each="room : ${rooms}">
            <div class="card h-100 fav-card">
                <img th:if="${room.coverImageUrl}" th:src="${room.coverImageUrl}" class="card-img-top" th:alt="#{common.roomPhoto}">
                <div th:unless="${room.coverImageUrl}" class="no-image" th:text="#{common.noPhoto}">Chưa có ảnh</div>
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start gap-2">
                        <h5 class="card-title mb-1" th:text="#{common.room(${room.roomNumber})}"></h5>
                        <th:block th:replace="~{fragments/favorite :: heart(${room}, 'btn-sm')}"></th:block>
                    </div>
                    <p class="text-muted mb-1" th:text="${room.roomType.localizedName}"></p>
                    <p class="fw-bold text-primary" th:text="#{common.pricePerNight(${#numbers.formatDecimal(room.price, 1, 'POINT', 0, 'COMMA')})}"></p>
                    <a th:href="@{/customer/rooms/{id}(id=${room.id})}" class="btn btn-primary btn-sm mt-auto" th:text="#{rooms.detailAndBook}">Xem chi tiết &amp; đặt phòng</a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

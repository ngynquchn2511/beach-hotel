<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{svc.choose.title}">Chọn đơn để đặt tour</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<!-- Buoc chon don phong khi khach bam "Dat tour nay" ma co nhieu don (hoac chua co don nao) -->
<body class="eaut" th:style="'--page-bg: url(' + @{/page-images/beach-hon-mun.jpg} + ')'">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1">
    <div class="eaut-head">
        <div class="eyebrow" th:text="#{svc.hero.eyebrow}">DỊCH VỤ THÊM</div>
        <h1 th:text="#{svc.choose.heading(${tour.localizedName})}">Đặt tour</h1>
        <div class="divider"></div>
        <p th:text="#{svc.choose.lead(${#temporals.format(tour.departureTime, 'HH:mm')}, ${#numbers.formatDecimal(tour.pricePerPerson, 1, 'POINT', 0, 'COMMA')})}"></p>
    </div>

    <div class="bg-white p-4 rounded shadow-sm" th:if="${#lists.isEmpty(bookings)}">
        <h2 class="h5 fw-bold" th:text="#{svc.choose.none}">Bạn chưa có đơn phòng nào còn hiệu lực</h2>
        <p class="text-muted" th:text="#{svc.choose.noneHint}"></p>
        <a th:href="@{/rooms}" class="btn btn-primary me-2"><i class="bi bi-door-open me-1"></i><span th:text="#{svc.cta.book}">Đặt phòng ngay</span></a>
        <a th:href="@{/services}" class="btn btn-outline-secondary" th:text="#{svc.choose.back}">Quay lại dịch vụ</a>
    </div>

    <div class="bg-white p-2 p-md-3 rounded shadow-sm table-responsive" th:unless="${#lists.isEmpty(bookings)}">
        <p class="px-2 pt-1" th:text="#{svc.choose.pick}">Chọn đơn phòng muốn đặt kèm tour:</p>
        <table class="table align-middle mb-0">
            <thead>
            <tr>
                <th th:text="#{svc.choose.col.booking}">Đơn</th>
                <th th:text="#{svc.choose.col.room}">Phòng</th>
                <th th:text="#{svc.choose.col.stay}">Thời gian ở</th>
                <th th:text="#{svc.choose.col.status}">Trạng thái</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${bookings}">
                <td class="fw-bold" th:text="'#' + ${b.id}"></td>
                <td th:text="#{common.room(${b.room.roomNumber})}"></td>
                <td th:text="${#temporals.format(b.checkInDate, 'dd/MM/yyyy')} + ' – ' + ${#temporals.format(b.checkOutDate, 'dd/MM/yyyy')}"></td>
                <td><span th:class="'badge ' + ${b.status.badgeClass}" th:text="#{'enum.BookingStatus.' + ${b.status}}"></span></td>
                <td class="text-end">
                    <a th:href="@{/customer/bookings/{id}(id=${b.id},tourId=${tour.id})} + '#dich-vu'" class="btn btn-sm btn-primary"
                       th:text="#{svc.choose.select}">Chọn đơn này</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:replace="~{fragments/pagination :: pager(${pager})}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/chatbot-widget :: widget}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title th:text="#{group.pageTitle(${group.code})}">Đoàn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut" th:style="'--page-bg: url(' + @{/page-images/xacnhandatphong.jpg} + ')'">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1" style="max-width: 760px;">
    <div class="eaut-head">
        <div class="eyebrow" th:text="#{group.eyebrow}">Gia đình / đoàn</div>
        <h1 th:text="#{group.pageTitle(${group.code})}">Đoàn G1</h1>
        <div class="divider"></div>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <!-- Coc gop ca doan: 1 lan chuyen khoan -->
    <div class="bg-white p-4 rounded shadow-sm mb-4" th:if="${deposit.signum() > 0}">
        <h5 class="fw-bold mb-2"><i class="bi bi-shield-check me-2"></i><span th:text="#{success.depositTitle}">Chuyển cọc để giữ phòng</span></h5>
        <p th:text="#{group.depositText(${#numbers.formatDecimal(deposit, 1, 'POINT', 0, 'COMMA')})}"></p>
        <div class="row g-3 align-items-center">
            <div class="col-sm-5 text-center"><img th:src="${depositQrUrl}" th:alt="#{success.qrAlt}" class="img-fluid rounded border" style="max-width: 240px;"></div>
            <div class="col-sm-7 small">
                <p class="mb-1"><span th:text="#{success.bank}">Ngân hàng:</span> <b th:text="${bankId}"></b></p>
                <p class="mb-1"><span th:text="#{success.accountNo}">Số tài khoản:</span> <b th:text="${accountNo}"></b></p>
                <p class="mb-1"><span th:text="#{success.accountName}">Chủ tài khoản:</span> <b th:text="${accountName}"></b></p>
                <p class="mb-1"><span th:text="#{success.content}">Nội dung:</span> <b th:text="'HB ' + ${group.code} + ' COC'"></b></p>
            </div>
        </div>
        <form th:if="${vnpayEnabled}" method="post" class="border-top pt-3 mt-3"
              th:action="@{/customer/bookings/group/{id}/vnpay(id=${group.id})}">
            <input type="hidden" name="token" th:if="${accessToken != null}" th:value="${accessToken}">
            <p class="small text-muted mb-2" th:text="#{vnpay.groupOr}"></p>
            <button type="submit" class="btn btn-primary"><i class="bi bi-credit-card me-1"></i><span th:text="#{vnpay.groupPay}">Thanh toán cọc cả đoàn qua VNPay</span></button>
        </form>
    </div>

    <div class="bg-white p-4 rounded shadow-sm mb-4">
        <table class="table align-middle mb-0">
            <tbody>
            <tr th:each="b : ${bookings}">
                <td><b th:text="#{common.room(${b.room.roomNumber})}"></b>
                    <div class="small text-muted" th:text="${b.room.roomType.localizedName} + ' · #' + ${b.id}"></div></td>
                <td><span th:class="'badge ' + ${b.status.badgeClass}" th:text="#{'enum.BookingStatus.' + ${b.status}}"></span></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(b.totalAmount, 1, 'POINT', 0, 'COMMA')} + ' VND'"></td>
                <td class="text-end"><a class="btn btn-sm btn-outline-primary"
                                        th:href="@{/customer/bookings/{id}(id=${b.id}, token=${b.accessToken})}" th:text="#{common.viewDetails}">Xem</a></td>
            </tr>
            <tr class="fw-bold">
                <td colspan="2" th:text="#{group.total}">Tổng tiền phòng</td>
                <td class="text-end" th:text="${#numbers.formatDecimal(total, 1, 'POINT', 0, 'COMMA')} + ' VND'"></td>
                <td></td>
            </tr>
            </tbody>
        </table>
    </div>

    <form th:if="${canCancel}" th:action="@{/customer/bookings/group/{id}/cancel(id=${group.id})}" method="post"
          th:attr="onsubmit=|return confirm('#{group.cancelConfirm}')|">
        <input type="hidden" name="token" th:if="${accessToken}" th:value="${accessToken}">
        <button type="submit" class="btn btn-outline-danger w-100" th:text="#{group.cancel}">Hủy cả đoàn</button>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

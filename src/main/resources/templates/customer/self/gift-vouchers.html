<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{self.gv.title}">Thẻ quà tặng của tôi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut" th:style="'--page-bg: url(' + @{/page-images/lichsudatphong.jpg} + ')'">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1" style="max-width: 900px;">
    <div class="eaut-head">
        <div class="eyebrow" th:text="#{history.eyebrow}">Tài khoản của bạn</div>
        <h1 th:text="#{self.gv.title}">Thẻ quà tặng của tôi</h1>
        <div class="divider"></div>
    </div>
    <div th:replace="~{customer/self/tabs :: tabs('gift')}"></div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <p class="text-muted small mb-0" th:text="#{self.gv.lead}"></p>
        <a th:href="@{/gift-vouchers}" class="btn btn-sm btn-primary"><i class="bi bi-gift me-1"></i><span th:text="#{self.gv.buy}">Mua thẻ</span></a>
    </div>

    <div th:if="${#lists.isEmpty(vouchers)}" class="alert alert-info" th:text="#{self.gv.empty}">Bạn chưa có thẻ quà tặng nào.</div>

    <div th:each="v : ${vouchers}" class="bg-white rounded shadow-sm p-4 mb-3"
         th:with="mine=${#strings.equalsIgnoreCase(v.purchaserEmail, myEmail)},
                  expired=${v.expiresAt != null and v.expiresAt.isBefore(now)}">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
            <div>
                <div class="font-monospace fs-5 fw-bold" th:text="${v.code}"></div>
                <div class="small text-muted" th:text="${mine} ? #{self.gv.bought(${v.recipientName} + ' (' + ${v.recipientEmail} + ')')} : #{self.gv.received(${v.purchaserName})}"></div>
            </div>
            <div class="text-end">
                <span class="badge" th:if="${!expired}" th:classappend="${v.status.name() == 'ACTIVE'} ? 'bg-success' : (${v.status.name() == 'PENDING_PAYMENT'} ? 'bg-warning text-dark' : 'bg-secondary')"
                      th:text="#{'gv.status.' + ${v.status}}"></span>
                <span class="badge bg-secondary" th:if="${expired}" th:text="#{self.gv.expired}"></span>
                <span class="badge bg-secondary" th:if="${v.status.name() == 'ACTIVE' and v.balance.signum() == 0}" th:text="#{self.gv.empty_balance}"></span>
            </div>
        </div>
        <div class="mt-2" th:if="${v.status.name() == 'ACTIVE'}">
            <div th:text="#{self.gv.balance(${#numbers.formatDecimal(v.balance, 1, 'POINT', 0, 'COMMA')}, ${#numbers.formatDecimal(v.amount, 1, 'POINT', 0, 'COMMA')})}"></div>
            <div class="progress mt-1" style="height: 6px;" role="progressbar">
                <div class="progress-bar" th:style="'width:' + ${percents[v.id]} + '%'"></div>
            </div>
            <div class="small text-muted mt-1" th:if="${v.expiresAt != null}" th:text="#{self.gv.expires(${#temporals.format(v.expiresAt, 'dd/MM/yyyy')})}"></div>
        </div>
        <div class="small text-muted mt-1" th:if="${v.message != null and !#strings.isEmpty(v.message)}" th:text="'“' + ${v.message} + '”'"></div>

        <div class="small mt-2" th:unless="${#lists.isEmpty(usages[v.id])}">
            <span class="text-muted" th:text="#{self.gv.used}">Đã dùng cho đơn</span>
            <th:block th:each="b, st : ${usages[v.id]}">
                <a th:if="${b.customer != null and #strings.equalsIgnoreCase(b.customer.email, myEmail)}"
                   th:href="@{/customer/bookings/{id}(id=${b.id})}" th:text="'#' + ${b.id}"></a><span
                    th:unless="${b.customer != null and #strings.equalsIgnoreCase(b.customer.email, myEmail)}" th:text="'#' + ${b.id}"></span>
                <span th:text="'(-' + ${#numbers.formatDecimal(b.giftVoucherAmount, 1, 'POINT', 0, 'COMMA')} + ')' + (${st.last} ? '' : ',')"></span>
            </th:block>
        </div>

        <div class="d-flex gap-2 mt-3 flex-wrap" th:if="${mine}">
            <a th:if="${v.status.name() == 'PENDING_PAYMENT'}" class="btn btn-sm btn-primary"
               th:href="@{/gift-vouchers/{id}(id=${v.id}, token=${v.accessToken})}" th:text="#{self.gv.pay}">Thanh toán thẻ</a>
            <form th:if="${v.status.name() == 'ACTIVE' and !expired}" method="post" th:action="@{/customer/account/gift-vouchers/{id}/resend(id=${v.id})}">
                <button type="submit" class="btn btn-sm btn-outline-secondary"><i class="bi bi-envelope me-1"></i><span th:text="#{self.gv.resend}">Gửi lại</span></button>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

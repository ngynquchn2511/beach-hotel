<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{self.invoices.title}">Hóa đơn của tôi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut" th:style="'--page-bg: url(' + @{/page-images/lichsudatphong.jpg} + ')'">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1" style="max-width: 980px;">
    <div class="eaut-head">
        <div class="eyebrow" th:text="#{history.eyebrow}">Tài khoản của bạn</div>
        <h1 th:text="#{self.invoices.title}">Hóa đơn của tôi</h1>
        <div class="divider"></div>
    </div>
    <div th:replace="~{customer/self/tabs :: tabs('invoices')}"></div>
    <p class="text-muted small" th:text="#{self.invoices.lead}"></p>

    <div th:if="${#lists.isEmpty(lines)}" class="alert alert-info" th:text="#{self.invoices.empty}">Chưa có hóa đơn nào.</div>
    <div class="bg-white rounded shadow-sm p-2 p-md-3 table-responsive" th:unless="${#lists.isEmpty(lines)}">
        <table class="table align-middle mb-0">
            <thead><tr>
                <th th:text="#{history.col.id}">Mã đơn</th>
                <th th:text="#{self.invoices.col.paidAt}">Ngày thanh toán</th>
                <th class="text-end" th:text="#{self.invoices.col.amount}">Số tiền</th>
                <th th:text="#{history.col.payment}">Thanh toán</th>
                <th th:text="#{self.invoices.col.vat}">Hóa đơn VAT</th>
                <th></th>
            </tr></thead>
            <tbody>
            <tr th:each="l : ${lines}" th:with="b=${l.booking}">
                <td><a class="fw-bold" th:href="@{/customer/bookings/{id}(id=${b.id})}" th:text="'#' + ${b.id}"></a>
                    <div class="small text-muted" th:text="#{common.room(${b.room.roomNumber})} + ' · ' + ${#temporals.format(b.checkInDate, 'dd/MM')} + ' - ' + ${#temporals.format(b.checkOutDate, 'dd/MM/yyyy')}"></div></td>
                <td class="text-nowrap" th:text="${#temporals.format(l.payment.paymentDate, 'dd/MM/yyyy')}"></td>
                <td class="text-end text-nowrap" th:text="${#numbers.formatDecimal(l.payment.amount, 1, 'POINT', 0, 'COMMA')} + ' VND'"></td>
                <td class="small" th:text="#{'enum.PaymentMethod.' + ${l.payment.paymentMethod}}"></td>
                <td class="small">
                    <th:block th:if="${b.companyInvoice}">
                        <div th:text="${b.invoiceCompanyName}"></div>
                        <span th:if="${b.EInvoiceNumber != null}" class="badge bg-success"
                              th:text="#{ci.issued(${b.EInvoiceNumber}, ${#temporals.format(b.EInvoiceIssuedAt, 'dd/MM/yyyy')})}"></span>
                        <span th:if="${b.EInvoiceNumber == null}" class="badge bg-warning text-dark" th:text="#{self.invoices.vatPending}"></span>
                    </th:block>
                    <span th:unless="${b.companyInvoice}" class="text-muted" th:text="#{self.invoices.vatNone}"></span>
                </td>
                <td class="text-nowrap text-end">
                    <a target="_blank" th:href="@{/customer/bookings/{id}/invoice(id=${b.id})}" class="btn btn-sm btn-outline-success"
                       th:text="#{history.invoice}">Hóa đơn</a>
                    <a target="_blank" th:href="@{/customer/bookings/{id}/invoice.pdf(id=${b.id})}" class="btn btn-sm btn-outline-success"
                       th:title="#{invoice.pdf}"><i class="bi bi-file-earmark-pdf"></i> PDF</a>
                </td>
            </tr>
            </tbody>
        </table>
        <div th:replace="~{fragments/pagination :: pager(${pager})}"></div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{search.title}">Tìm phòng</title>
    <th:block th:replace="~{fragments/seo :: meta(#{search.title} + ' | Sóng Xanh Resort', #{seo.rooms.desc}, '/page-images/rooms/suite-1.jpg', '/customer/rooms')}"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
    <style>
        .room-results-box {
            max-height: 640px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            background: white;
        }
        .room-row {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }
        .room-row:last-child {
            border-bottom: none;
        }
        .room-row[data-detail-url] {
            cursor: pointer;
        }
        .room-row[data-detail-url]:hover {
            background: #f8f9fa;
        }
        .room-row img, .room-row .no-image {
            width: 220px;
            height: 150px;
            object-fit: cover;
            border-radius: 0.375rem;
            flex-shrink: 0;
        }
        .no-image {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f1f1;
            color: #888;
        }
    </style>
</head>
<body class="eaut" th:style="'--page-bg: url(' + @{/page-images/timphong.jpg} + ')'">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1">
    <div class="eaut-head">
        <div class="eyebrow" th:text="#{search.eyebrow}">Đặt phòng trực tuyến</div>
        <h1 th:utext="#{search.heading}">Tìm <span class="gradient-text">phòng trống</span></h1>
        <div class="divider"></div>
        <p th:text="#{search.lead}">Chọn ngày nhận, trả phòng và số khách để xem các phòng còn trống.</p>
    </div>

    <div class="bg-white p-4 rounded shadow-sm mb-4">
        <form th:action="@{/customer/rooms}" method="get" class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label" th:text="#{search.checkIn}">Ngày nhận phòng</label>
                <input type="date" name="checkIn" class="form-control" th:value="${checkIn}" th:min="${today}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label" th:text="#{search.checkOut}">Ngày trả phòng</label>
                <input type="date" name="checkOut" class="form-control" th:value="${checkOut}" th:min="${today}" required>
            </div>
            <div class="col-md-2">
                <label class="form-label" th:text="#{search.guests}">Số khách</label>
                <input type="number" name="guests" min="1" class="form-control" th:value="${guests}">
            </div>
            <div class="col-md-2">
                <label class="form-label" th:text="#{common.roomType}">Loại phòng</label>
                <select name="roomTypeId" class="form-select">
                    <option value="" th:text="#{common.all}">Tất cả</option>
                    <option th:each="rt : ${roomTypes}" th:value="${rt.id}" th:text="${rt.localizedName}"
                            th:selected="${rt.id == roomTypeId}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100" th:text="#{search.submit}">Tìm phòng</button>
            </div>
        </form>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div th:if="${searched and pager != null and pager.totalItems == 0 and #strings.isEmpty(price)}" class="alert alert-info" th:text="#{search.empty}">
        Không tìm thấy phòng trống phù hợp với ngày và tiêu chí bạn chọn.
    </div>

    <div class="row g-4" th:if="${pager != null and (pager.totalItems > 0 or not #strings.isEmpty(price))}">
        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="text-muted" th:text="#{search.found(${pager.totalItems})}"></span>
                <select id="sortSelect" class="form-select form-select-sm" style="width: auto;">
                    <option value="" th:text="#{search.sort}">Sắp xếp theo</option>
                    <option value="price-asc" th:text="#{search.sortAsc}" th:selected="${sort == 'price-asc'}">Giá tăng dần</option>
                    <option value="price-desc" th:text="#{search.sortDesc}" th:selected="${sort == 'price-desc'}">Giá giảm dần</option>
                </select>
            </div>

            <div th:if="${pager.totalItems == 0}" class="alert alert-info" th:text="#{rooms.empty}">Không có phòng nào phù hợp.</div>

            <div class="room-results-box" id="roomResultsBox" th:if="${pager.totalItems > 0}">
                <div class="room-row" th:each="room : ${rooms}"
                     th:attr="data-detail-url=@{/customer/rooms/{id}(id=${room.id}, checkIn=${checkIn}, checkOut=${checkOut}, guests=${guests})}">
                    <img th:if="${room.coverImageUrl}" th:src="${room.coverImageUrl}" th:alt="#{common.roomPhoto}">
                    <div th:unless="${room.coverImageUrl}" class="no-image" th:text="#{common.noPhoto}">Chưa có ảnh</div>

                    <div class="flex-grow-1">
                        <h5 class="fw-bold mb-1" th:text="#{common.room(${room.roomNumber})}"></h5>
                        <p class="text-muted mb-1" th:text="#{search.typeMax(${room.roomType.localizedName}, ${room.roomType.maxGuests})}"></p>
                        <p class="text-muted mb-2" th:if="${room.roomType.localizedAmenities}" th:text="#{search.amenities(${room.roomType.localizedAmenities})}"></p>
                        <p class="fw-bold text-primary mb-2" th:text="#{common.pricePerNight(${#numbers.formatDecimal(room.price, 1, 'POINT', 0, 'COMMA')})}"></p>
                        <th:block th:replace="~{fragments/usd :: approx(${room.price})}"></th:block>
                        <a th:href="@{/customer/rooms/{id}(id=${room.id}, checkIn=${checkIn}, checkOut=${checkOut}, guests=${guests})}"
                           class="btn btn-primary btn-sm" th:text="#{common.viewDetails}">Xem chi tiết</a>
                        <th:block th:replace="~{fragments/favorite :: heart(${room}, 'btn-sm ms-1')}"></th:block>
                        <th:block th:replace="~{fragments/compare :: toggle(${room})}"></th:block>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/pagination :: pager(${pager})}"></div>
        </div>

        <div class="col-md-3">
            <div th:replace="~{fragments/price-filter :: filter(${priceRanges}, ${price})}"></div>
        </div>
    </div>
</main>

<script th:inline="javascript">
    // Sap xep theo gia: sap xep o server tren toan bo ket qua, ve lai trang 1
    const sortSelect = document.getElementById('sortSelect');
    if (sortSelect) {
        sortSelect.addEventListener('change', function () {
            const url = new URL(window.location.href);
            if (this.value) {
                url.searchParams.set('sort', this.value);
            } else {
                url.searchParams.delete('sort');
            }
            url.searchParams.delete('page');
            window.location.href = url.toString();
        });
    }

    // Bam vao bat ky vi tri nao tren mot phong de xem chi tiet.
    document.querySelectorAll('.room-row[data-detail-url]').forEach(function (row) {
        row.addEventListener('click', function (event) {
            if (event.target.closest('a, button, input, select, label')) return;
            window.location.href = row.dataset.detailUrl;
        });
    });
</script>

<div th:replace="~{fragments/chatbot-widget :: widget}"></div>
<th:block th:replace="~{fragments/compare :: bar}"></th:block>
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

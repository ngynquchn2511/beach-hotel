<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{svc.title}">Dịch vụ | Sóng Xanh Resort</title>
    <th:block th:replace="~{fragments/seo :: meta(#{svc.title}, #{seo.services.desc}, '/page-images/beach-tour-dao.jpg', '/services')}"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
    <style>
        .tour-card img { height: 200px; object-fit: cover; }
        .tour-card .price { font-family: var(--display); font-size: 1.5rem; font-weight: 700; color: var(--ink); }
        .tour-meta li { display: flex; gap: .5rem; align-items: baseline; }
        .rate-table th, .rate-table td { white-space: nowrap; }
        .how-step { width: 2rem; height: 2rem; border-radius: 50%; background: var(--baby-deep); color: #fff;
                    display: inline-flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
    </style>
</head>
<body class="eaut" th:style="'--page-bg: url(' + @{/page-images/beach-hon-mun.jpg} + ')'">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1">
    <div class="eaut-head">
        <div class="eyebrow" th:text="#{svc.hero.eyebrow}">DỊCH VỤ THÊM</div>
        <h1 th:text="#{svc.hero.title}">Lặn biển &amp; đưa đón sân bay</h1>
        <div class="divider"></div>
        <p th:text="#{svc.hero.lead}">Đặt kèm đơn phòng của bạn.</p>
    </div>

    <!-- Cach dat -->
    <div class="bg-white p-4 rounded shadow-sm mb-5">
        <h2 class="h5 fw-bold mb-3" th:text="#{svc.how.title}">Cách đặt dịch vụ</h2>
        <div class="row g-3">
            <div class="col-md-4 d-flex gap-3"><span class="how-step">1</span><span th:text="#{svc.how.1}"></span></div>
            <div class="col-md-4 d-flex gap-3"><span class="how-step">2</span><span th:text="#{svc.how.2}"></span></div>
            <div class="col-md-4 d-flex gap-3"><span class="how-step">3</span><span th:text="#{svc.how.3}"></span></div>
        </div>
        <p class="small text-muted mt-3 mb-3" th:text="#{svc.how.note(${tourLeadHours}, ${transferLeadHours})}"></p>
        <a th:href="@{/rooms}" class="btn btn-primary me-2" sec:authorize="!hasRole('CUSTOMER')"><i class="bi bi-door-open me-1"></i><span th:text="#{svc.cta.book}">Đặt phòng ngay</span></a>
        <a th:href="@{/customer/bookings}" class="btn btn-primary" sec:authorize="hasRole('CUSTOMER')"><i class="bi bi-journal-bookmark me-1"></i><span th:text="#{svc.cta.history}">Mở đơn của tôi</span></a>
    </div>

    <!-- Tour lan -->
    <section id="tour-lan" class="mb-5">
        <h2 class="fw-bold mb-3"><i class="bi bi-water me-2"></i><span th:text="#{svc.tours.title}">Tour lặn biển</span></h2>
        <!-- Khach vang lai (dat phong khong can tai khoan) dat tour qua link trong email xac nhan -->
        <p class="small text-muted" sec:authorize="!hasRole('CUSTOMER')" th:text="#{svc.tour.guestHint}"></p>
        <div class="alert alert-info" th:if="${#lists.isEmpty(tours)}" th:text="#{svc.tours.empty}"></div>
        <div class="row g-4">
            <div class="col-md-6 col-lg-4" th:each="t : ${tours}">
                <div class="card h-100 tour-card shadow-sm">
                    <img th:if="${t.imageUrl}" th:src="${t.imageUrl}" class="card-img-top" th:alt="${t.localizedName}">
                    <div class="card-body d-flex flex-column">
                        <h3 class="h5 fw-bold" th:text="${t.localizedName}"></h3>
                        <p class="text-muted small" th:text="${t.localizedDescription}"></p>
                        <ul class="list-unstyled small tour-meta mb-3">
                            <li><i class="bi bi-clock"></i><span th:text="#{svc.tour.departure(${#temporals.format(t.departureTime, 'HH:mm')})} + ' · ' + #{svc.tour.duration(${t.durationHours})}"></span></li>
                            <li><i class="bi bi-people"></i><span th:text="#{svc.tour.seats(${t.maxParticipants})}"></span></li>
                            <li th:if="${t.minAge != null}"><i class="bi bi-person-check"></i><span th:text="#{svc.tour.minAge(${t.minAge})}"></span></li>
                            <li th:if="${t.meetingPoint}"><i class="bi bi-geo-alt"></i><span th:text="#{svc.tour.meeting(${t.meetingPoint})}"></span></li>
                        </ul>
                        <div class="mt-auto d-flex justify-content-between align-items-center gap-2 flex-wrap">
                            <div><span class="price" th:text="${#numbers.formatDecimal(t.pricePerPerson, 1, 'POINT', 0, 'COMMA')} + 'đ'"></span>
                                <span class="text-muted" th:text="#{svc.tour.perPerson}">/ người</span></div>
                            <a th:href="@{/customer/services/tours/{id}(id=${t.id})}" class="btn btn-primary btn-sm">
                                <i class="bi bi-calendar-plus me-1"></i><span th:text="#{svc.tour.book}">Đặt tour này</span></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/pagination :: pager(${tourPager})}"></div>
    </section>

    <!-- Dua don san bay -->
    <section id="spa-nha-hang" class="mb-5" th:if="${spaPackages != null}">
        <h2 class="fw-bold mb-1"><i class="bi bi-flower1 me-2"></i><span th:text="#{svc.spa.title}">Spa &amp; nhà hàng</span></h2>
        <p class="text-muted" th:text="#{svc.spa.lead}"></p>
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="bg-white p-4 rounded shadow-sm h-100">
                    <h5 class="fw-bold" th:text="#{fac.spa}">Spa</h5>
                    <p class="small text-muted mb-2" th:text="#{svc.spa.hours(${spaHours})}"></p>
                    <div th:if="${#lists.isEmpty(spaPackages)}" class="text-muted small" th:text="#{svc.spa.none}"></div>
                    <table class="table table-sm align-middle mb-0" th:unless="${#lists.isEmpty(spaPackages)}">
                        <tbody>
                        <tr th:each="p : ${spaPackages}">
                            <td class="fw-semibold" th:text="${p.localizedName}"></td>
                            <td class="small text-muted text-nowrap" th:text="${p.minutes} + #{fac.minutes}"></td>
                            <td class="small text-nowrap">
                                <span th:if="${spaRatings[p.id] != null}" class="text-warning" th:text="'★ ' + ${spaRatings[p.id].average}"></span>
                                <span th:if="${spaRatings[p.id] != null}" class="text-muted" th:text="'(' + ${spaRatings[p.id].count} + ')'"></span>
                            </td>
                            <td class="text-end text-nowrap"><span class="fw-bold" th:text="${#numbers.formatDecimal(p.price, 1, 'POINT', 0, 'COMMA')} + 'đ'"></span>
                                <span class="small text-muted" th:text="#{svc.tour.perPerson}">/ người</span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="bg-white p-4 rounded shadow-sm mb-3">
                    <h5 class="fw-bold" th:text="#{fac.restaurant}">Nhà hàng</h5>
                    <p class="small mb-1" th:text="#{svc.restaurant.hours}"></p>
                    <p class="small mb-0" th:if="${restaurantRating.count > 0}">
                        <span class="text-warning" th:text="'★ ' + ${restaurantRating.average} + ' / 5'"></span>
                        <span class="text-muted" th:text="#{svc.rating.count(${restaurantRating.count})}"></span></p>
                </div>
                <div class="bg-white p-4 rounded shadow-sm" th:unless="${#lists.isEmpty(testimonials)}">
                    <h6 class="fw-bold" th:text="#{svc.testimonials}">Khách nói gì</h6>
                    <blockquote th:each="t : ${testimonials}" class="small border-start ps-2 mb-2">
                        <div class="text-warning" th:text="${#strings.repeat('★', t.rating)}"></div>
                        <div class="fst-italic" th:text="'“' + ${t.feedback} + '”'"></div>
                        <div class="text-muted" th:text="'- ' + ${t.guest} + (${t.service != null} ? ' · ' + ${t.service} : '')"></div>
                    </blockquote>
                </div>
            </div>
        </div>
        <p class="small text-muted mt-2" th:text="#{svc.spa.howTo}"></p>
    </section>

    <section id="dua-don" class="bg-white p-4 rounded shadow-sm">
        <h2 class="fw-bold mb-2"><i class="bi bi-airplane me-2"></i><span th:text="#{svc.transfer.title}">Đưa đón sân bay</span></h2>
        <p class="text-muted" th:text="#{svc.transfer.lead}"></p>
        <div class="table-responsive">
            <table class="table align-middle rate-table mb-0">
                <thead>
                <tr>
                    <th th:text="#{svc.transfer.airport}">Sân bay</th>
                    <th th:each="v : ${vehicles}" class="text-end" th:text="#{${'svc.vehicle.' + v.name()}}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${airports}">
                    <td class="fw-semibold" th:text="#{${'airport.' + a.name()}}"></td>
                    <td th:each="v : ${vehicles}" class="text-end"
                        th:with="price=${rates.get(a) != null ? rates.get(a).get(v) : null}"
                        th:text="${price != null} ? ${#numbers.formatDecimal(price, 1, 'POINT', 0, 'COMMA')} + 'đ' : '—'"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/chatbot-widget :: widget}"></div>
</body>
</html>

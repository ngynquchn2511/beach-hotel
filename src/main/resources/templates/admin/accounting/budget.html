<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kế hoạch năm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
                <div>
                    <h3 class="fw-bold mb-1">Kế hoạch năm <span th:text="${year}"></span></h3>
                    <p class="text-muted small mb-0">Chỉ tiêu từng tháng. Để trống ô nào thì không so sánh chỉ tiêu đó. Trang Lãi lỗ và Phân tích hiện % đạt kế hoạch.</p>
                </div>
                <form method="get" class="d-flex gap-2">
                    <input type="number" name="year" class="form-control form-control-sm" style="width: 100px" min="2020" max="2100" th:value="${year}">
                    <button class="btn btn-sm btn-outline-primary">Xem</button>
                </form>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form method="post" th:action="@{/admin/accounting/budget}" class="bg-white p-3 rounded shadow-sm">
                <input type="hidden" name="year" th:value="${year}">
                <div class="table-responsive">
                    <table class="table table-sm align-middle mb-3">
                        <thead><tr><th>Tháng</th><th>Doanh thu (VND)</th><th>Chi phí tối đa (VND)</th><th>Công suất (%)</th><th>ADR (VND)</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="b : ${budgets}" th:with="mm=${b.month.monthValue}">
                            <td class="fw-semibold" th:text="${mm} + '/' + ${year}"></td>
                            <td><input type="number" class="form-control form-control-sm" min="0" step="1000000" th:name="'revenue_' + ${mm}"
                                       th:value="${b.revenueTarget != null ? b.revenueTarget.longValue() : ''}"></td>
                            <td><input type="number" class="form-control form-control-sm" min="0" step="1000000" th:name="'cost_' + ${mm}"
                                       th:value="${b.costBudget != null ? b.costBudget.longValue() : ''}"></td>
                            <td><input type="number" class="form-control form-control-sm" min="0" max="100" th:name="'occupancy_' + ${mm}"
                                       th:value="${b.occupancyTarget}"></td>
                            <td><input type="number" class="form-control form-control-sm" min="0" step="10000" th:name="'adr_' + ${mm}"
                                       th:value="${b.adrTarget != null ? b.adrTarget.longValue() : ''}"></td>
                            <td><a class="small text-nowrap" th:href="@{/admin/accounting/pnl(month=${#temporals.format(b.month, 'yyyy-MM')})}">Lãi lỗ</a></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <button type="submit" class="btn btn-primary">Lưu kế hoạch</button>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý combo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold m-0">Danh sách combo</h3>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/combos/new}" class="btn btn-primary">Thêm combo</a>
            </div>

            <div th:if="${#lists.isEmpty(combos)}" class="alert alert-info">
                Chưa có combo nào. Thêm combo (ăn nướng, lẩu...) để khách hàng chọn khi đặt phòng.
            </div>

            <table class="table table-striped bg-white align-middle" style="--bs-table-striped-bg: #eaf6ff;" th:if="${not #lists.isEmpty(combos)}">
                <thead>
                <tr>
                    <th>Ảnh</th>
                    <th>Tên combo</th>
                    <th>Giá</th>
                    <th>Số người</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="combo : ${combos}">
                    <td>
                        <img th:if="${combo.imageUrl}" th:src="${combo.imageUrl}" style="width: 70px; height: 50px; object-fit: cover;" class="rounded" alt="Ảnh combo">
                        <span th:unless="${combo.imageUrl}" class="text-muted small">Chưa có ảnh</span>
                    </td>
                    <td th:text="${combo.name}"></td>
                    <td th:text="${#numbers.formatDecimal(combo.price, 1, 0)} + 'VND'"></td>
                    <td th:text="${combo.maxGuests != null ? combo.maxGuests + ' người' : '-'}"></td>
                    <td>
                        <span class="badge" th:classappend="${combo.active} ? 'bg-success' : 'bg-secondary'"
                              th:text="${combo.active} ? 'Đang bán' : 'Đã ẩn'"></span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/admin/combos/{id}/edit(id=${combo.id})}" class="btn btn-sm btn-outline-secondary">Sửa</a>
                        <form th:action="@{/admin/combos/{id}/toggle-active(id=${combo.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-warning" th:text="${combo.active} ? 'Ẩn' : 'Hiện'"></button>
                        </form>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/admin/combos/{id}/delete(id=${combo.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Xóa combo này?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:replace="~{fragments/pagination :: pagination('/admin/combos', ${currentPage}, ${totalPages}, ${pageNumbers}, null, null)}"></div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

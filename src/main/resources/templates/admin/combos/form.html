<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Sửa combo' : 'Thêm combo'">Combo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <h3 class="fw-bold mb-4" th:text="${isEdit} ? 'Sửa combo' : 'Thêm combo'"></h3>

            <div class="bg-white p-4 rounded shadow-sm" style="max-width: 600px;">
                <form th:action="${isEdit} ? @{/admin/combos/{id}/edit(id=${comboId})} : @{/admin/combos/new}"
                      th:object="${comboRequest}" method="post" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label class="form-label">Tên combo</label>
                        <input type="text" th:field="*{name}" class="form-control" placeholder="VD: Combo ăn nướng, Combo lẩu, Phòng thường">
                        <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tên combo <span class="badge bg-info text-dark">EN</span> <span class="text-muted small">(không bắt buộc — bỏ trống thì khách chọn tiếng Anh vẫn thấy bản tiếng Việt)</span></label>
                        <input type="text" th:field="*{nameEn}" class="form-control" maxlength="150" placeholder="VD: BBQ combo">
                        <div class="text-danger small" th:if="${#fields.hasErrors('nameEn')}" th:errors="*{nameEn}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mô tả combo</label>
                        <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Mô tả món ăn, số lượng, ghi chú..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mô tả combo <span class="badge bg-info text-dark">EN</span> <span class="text-muted small">(không bắt buộc — bỏ trống thì khách chọn tiếng Anh vẫn thấy bản tiếng Việt)</span></label>
                        <textarea th:field="*{descriptionEn}" class="form-control" rows="3" maxlength="1000"></textarea>
                        <div class="text-danger small" th:if="${#fields.hasErrors('descriptionEn')}" th:errors="*{descriptionEn}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Giá combo (VND)</label>
                        <input type="number" step="1000" th:field="*{price}" class="form-control" th:readonly="${!#authorization.expression('hasRole(''ADMIN'')')}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        <div class="text-muted small mt-1" sec:authorize="!hasRole('ADMIN')">Chỉ quản trị viên được thay đổi giá.</div>
                        <div class="text-muted small mt-1">Để 0 nếu là "phòng thường" không phát sinh thêm phí</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Áp dụng tối đa cho (số người)</label>
                        <input type="number" th:field="*{maxGuests}" class="form-control" placeholder="Để trống nếu không giới hạn">
                        <div class="text-danger small" th:if="${#fields.hasErrors('maxGuests')}" th:errors="*{maxGuests}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Ảnh combo</label>

                        <div th:if="${currentImageUrl}" class="mb-2">
                            <img th:src="${currentImageUrl}" style="max-width: 200px;" class="rounded border d-block mb-1" alt="Ảnh combo hiện tại">
                            <span class="text-muted small">Ảnh hiện tại — chọn file mới nếu muốn thay đổi</span>
                        </div>

                        <input type="file" name="imageFile" accept=".jpg,.jpeg,.png,.webp" class="form-control">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Lưu</button>
                        <a th:href="@{/admin/combos}" class="btn btn-outline-secondary">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

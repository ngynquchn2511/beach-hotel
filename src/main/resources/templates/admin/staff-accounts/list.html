<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Tài khoản nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold m-0">Tài khoản nhân viên</h3>
                <a th:href="@{/admin/staff-accounts/new}" class="btn btn-primary">Thêm tài khoản</a>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div th:if="${#lists.isEmpty(accounts)}" class="alert alert-info">
                Chưa có tài khoản nhân viên nào.
            </div>

            <table class="table table-striped bg-white align-middle" style="--bs-table-striped-bg: #eaf6ff;" th:if="${not #lists.isEmpty(accounts)}">
                <thead>
                <tr>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Số điện thoại</th>
                    <th>Vai trò</th>
                    <th>Ngày tạo</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${accounts}">
                    <td>
                        <span th:text="${a.fullName}"></span>
                        <span class="badge bg-info text-dark ms-1" th:if="${a.email == #authentication.name}">Bạn</span>
                    </td>
                    <td th:text="${a.email}"></td>
                    <td th:text="${a.phoneNumber}"></td>
                    <td>
                        <span class="badge" th:classappend="${a.role.name() == 'ADMIN'} ? 'bg-dark' : 'bg-primary'"
                              th:text="${a.role.vietnameseLabel}"></span>
                    </td>
                    <td th:text="${#temporals.format(a.createdAt, 'dd/MM/yyyy')}"></td>
                    <td>
                        <span class="badge" th:classappend="${a.isLocked()} ? 'bg-danger' : 'bg-success'"
                              th:text="${a.isLocked()} ? 'Đã khóa' : 'Hoạt động'"></span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/admin/staff-accounts/{id}/edit(id=${a.id})}" class="btn btn-sm btn-outline-secondary">Sửa</a>
                        <form th:if="${a.email != #authentication.name}"
                              th:action="@{/admin/staff-accounts/{id}/toggle-lock(id=${a.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Xác nhận thay đổi trạng thái khóa của tài khoản này?')">
                            <button type="submit" class="btn btn-sm"
                                    th:classappend="${a.isLocked()} ? 'btn-outline-success' : 'btn-outline-danger'"
                                    th:text="${a.isLocked()} ? 'Mở khóa' : 'Khóa'"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:replace="~{fragments/pagination :: pagination('/admin/staff-accounts', ${currentPage}, ${totalPages}, ${pageNumbers}, null, null)}"></div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Tài khoản nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold m-0">Tài khoản nhân viên</h3>
                <a th:href="@{/admin/staff-accounts/new}" class="btn btn-primary">Thêm tài khoản</a>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <!-- Loc theo loai nhan vien -->
            <ul class="nav nav-pills gap-1 mb-2" id="loc-loai-nhan-vien">
                <li class="nav-item"><a class="nav-link py-1 px-3" th:classappend="${role == null} ? 'active'"
                    th:href="@{/admin/staff-accounts(status=${status}, q=${q})}">Tất cả <span class="badge bg-light text-dark" th:text="${totalCount}"></span></a></li>
                <li class="nav-item" th:each="r : ${roles}"><a class="nav-link py-1 px-3" th:classappend="${role == r} ? 'active'"
                    th:href="@{/admin/staff-accounts(role=${r}, status=${status}, q=${q})}">
                    <i class="bi" th:classappend="${r.name() == 'ADMIN'} ? 'bi-shield-lock' : (${r.name() == 'STAFF'} ? 'bi-person-badge' : (${r.name() == 'HOUSEKEEPER'} ? 'bi-bucket' : 'bi-calculator'))"></i>
                    <span th:text="${r.name() == 'STAFF'} ? 'Lễ tân / nhân viên' : ${r.vietnameseLabel}"></span>
                    <span class="badge bg-light text-dark" th:text="${roleCounts[r.name()]}"></span></a></li>
            </ul>
            <form method="get" th:action="@{/admin/staff-accounts}" class="d-flex flex-wrap gap-2 bg-white p-2 rounded shadow-sm mb-3">
                <input type="hidden" name="role" th:value="${role}">
                <input type="text" name="q" class="form-control form-control-sm" style="max-width:260px" th:value="${q}" placeholder="Tìm tên, email, số điện thoại">
                <select name="status" class="form-select form-select-sm" style="width:auto">
                    <option value="">Mọi trạng thái</option>
                    <option value="active" th:selected="${status == 'active'}">Đang hoạt động</option>
                    <option value="locked" th:selected="${status == 'locked'}">Đã khóa</option>
                </select>
                <button class="btn btn-primary btn-sm" type="submit"><i class="bi bi-search"></i> Lọc</button>
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/staff-accounts}" th:if="${role != null or status != null or q != null}">Bỏ lọc</a>
                <span class="ms-auto align-self-center small text-muted" th:text="${filteredCount} + ' tài khoản'"></span>
            </form>

            <div th:if="${#lists.isEmpty(accounts)}" class="alert alert-info">
                Không có tài khoản nhân viên nào phù hợp.
            </div>

            <table class="table table-striped bg-white align-middle" style="--bs-table-striped-bg: #eaf6ff;" th:if="${not #lists.isEmpty(accounts)}">
                <thead>
                <tr>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Số điện thoại</th>
                    <th>Vai trò</th>
                    <th>Ngày tạo</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${accounts}">
                    <td>
                        <span th:text="${a.fullName}"></span>
                        <span class="badge bg-info text-dark ms-1" th:if="${a.email == #authentication.name}">Bạn</span>
                    </td>
                    <td th:text="${a.email}"></td>
                    <td th:text="${a.phoneNumber}"></td>
                    <td>
                        <span class="badge" th:classappend="${a.role.name() == 'ADMIN'} ? 'bg-dark' : (${a.role.name() == 'STAFF'} ? 'bg-primary' : (${a.role.name() == 'HOUSEKEEPER'} ? 'bg-success' : 'bg-warning text-dark'))"
                              th:text="${a.role.vietnameseLabel}"></span>
                    </td>
                    <td th:text="${#temporals.format(a.createdAt, 'dd/MM/yyyy')}"></td>
                    <td>
                        <span class="badge" th:classappend="${a.isLocked()} ? 'bg-danger' : 'bg-success'"
                              th:text="${a.isLocked()} ? 'Đã khóa' : 'Hoạt động'"></span>
                        <span th:if="${!a.isLocked() and a.temporarilyLocked}" class="badge bg-warning text-dark d-block mt-1"
                              th:text="'Tạm khóa (sai mật khẩu) đến ' + ${#temporals.format(a.loginLockedUntil, 'HH:mm')}"></span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/admin/staff-accounts/{id}/edit(id=${a.id})}" class="btn btn-sm btn-outline-secondary">Sửa</a>
                        <form th:if="${a.email != #authentication.name}"
                              th:action="@{/admin/staff-accounts/{id}/toggle-lock(id=${a.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Xác nhận thay đổi trạng thái khóa của tài khoản này?')">
                            <button type="submit" class="btn btn-sm"
                                    th:classappend="${a.isLocked() or a.temporarilyLocked} ? 'btn-outline-success' : 'btn-outline-danger'"
                                    th:text="${a.isLocked() or a.temporarilyLocked} ? 'Mở khóa' : 'Khóa'"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:replace="~{fragments/pagination :: pager(${pager})}"></div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

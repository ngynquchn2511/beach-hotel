<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Sửa tài khoản nhân viên' : 'Thêm tài khoản nhân viên'">Tài khoản nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <h3 class="fw-bold mb-4" th:text="${isEdit} ? 'Sửa tài khoản nhân viên' : 'Thêm tài khoản nhân viên'"></h3>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="bg-white p-4 rounded shadow-sm" style="max-width: 600px;">
                <form th:action="${isEdit} ? @{/admin/staff-accounts/{id}/edit(id=${accountId})} : @{/admin/staff-accounts/new}"
                      th:object="${staffAccountRequest}" method="post">

                    <div class="mb-3">
                        <label class="form-label">Họ tên</label>
                        <input type="text" th:field="*{fullName}" class="form-control">
                        <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email (dùng để đăng nhập)</label>
                        <input type="email" th:field="*{email}" class="form-control">
                        <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Số điện thoại</label>
                        <input type="text" th:field="*{phoneNumber}" class="form-control">
                        <div class="text-danger small" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Vai trò</label>
                        <select th:field="*{role}" class="form-select">
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r.vietnameseLabel}"></option>
                        </select>
                        <div class="text-danger small" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                        <div class="text-muted small mt-1">Nhân viên có mọi quyền quản lý, trừ quản lý tài khoản nhân viên và xem nhật ký thao tác.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" th:text="${isEdit} ? 'Mật khẩu mới' : 'Mật khẩu'">Mật khẩu</label>
                        <input type="password" th:field="*{password}" class="form-control" autocomplete="new-password">
                        <div class="text-muted small mt-1" th:if="${isEdit}">Để trống nếu không muốn đổi mật khẩu.</div>
                        <div class="text-muted small mt-1" th:unless="${isEdit}">Tối thiểu 6 ký tự.</div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Lưu</button>
                        <a th:href="@{/admin/staff-accounts}" class="btn btn-outline-secondary">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

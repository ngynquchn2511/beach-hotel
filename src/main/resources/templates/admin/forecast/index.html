<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dự báo công suất</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
    <style>
        .occ { display: flex; height: 14px; background: #f1f3f5; border-radius: 4px; overflow: hidden; min-width: 120px; }
        .occ .c { background: #2f9e44; }
        .occ .p { background: repeating-linear-gradient(45deg, #ffe066 0 4px, #fcc419 4px 8px); }
        tr.low td { background: #fff5f5; }
        .stat { background: var(--paper); border: var(--line); border-radius: 10px; padding: 12px 16px; height: 100%; }
        .stat .num { font-size: 1.6rem; font-weight: 800; }
    </style>
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>
        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
                <div>
                    <h3 class="fw-bold m-0">Dự báo công suất</h3>
                    <div class="text-muted small">Từ hôm nay. Công suất tính trên phòng đã xác nhận / đang ở; vàng sọc = đơn chờ xác nhận.</div>
                </div>
                <div class="btn-group">
                    <a th:each="d : ${allowedDays}" class="btn btn-sm" th:classappend="${d == days} ? 'btn-primary' : 'btn-outline-primary'"
                       th:href="@{/admin/forecast(days=${d})}" th:text="${d} + ' ngày'"></a>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-6 col-lg-4"><div class="stat"><div class="small text-muted">Công suất trung bình</div>
                    <div class="num" th:classappend="${forecast.averageOccupancy < lowPercent} ? 'text-danger' : 'text-success'" th:text="${forecast.averageOccupancy} + '%'"></div></div></div>
                <div class="col-6 col-lg-4"><div class="stat"><div class="small text-muted">Doanh thu phòng dự kiến</div>
                    <div class="num" th:text="${#numbers.formatDecimal(forecast.revenue, 1, 'POINT', 0, 'COMMA')}"></div></div></div>
                <div class="col-12 col-lg-4"><div class="stat"><div class="small text-muted" th:text="'Ngày vắng (dưới ' + ${lowPercent} + '%)'"></div>
                    <div class="num text-danger" th:text="${forecast.lowDays}"></div>
                    <a sec:authorize="hasRole('ADMIN')" th:if="${forecast.lowDays > 0}" th:href="@{/admin/pricing} + '#khuyen-mai'" class="small">Bật khuyến mãi giờ chót &rarr;</a></div></div>
            </div>

            <div class="bg-white p-4 rounded shadow-sm mb-4">
                <h5 class="fw-bold mb-3">Theo hạng phòng</h5>
                <table class="table table-sm align-middle mb-0">
                    <thead><tr><th>Hạng phòng</th><th>Số phòng</th><th>Đêm đã bán</th><th>Công suất</th></tr></thead>
                    <tbody>
                    <tr th:each="t : ${forecast.types}">
                        <td class="fw-semibold" th:text="${t.name}"></td>
                        <td th:text="${t.rooms}"></td>
                        <td th:text="${t.bookedNights}"></td>
                        <td><span class="badge" th:classappend="${t.occupancy < lowPercent} ? 'bg-danger' : 'bg-success'" th:text="${t.occupancy} + '%'"></span></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="bg-white p-4 rounded shadow-sm">
                <h5 class="fw-bold mb-3">Theo ngày</h5>
                <div class="table-responsive">
                    <table class="table table-sm align-middle mb-0">
                        <thead><tr><th>Ngày</th><th>Đã chắc</th><th>Chờ XN</th><th>Còn trống</th><th>Công suất</th><th class="text-end">Doanh thu</th></tr></thead>
                        <tbody>
                        <tr th:each="d : ${forecast.days}" th:classappend="${d.low} ? 'low'">
                            <td class="text-nowrap" th:classappend="${d.weekend} ? 'fw-bold'"
                                th:text="${ {'T2','T3','T4','T5','T6','T7','CN'}[d.date.dayOfWeek.value - 1] } + ' ' + ${#temporals.format(d.date, 'dd/MM')}"></td>
                            <td th:text="${d.confirmed}"></td>
                            <td th:text="${d.pending}"></td>
                            <td th:text="${d.free}"></td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="occ"><div class="c" th:style="'width:' + ${d.occupancy} + '%'"></div><div class="p" th:style="'width:' + ${d.pendingPercent} + '%'"></div></div>
                                    <span class="small" th:text="${d.occupancy} + '%'"></span>
                                </div>
                            </td>
                            <td class="text-end small" th:text="${#numbers.formatDecimal(d.revenue, 1, 'POINT', 0, 'COMMA')}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

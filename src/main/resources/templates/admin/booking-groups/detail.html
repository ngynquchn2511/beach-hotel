<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Đoàn ' + ${group.code}">Đoàn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>
        <div class="col-md-9">
            <h3 class="fw-bold mb-1" th:text="'Đoàn ' + ${group.code} + ' · ' + ${#lists.size(bookings)} + ' phòng'">Đoàn</h3>
            <p class="text-muted" th:text="${group.guestName} + ' · ' + ${group.guestPhone} + ' · ' + ${group.guestEmail}
                + ' · đặt lúc ' + ${#temporals.format(group.createdAt, 'HH:mm dd/MM/yyyy')}"></p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <div class="bg-white p-4 rounded shadow-sm mb-4">
                <table class="table align-middle mb-0">
                    <thead><tr><th>Đơn</th><th>Phòng</th><th>Ngày</th><th>Trạng thái</th><th class="text-end">Tiền</th></tr></thead>
                    <tbody>
                    <tr th:each="b : ${bookings}">
                        <td><a th:href="@{/admin/bookings/{id}(id=${b.id})}" th:text="'#' + ${b.id}"></a></td>
                        <td th:text="${b.room.roomNumber} + ' · ' + ${b.room.roomType.name}"></td>
                        <td class="small" th:text="${#temporals.format(b.checkInDate, 'dd/MM')} + ' – ' + ${#temporals.format(b.checkOutDate, 'dd/MM')}"></td>
                        <td><span th:class="'badge ' + ${b.status.badgeClass}" th:text="${b.status.vietnameseLabel}"></span>
                            <span th:if="${b.awaitingDeposit}" class="badge bg-warning text-dark">Chờ cọc</span></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(b.totalAmount, 1, 'POINT', 0, 'COMMA')}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex gap-2 flex-wrap">
                <form th:if="${deposit.signum() > 0}" method="post" th:action="@{/admin/booking-groups/{id}/confirm-deposit(id=${group.id})}"
                      th:attr="onsubmit=|return confirm('Đã nhận đủ ${#numbers.formatDecimal(deposit, 1, 'POINT', 0, 'COMMA')} VND (nội dung HB ${group.code} COC)?')|">
                    <button type="submit" class="btn btn-primary" th:text="'Đã nhận cọc gộp ' + ${#numbers.formatDecimal(deposit, 1, 'POINT', 0, 'COMMA')} + ' VND'"></button>
                </form>
                <form method="post" class="d-flex gap-2 align-items-center" th:action="@{/admin/booking-groups/{id}/cancel(id=${group.id})}"
                      onsubmit="return confirm('Hủy tất cả phòng còn hủy được của đoàn?')">
                    <div class="form-check mb-0"><input class="form-check-input" type="checkbox" name="fullRefund" value="true" id="fr">
                        <label class="form-check-label small" for="fr">Resort hủy - hoàn 100% cọc</label></div>
                    <button type="submit" class="btn btn-outline-danger">Hủy cả đoàn</button>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

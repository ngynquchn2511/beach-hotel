<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold m-0">Danh sách phòng</h3>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/rooms/new}" class="btn btn-primary">Thêm phòng</a>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div th:if="${#lists.isEmpty(rooms)}" class="alert alert-info">
                Chưa có phòng nào. Hãy thêm loại phòng trước, sau đó thêm phòng.
            </div>

            <table class="table table-striped bg-white align-middle" style="--bs-table-striped-bg: #eaf6ff;" th:if="${not #lists.isEmpty(rooms)}">
                <thead>
                <tr>
                    <th>Ảnh</th>
                    <th>Số phòng</th>
                    <th>Loại phòng</th>
                    <th>Giá</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="room : ${rooms}">
                    <td>
                        <img th:if="${room.coverImageUrl}" th:src="${room.coverImageUrl}" style="width: 60px; height: 45px; object-fit: cover;" class="rounded" alt="Ảnh phòng">
                        <span th:unless="${room.coverImageUrl}" class="text-muted small">Chưa có ảnh</span>
                    </td>
                    <td th:text="${room.roomNumber}"></td>
                    <td th:text="${room.roomType.name}"></td>
                    <td th:text="${#numbers.formatDecimal(room.price, 1, 0)} + 'VND'"></td>
                    <td>
                        <form th:action="@{/admin/rooms/{id}/status(id=${room.id})}" method="post" class="d-flex gap-1">
                            <select name="status" class="form-select form-select-sm" style="width: auto;" onchange="this.form.submit()">
                                <option th:each="s : ${T(com.hotel.entity.RoomStatus).values()}"
                                        th:value="${s}" th:text="${s.vietnameseLabel}"
                                        th:selected="${s == room.status}"></option>
                            </select>
                        </form>
                    </td>
                    <td class="text-end">
                        <form th:if="${room.status.name() == 'NOT_READY'}" th:action="@{/admin/rooms/{id}/mark-ready(id=${room.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-success">Xác nhận sẵn sàng</button>
                        </form>
                        <a th:href="@{/admin/rooms/{id}/view(id=${room.id})}" class="btn btn-sm btn-outline-primary">Xem &amp; Đặt phòng</a>
                        <a th:href="@{/admin/rooms/{id}/edit(id=${room.id})}" class="btn btn-sm btn-outline-secondary">Sửa</a>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/admin/rooms/{id}/delete(id=${room.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Xóa phòng này?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:replace="~{fragments/pagination :: pagination('/admin/rooms', ${currentPage}, ${totalPages}, ${pageNumbers}, null, null)}"></div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

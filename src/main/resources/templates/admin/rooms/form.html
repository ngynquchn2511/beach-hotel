<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Sửa phòng' : 'Thêm phòng'">Phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <h3 class="fw-bold mb-4" th:text="${isEdit} ? 'Sửa phòng' : 'Thêm phòng'"></h3>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div th:if="${#lists.isEmpty(roomTypes)}" class="alert alert-warning">
                Bạn cần tạo ít nhất một loại phòng trước khi thêm phòng.
                <a th:href="@{/admin/room-types/new}">Tạo loại phòng ngay</a>
            </div>

            <div class="bg-white p-4 rounded shadow-sm mb-3" style="max-width: 600px;"
                 th:if="${isEdit and currentImages != null and not #lists.isEmpty(currentImages)}">
                <h6 class="fw-bold mb-3">Ảnh hiện tại</h6>
                <div class="d-flex gap-2 flex-wrap">
                    <div th:each="img : ${currentImages}" class="border rounded p-2" style="width: 130px;">
                        <img th:src="${img.imageUrl}" style="width: 100%; height: 75px; object-fit: cover;" class="rounded mb-1" alt="Ảnh phòng">

                        <form th:action="@{/admin/rooms/{roomId}/images/{imageId}/replace(roomId=${roomId}, imageId=${img.id})}"
                              method="post" enctype="multipart/form-data" class="mb-1">
                            <input type="file" name="newImageFile" accept=".jpg,.jpeg,.png,.webp" class="form-control form-control-sm mb-1">
                            <button type="submit" class="btn btn-outline-primary btn-sm w-100">Sửa ảnh</button>
                        </form>

                        <form th:action="@{/admin/rooms/{roomId}/images/{imageId}/delete(roomId=${roomId}, imageId=${img.id})}"
                              method="post" onsubmit="return confirm('Xóa ảnh này?')">
                            <button type="submit" class="btn btn-outline-danger btn-sm w-100">Xóa</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="bg-white p-4 rounded shadow-sm" style="max-width: 600px;" th:if="${not #lists.isEmpty(roomTypes)}">
                <form th:action="${isEdit} ? @{/admin/rooms/{id}/edit(id=${roomId})} : @{/admin/rooms/new}"
                      th:object="${roomRequest}" method="post" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label class="form-label">Số phòng</label>
                        <input type="text" th:field="*{roomNumber}" class="form-control" placeholder="VD: 101">
                        <div class="text-danger small" th:if="${#fields.hasErrors('roomNumber')}" th:errors="*{roomNumber}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Loại phòng</label>
                        <select th:field="*{roomTypeId}" class="form-select">
                            <option value="">-- Chọn loại phòng --</option>
                            <option th:each="rt : ${roomTypes}"
                                    th:value="${rt.id}"
                                    th:text="${rt.name}"
                                    th:attr="data-price=${rt.basePrice},data-description=${rt.description},data-description-en=${rt.descriptionEn}"></option>
                        </select>
                        <div class="text-danger small" th:if="${#fields.hasErrors('roomTypeId')}" th:errors="*{roomTypeId}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Giá (VND / đêm)</label>
                        <input type="number" step="1000" th:field="*{price}" class="form-control" th:readonly="${!#authorization.expression('hasRole(''ADMIN'')')}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        <div class="text-muted small mt-1" sec:authorize="!hasRole('ADMIN')">Chỉ quản trị viên được thay đổi giá.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mô tả</label>
                        <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mô tả <span class="badge bg-info text-dark">EN</span> <span class="text-muted small">(không bắt buộc — bỏ trống thì khách chọn tiếng Anh vẫn thấy bản tiếng Việt)</span></label>
                        <textarea th:field="*{descriptionEn}" class="form-control" rows="3" maxlength="1000"></textarea>
                        <div class="text-danger small" th:if="${#fields.hasErrors('descriptionEn')}" th:errors="*{descriptionEn}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" th:text="${isEdit} ? 'Thêm ảnh mới (tối đa 6 ảnh/phòng)' : 'Ảnh phòng (tối đa 6 ảnh)'"></label>
                        <input type="file" name="imageFiles" accept=".jpg,.jpeg,.png,.webp" class="form-control" multiple>
                        <div class="text-muted small mt-1">Chấp nhận jpg, jpeg, png, webp — mỗi ảnh tối đa 5MB, tổng tối đa 6 ảnh/phòng</div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Lưu</button>
                        <a th:href="@{/admin/rooms}" class="btn btn-outline-secondary">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const roomTypeSelect = document.getElementById('roomTypeId');
        const priceInput = document.getElementById('price');
        const descriptionInput = document.getElementById('description');
        const descriptionEnInput = document.getElementById('descriptionEn');

        roomTypeSelect.addEventListener('change', () => {
            const selectedType = roomTypeSelect.options[roomTypeSelect.selectedIndex];
            if (!priceInput.readOnly) {
                priceInput.value = selectedType.dataset.price || '';
            }
            descriptionInput.value = selectedType.dataset.description || '';
            descriptionEnInput.value = selectedType.dataset.descriptionEn || '';
        });
    });
</script>

</body>
</html>

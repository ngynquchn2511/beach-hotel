<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cổng quản trị | Sóng Xanh Resort</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin-login">
<main class="login-shell">
    <section class="card login-card bg-white"><div class="card-body p-4 p-md-5">
        <div class="text-center mb-4"><div class="badge-icon">⌘</div><div class="text-uppercase fw-bold small eyebrow-text">Sóng Xanh Resort</div><h1 class="h3 fw-bold mt-2 mb-1">Cổng quản trị</h1><p class="text-secondary mb-0">Dành cho nhân viên và quản trị viên.</p></div>
        <div th:if="${param.error}" class="alert alert-danger small">Email hoặc mật khẩu không đúng.</div>
        <div th:if="${param.error != null and param.error[0] == 'wrong_portal'}" class="alert alert-danger small">Tài khoản không có quyền truy cập khu vực quản trị.</div>
        <div th:if="${param.locked != null and param.locked[0] != 'temp'}" class="alert alert-danger small">Tài khoản của bạn đã bị khóa. Vui lòng liên hệ quản trị viên.</div>
        <div th:if="${param.locked != null and param.locked[0] == 'temp'}" class="alert alert-warning small"
             th:text="|Đăng nhập sai quá ${T(com.hotel.security.LoginAttemptService).MAX_FAILED_ATTEMPTS} lần. Tài khoản tạm khóa, vui lòng thử lại sau ${param.minutes != null ? param.minutes[0] : T(com.hotel.security.LoginAttemptService).LOCK_MINUTES} phút hoặc nhờ quản trị viên mở khóa.|"></div>
        <div th:if="${param.logout}" class="alert alert-success small">Bạn đã đăng xuất thành công.</div>
        <form th:action="@{/admin/login}" method="post">
            <div class="mb-3"><label for="admin-email" class="form-label fw-semibold small">Email công việc</label><input id="admin-email" type="email" name="username" class="form-control" placeholder="name@hotel.com" autocomplete="email" required autofocus></div>
            <div class="mb-4"><label for="admin-password" class="form-label fw-semibold small">Mật khẩu</label><input id="admin-password" type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" autocomplete="current-password" required></div>
            <button type="submit" class="btn btn-primary w-100 py-2">Đăng nhập quản trị</button>
        </form>
        <p class="text-center mt-4 mb-0 small"><a th:href="@{/login}" class="text-decoration-none">← Quay lại đăng nhập khách hàng</a></p>
    </div></section>
</main>
</body>
</html>

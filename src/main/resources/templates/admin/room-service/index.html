<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dịch vụ lên phòng</title>
    <meta http-equiv="refresh" content="60">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <h3 class="fw-bold mb-1">Dịch vụ lên phòng</h3>
            <p class="text-muted small">Khách đang ở gọi món từ trang đơn trên điện thoại. Bấm "Đã giao" khi mang lên phòng - tiền tự cộng vào hóa đơn trả phòng.
                Trang tự cập nhật mỗi phút.</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <div class="bg-white p-4 rounded shadow-sm mb-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-bell me-1 text-warning"></i>Chờ giao
                    <span class="badge bg-warning text-dark" th:text="${#lists.size(pendingOrders)}"></span></h5>
                <p th:if="${#lists.isEmpty(pendingOrders)}" class="text-muted mb-0">Không có yêu cầu nào đang chờ.</p>
                <div class="table-responsive" th:unless="${#lists.isEmpty(pendingOrders)}">
                    <table class="table align-middle mb-0">
                        <thead><tr><th>Gọi lúc</th><th>Phòng</th><th>Món</th><th>Tiền</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="o : ${pendingOrders}">
                            <td class="text-nowrap fw-semibold" th:text="${#temporals.format(o.createdAt, 'HH:mm')}"></td>
                            <td><b th:text="'P.' + ${o.booking.room.roomNumber}"></b>
                                <div class="small"><a th:href="@{/admin/bookings/{id}(id=${o.booking.id})}" th:text="${o.booking.guestName}"></a></div></td>
                            <td>
                                <div th:text="${o.summary}"></div>
                                <div class="small text-muted" th:if="${o.note}" th:text="'Ghi chú: ' + ${o.note}"></div>
                            </td>
                            <td class="text-nowrap" th:text="${#numbers.formatDecimal(o.totalAmount, 1, 'POINT', 0, 'COMMA')} + ' VND'"></td>
                            <td class="text-end text-nowrap">
                                <form class="d-inline" method="post" th:action="@{/admin/room-service/orders/{id}/deliver(id=${o.id})}">
                                    <button type="submit" class="btn btn-sm btn-success">Đã giao</button>
                                </form>
                                <form class="d-inline" method="post" th:action="@{/admin/room-service/orders/{id}/cancel(id=${o.id})}"
                                      onsubmit="return confirm('Hủy yêu cầu này?')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Hủy</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="bg-white p-4 rounded shadow-sm mb-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-check2-circle me-1 text-success"></i>Đã giao hôm nay</h5>
                <p th:if="${#lists.isEmpty(deliveredToday)}" class="text-muted mb-0">Chưa có.</p>
                <ul class="list-unstyled small mb-0" th:unless="${#lists.isEmpty(deliveredToday)}">
                    <li th:each="o : ${deliveredToday}" class="d-flex justify-content-between border-bottom py-1">
                        <span><b th:text="'P.' + ${o.booking.room.roomNumber}"></b> · <span th:text="${o.summary}"></span></span>
                        <span class="text-muted text-nowrap ms-2"
                              th:text="${#temporals.format(o.deliveredAt, 'HH:mm')} + (${o.handledBy != null} ? ' · ' + ${o.handledBy} : '')"></span>
                    </li>
                </ul>
            </div>

            <!-- Thuc don: ai cung xem, chi admin sua -->
            <div class="bg-white p-4 rounded shadow-sm" id="thuc-don">
                <h5 class="fw-bold mb-3">Thực đơn</h5>
                <form sec:authorize="hasRole('ADMIN')" th:action="@{/admin/room-service/menu}" method="post" class="row g-2 align-items-end mb-3">
                    <div class="col-md-4"><label class="form-label small">Tên món</label>
                        <input type="text" name="name" class="form-control form-control-sm" maxlength="100" required></div>
                    <div class="col-md-3"><label class="form-label small">Tên tiếng Anh</label>
                        <input type="text" name="nameEn" class="form-control form-control-sm" maxlength="100"></div>
                    <div class="col-md-2"><label class="form-label small">Nhóm</label>
                        <select name="category" class="form-select form-select-sm" required>
                            <option th:each="c : ${categories}" th:value="${c}" th:text="${c.vietnameseLabel}"></option>
                        </select></div>
                    <div class="col-md-2"><label class="form-label small">Giá (VND)</label>
                        <input type="number" name="price" class="form-control form-control-sm" min="1000" step="1000" required></div>
                    <div class="col-md-1"><button type="submit" class="btn btn-sm btn-primary w-100"><i class="bi bi-plus-lg"></i></button></div>
                </form>
                <table class="table table-sm align-middle mb-0">
                    <tbody>
                    <tr th:each="i : ${menuItems}" th:classappend="${!i.active} ? 'text-muted'">
                        <td class="small" th:text="${i.category.vietnameseLabel}"></td>
                        <td class="fw-semibold" th:text="${i.name}"></td>
                        <td th:text="${#numbers.formatDecimal(i.price, 1, 'POINT', 0, 'COMMA')}"></td>
                        <td><span class="badge" th:classappend="${i.active} ? 'bg-success' : 'bg-secondary'" th:text="${i.active} ? 'Đang bán' : 'Tạm ngừng'"></span></td>
                        <td class="text-end">
                            <form sec:authorize="hasRole('ADMIN')" method="post" th:action="@{/admin/room-service/menu/{id}/toggle(id=${i.id})}">
                                <button type="submit" class="btn btn-sm btn-outline-secondary" th:text="${i.active} ? 'Tạm ngừng' : 'Bán lại'"></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

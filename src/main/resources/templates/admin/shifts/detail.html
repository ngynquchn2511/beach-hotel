<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết ca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>
        <div class="col-md-9">
            <a th:href="@{/admin/shifts}" class="small">&larr; Sổ quỹ ca</a>
            <h3 class="fw-bold mb-3" th:text="'Ca #' + ${shift.id}"></h3>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <div class="bg-white p-4 rounded shadow-sm mb-4">
                <dl class="row mb-0">
                    <dt class="col-sm-4">Nhận ca</dt>
                    <dd class="col-sm-8" th:text="${shift.openedBy.fullName} + ' - ' + ${#temporals.format(shift.openedAt, 'HH:mm dd/MM/yyyy')}"></dd>
                    <dt class="col-sm-4" th:if="${!shift.open}">Đóng ca</dt>
                    <dd class="col-sm-8" th:if="${!shift.open}" th:text="${shift.closedBy.fullName} + ' - ' + ${#temporals.format(shift.closedAt, 'HH:mm dd/MM/yyyy')}"></dd>
                    <dt class="col-sm-4">Tiền mặt đầu ca</dt><dd class="col-sm-8" th:text="${#numbers.formatDecimal(shift.openingCash, 1, 'POINT', 0, 'COMMA')}"></dd>
                    <th:block th:if="${!shift.open}">
                        <dt class="col-sm-4">Thu tiền mặt</dt><dd class="col-sm-8" th:text="${#numbers.formatDecimal(shift.cashIn, 1, 'POINT', 0, 'COMMA')}"></dd>
                        <dt class="col-sm-4">Chuyển khoản / Online</dt>
                        <dd class="col-sm-8" th:text="${#numbers.formatDecimal(shift.transferIn, 1, 'POINT', 0, 'COMMA')} + ' / ' + ${#numbers.formatDecimal(shift.onlineIn, 1, 'POINT', 0, 'COMMA')}"></dd>
                        <dt class="col-sm-4">Tiền mặt phải có</dt><dd class="col-sm-8" th:text="${#numbers.formatDecimal(shift.expectedCash, 1, 'POINT', 0, 'COMMA')}"></dd>
                        <dt class="col-sm-4">Đếm được</dt><dd class="col-sm-8" th:text="${#numbers.formatDecimal(shift.countedCash, 1, 'POINT', 0, 'COMMA')}"></dd>
                        <dt class="col-sm-4">Lệch</dt>
                        <dd class="col-sm-8 fw-bold" th:classappend="${shift.cashDifference.signum() < 0} ? 'text-danger'" th:text="${#numbers.formatDecimal(shift.cashDifference, 1, 'POINT', 0, 'COMMA')}"></dd>
                        <dt class="col-sm-4">Nộp két</dt><dd class="col-sm-8" th:text="${#numbers.formatDecimal(shift.cashToSafe, 1, 'POINT', 0, 'COMMA')}"></dd>
                        <dt class="col-sm-4">Để lại cho ca sau</dt><dd class="col-sm-8" th:text="${#numbers.formatDecimal(shift.leftCash, 1, 'POINT', 0, 'COMMA')}"></dd>
                        <dt class="col-sm-4">Bàn giao</dt><dd class="col-sm-8" style="white-space: pre-line" th:text="${shift.handoverNote ?: '-'}"></dd>
                    </th:block>
                </dl>
            </div>

            <div class="bg-white p-4 rounded shadow-sm">
                <h6 class="fw-bold">Thu / chi trong ca</h6>
                <table class="table table-sm align-middle mb-0">
                    <thead><tr><th>Giờ</th><th>Khoản</th><th>Phương thức</th><th class="text-end">Số tiền</th></tr></thead>
                    <tbody>
                    <tr th:each="e : ${ledger}">
                        <td class="text-nowrap" th:text="${#temporals.format(e.time, 'HH:mm dd/MM')}"></td>
                        <td><a th:if="${e.bookingId != null}" th:href="@{/admin/bookings/{id}(id=${e.bookingId})}" th:text="${e.label}"></a>
                            <span th:if="${e.bookingId == null}" th:text="${e.label}"></span></td>
                        <td th:text="${e.method.vietnameseLabel}"></td>
                        <td class="text-end" th:classappend="${e.amount.signum() < 0} ? 'text-danger'"
                            th:text="${#numbers.formatDecimal(e.amount, 1, 'POINT', 0, 'COMMA')}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ledger)}"><td colspan="4" class="text-muted small">Chưa có khoản thu / chi nào.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Spa &amp; nhà hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>
        <div class="col-md-9">
            <h3 class="fw-bold mb-1">Spa &amp; nhà hàng</h3>
            <p class="text-muted small">Lịch khách đặt trên trang đơn. Xác nhận spa thì tiền spa tự cộng vào phụ phí đơn phòng; đặt bàn chỉ giữ chỗ.</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form method="get" class="d-flex gap-2 align-items-end mb-3 flex-wrap">
                <div><label class="form-label small">Từ ngày</label><input type="date" name="from" class="form-control form-control-sm" th:value="${from}"></div>
                <div><label class="form-label small">Trạng thái</label>
                    <select name="status" class="form-select form-select-sm"><option value="">Tất cả</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.vietnameseLabel}" th:selected="${s == status}"></option></select></div>
                <button type="submit" class="btn btn-sm btn-outline-primary">Lọc</button>
            </form>

            <div th:if="${#lists.isEmpty(reservations)}" class="alert alert-info">Không có lịch nào.</div>
            <div class="bg-white p-4 rounded shadow-sm" th:unless="${#lists.isEmpty(reservations)}">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead><tr><th>Giờ</th><th>Dịch vụ</th><th>Khách</th><th>Trạng thái</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="r : ${reservations}">
                            <td class="text-nowrap" th:text="${#temporals.format(r.reservedDate, 'dd/MM')} + ' ' + ${r.reservedTime}"></td>
                            <td><div th:text="${r.summary}"></div>
                                <div class="small text-muted" th:if="${r.totalPrice != null}" th:text="${#numbers.formatDecimal(r.totalPrice, 1, 'POINT', 0, 'COMMA')} + ' VND'"></div>
                                <div class="small text-muted" th:if="${r.note != null}" th:text="${r.note}"></div></td>
                            <td><a th:href="@{/admin/bookings/{id}(id=${r.booking.id})}" th:text="'#' + ${r.booking.id} + ' ' + ${r.booking.guestName}"></a>
                                <div class="small text-muted" th:text="'Phòng ' + ${r.booking.room.roomNumber}"></div></td>
                            <td><span class="badge" th:classappend="${r.status.name() == 'CONFIRMED'} ? 'bg-success' : (${r.status.name() == 'PENDING'} ? 'bg-warning text-dark' : 'bg-secondary')"
                                      th:text="${r.status.vietnameseLabel}"></span></td>
                            <td class="text-end text-nowrap">
                                <form th:if="${r.status.name() == 'PENDING'}" method="post" class="d-inline" th:action="@{/admin/facility-reservations/{id}/confirm(id=${r.id})}">
                                    <button type="submit" class="btn btn-sm btn-success">Xác nhận</button></form>
                                <form th:if="${r.status.name() != 'CANCELLED'}" method="post" class="d-inline" th:action="@{/admin/facility-reservations/{id}/cancel(id=${r.id})}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Hủy</button></form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div th:replace="~{fragments/pagination :: pager(${pager})}"></div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

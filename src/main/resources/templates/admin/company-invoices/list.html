<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hóa đơn công ty</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>
        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
                <div>
                    <h3 class="fw-bold m-0">Hóa đơn công ty</h3>
                    <div class="text-muted small">Đơn khách yêu cầu hóa đơn VAT. Xuất hóa đơn điện tử trên hệ thống HĐĐT rồi ghi số hóa đơn ở đây.</div>
                </div>
                <a th:href="@{/admin/company-invoices/export}" class="btn btn-sm btn-outline-success"><i class="bi bi-file-earmark-excel me-1"></i>Tải Excel</a>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${#lists.isEmpty(bookings)}" class="alert alert-info">Chưa có đơn nào yêu cầu hóa đơn công ty.</div>

            <div class="bg-white p-4 rounded shadow-sm" th:unless="${#lists.isEmpty(bookings)}">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead><tr><th>Đơn</th><th>Đơn vị</th><th class="text-end">Tổng tiền</th><th>Hóa đơn</th></tr></thead>
                        <tbody>
                        <tr th:each="b : ${bookings}">
                            <td><a th:href="@{/admin/bookings/{id}(id=${b.id})}" th:text="'#' + ${b.id}"></a>
                                <div class="small text-muted" th:text="'Trả ' + ${#temporals.format(b.checkOutDate, 'dd/MM/yyyy')} + ' · ' + ${b.status.vietnameseLabel}"></div></td>
                            <td><div class="fw-semibold" th:text="${b.invoiceCompanyName}"></div>
                                <div class="small" th:text="'MST ' + ${b.invoiceTaxCode}"></div>
                                <div class="small text-muted" th:text="${b.invoiceAddress}"></div>
                                <div class="small text-muted" th:if="${b.invoiceEmail}" th:text="${b.invoiceEmail}"></div></td>
                            <td class="text-end" th:text="${#numbers.formatDecimal(b.totalAmount, 1, 'POINT', 0, 'COMMA')}"></td>
                            <td>
                                <span th:if="${b.EInvoiceNumber != null}" class="badge bg-success"
                                      th:text="'Đã xuất số ' + ${b.EInvoiceNumber}"></span>
                                <form th:if="${b.EInvoiceNumber == null and b.status.name() == 'CHECKED_OUT'}" method="post" class="d-flex gap-1"
                                      th:action="@{/admin/company-invoices/{id}/issued(id=${b.id})}">
                                    <input type="text" name="invoiceNumber" class="form-control form-control-sm" maxlength="30" required placeholder="Số HĐĐT" style="max-width: 130px">
                                    <button type="submit" class="btn btn-sm btn-success text-nowrap">Đã xuất</button>
                                </form>
                                <span th:if="${b.EInvoiceNumber == null and b.status.name() != 'CHECKED_OUT'}" class="small text-muted">Chờ khách trả phòng</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div th:replace="~{fragments/pagination :: pager(${pager})}"></div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

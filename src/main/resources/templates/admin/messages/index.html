<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tin nhắn khách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
                <div>
                    <h3 class="fw-bold mb-1">Tin nhắn khách</h3>
                    <p class="text-muted small mb-0">Khách nhắn từ trang đơn của mình. Trả lời ở trang chi tiết đơn - khách nhận email kèm link đơn.</p>
                </div>
                <div class="btn-group btn-group-sm">
                    <a th:href="@{/admin/messages}" class="btn" th:classappend="${!onlyUnread} ? 'btn-primary' : 'btn-outline-primary'">Tất cả</a>
                    <a th:href="@{/admin/messages(unread=true)}" class="btn" th:classappend="${onlyUnread} ? 'btn-primary' : 'btn-outline-primary'">Chưa đọc</a>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(conversations)}" class="alert alert-info">Không có tin nhắn nào.</div>
            <div class="bg-white rounded shadow-sm" th:unless="${#lists.isEmpty(conversations)}">
                <a th:each="c : ${conversations}" th:with="m=${c.latest}, b=${c.latest.booking}"
                   th:href="@{/admin/bookings/{id}(id=${b.id})} + '#tin-nhan'"
                   class="d-flex justify-content-between gap-3 p-3 border-bottom text-decoration-none text-body"
                   th:classappend="${c.unread > 0} ? 'bg-primary-subtle'">
                    <div class="flex-grow-1" style="min-width: 0">
                        <div class="fw-semibold">
                            <span th:text="${b.guestName}"></span>
                            <span class="small text-muted fw-normal" th:text="'· đơn #' + ${b.id} + ' · phòng ' + ${b.room.roomNumber}"></span>
                        </div>
                        <div class="small text-truncate">
                            <span class="text-muted" th:text="${m.fromGuest} ? 'Khách: ' : 'Lễ tân: '"></span><span th:text="${#strings.isEmpty(m.body)} ? '' : ${m.body}"></span><span th:if="${m.imageUrl != null}" class="badge bg-info-subtle text-dark ms-1"><i class="bi bi-image"></i> Ảnh</span>
                        </div>
                    </div>
                    <div class="text-end text-nowrap">
                        <div class="small text-muted" th:text="${#temporals.format(m.createdAt, 'dd/MM HH:mm')}"></div>
                        <span th:if="${c.unread > 0}" class="badge rounded-pill bg-danger" th:text="${c.unread}"></span>
                    </div>
                </a>
                <div class="p-2"><div th:replace="~{fragments/pagination :: pager(${pager})}"></div></div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

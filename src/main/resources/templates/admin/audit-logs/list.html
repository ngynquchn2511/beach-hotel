<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Nhật ký thao tác</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
    <style>
        .audit-changes { white-space: pre-line; font-size: .85rem; margin: 0; }
    </style>
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container-fluid px-lg-5 py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="fw-bold m-0">Nhật ký thao tác</h3>
                <span class="text-muted small" th:text="|${totalElements} bản ghi|"></span>
            </div>

            <form th:action="@{/admin/audit-logs}" method="get" class="row g-2 bg-white p-3 rounded shadow-sm mb-3">
                <div class="col-md-3">
                    <input type="text" name="q" th:value="${q}" class="form-control form-control-sm"
                           placeholder="Tên / email người thao tác, hoặc mã đối tượng">
                </div>
                <div class="col-md-2">
                    <select name="entityType" class="form-select form-select-sm">
                        <option value="">Mọi đối tượng</option>
                        <option th:each="e : ${entityTypes}" th:value="${e.key}" th:text="${e.value}"
                                th:selected="${e.key == entityType}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select name="action" class="form-select form-select-sm">
                        <option value="">Mọi hành động</option>
                        <option th:each="a : ${actions}" th:value="${a}" th:text="${a.vietnameseLabel}"
                                th:selected="${a == action}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select name="actorRole" class="form-select form-select-sm">
                        <option value="">Mọi vai trò</option>
                        <option th:each="r : ${actorRoles}" th:value="${r.key}" th:text="${r.value}"
                                th:selected="${r.key == actorRole}"></option>
                    </select>
                </div>
                <div class="col-md-1">
                    <input type="date" name="fromDate" th:value="${fromDate}" class="form-control form-control-sm" title="Từ ngày">
                </div>
                <div class="col-md-1">
                    <input type="date" name="toDate" th:value="${toDate}" class="form-control form-control-sm" title="Đến ngày">
                </div>
                <div class="col-md-1 d-flex gap-1">
                    <button type="submit" class="btn btn-sm btn-primary flex-fill">Lọc</button>
                    <a th:href="@{/admin/audit-logs}" class="btn btn-sm btn-outline-secondary" title="Xóa bộ lọc">✕</a>
                </div>
            </form>

            <div th:if="${#lists.isEmpty(logs)}" class="alert alert-info">Không có bản ghi nào.</div>

            <div class="table-responsive" th:if="${not #lists.isEmpty(logs)}">
                <table class="table table-striped bg-white align-middle small" style="--bs-table-striped-bg: #eaf6ff;">
                    <thead>
                    <tr>
                        <th style="width: 150px;">Thời gian</th>
                        <th style="width: 200px;">Người thao tác</th>
                        <th style="width: 100px;">Hành động</th>
                        <th style="width: 150px;">Đối tượng</th>
                        <th>Chi tiết thay đổi</th>
                        <th style="width: 150px;">Nguồn</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="l : ${logs}">
                        <td class="text-nowrap" th:text="${#temporals.format(l.createdAt, 'dd/MM/yyyy HH:mm:ss')}"></td>
                        <td>
                            <div class="fw-semibold" th:text="${l.actorName}"></div>
                            <div class="text-muted" th:if="${l.actorEmail}" th:text="${l.actorEmail}"></div>
                            <span class="badge bg-secondary" th:text="${l.actorRoleLabel}"></span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${l.action.name() == 'CREATE'} ? 'bg-success' : (${l.action.name() == 'DELETE'} ? 'bg-danger' : 'bg-warning text-dark')"
                                  th:text="${l.action.vietnameseLabel}"></span>
                        </td>
                        <td>
                            <span th:text="${l.entityTypeLabel}"></span>
                            <span class="text-muted" th:if="${l.entityId}" th:text="|#${l.entityId}|"></span>
                        </td>
                        <td><p class="audit-changes" th:text="${l.changes}"></p></td>
                        <td class="text-muted">
                            <div th:if="${l.ipAddress}" th:text="|IP: ${l.ipAddress}|"></div>
                            <div class="text-break" th:if="${l.requestUrl}" th:text="${l.requestUrl}"></div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <nav th:if="${totalPages > 1}" aria-label="Phân trang">
                <ul class="pagination justify-content-center mt-3 mb-0">
                    <li class="page-item" th:classappend="${currentPage <= 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/audit-logs(page=${currentPage - 1}, q=${q}, entityType=${entityType}, action=${action}, actorRole=${actorRole}, fromDate=${fromDate}, toDate=${toDate})}">&laquo;</a>
                    </li>
                    <li th:each="p : ${pageNumbers}" class="page-item"
                        th:classappend="${p == 0} ? 'disabled' : (${p == currentPage} ? 'active')">
                        <span th:if="${p == 0}" class="page-link">&hellip;</span>
                        <a th:unless="${p == 0}" class="page-link" th:text="${p}"
                           th:href="@{/admin/audit-logs(page=${p}, q=${q}, entityType=${entityType}, action=${action}, actorRole=${actorRole}, fromDate=${fromDate}, toDate=${toDate})}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/audit-logs(page=${currentPage + 1}, q=${q}, entityType=${entityType}, action=${action}, actorRole=${actorRole}, fromDate=${fromDate}, toDate=${toDate})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

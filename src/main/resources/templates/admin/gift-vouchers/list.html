<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thẻ quà tặng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>
        <div class="col-md-9">
            <h3 class="fw-bold mb-1">Thẻ quà tặng</h3>
            <p class="text-muted small">Khách mua ở trang /gift-vouchers. Thẻ trả bằng chuyển khoản (nội dung QT&lt;số&gt;) cần xác nhận ở đây; trả qua VNPay tự kích hoạt.</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${#lists.isEmpty(vouchers)}" class="alert alert-info">Chưa có thẻ quà tặng nào.</div>

            <div class="bg-white p-4 rounded shadow-sm" th:unless="${#lists.isEmpty(vouchers)}">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead><tr><th>Thẻ</th><th>Người mua → nhận</th><th class="text-end">Mệnh giá / còn lại</th><th>Trạng thái</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="v : ${vouchers}">
                            <td><b th:text="'QT' + ${v.id}"></b><div class="small text-muted" th:text="${v.status.name() == 'ACTIVE'} ? ${v.code} : ''"></div></td>
                            <td class="small"><span th:text="${v.purchaserName}"></span> → <span th:text="${v.recipientName}"></span>
                                <div class="text-muted" th:text="${v.recipientEmail}"></div></td>
                            <td class="text-end small"><div th:text="${#numbers.formatDecimal(v.amount, 1, 'POINT', 0, 'COMMA')}"></div>
                                <div class="text-muted" th:text="${#numbers.formatDecimal(v.balance, 1, 'POINT', 0, 'COMMA')}"></div></td>
                            <td><span class="badge" th:classappend="${v.status.name() == 'ACTIVE'} ? 'bg-success' : (${v.status.name() == 'CANCELLED'} ? 'bg-secondary' : 'bg-warning text-dark')"
                                      th:text="${v.status.vietnameseLabel}"></span>
                                <div class="small text-muted" th:if="${v.expiresAt != null}" th:text="'HSD ' + ${#temporals.format(v.expiresAt, 'dd/MM/yyyy')}"></div></td>
                            <td class="text-end text-nowrap">
                                <th:block th:if="${v.status.name() == 'PENDING_PAYMENT'}">
                                    <form class="d-inline" method="post" th:action="@{/admin/gift-vouchers/{id}/confirm-transfer(id=${v.id})}"
                                          th:attr="onsubmit=|return confirm('Đã nhận ${#numbers.formatDecimal(v.amount, 1, 'POINT', 0, 'COMMA')} VND nội dung QT${v.id}?')|">
                                        <button type="submit" class="btn btn-sm btn-success">Đã nhận tiền</button>
                                    </form>
                                    <form class="d-inline" method="post" th:action="@{/admin/gift-vouchers/{id}/cancel(id=${v.id})}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">Hủy</button>
                                    </form>
                                </th:block>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div th:replace="~{fragments/pagination :: pager(${pager})}"></div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Báo cáo cuối ngày</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
    <style>
        .kpi { background: #fff; border-radius: 8px; padding: 14px; height: 100%; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
        .kpi .v { font-size: 1.35rem; font-weight: 800; }
        @media print {
            .no-print, nav.admin-sidebar, header, footer { display: none !important; }
            .col-md-9 { width: 100% !important; }
        }
    </style>
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5" th:with="r=${report}">
    <div class="row g-4">
        <div class="col-md-3 no-print">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
                <div>
                    <h3 class="fw-bold mb-1">Báo cáo cuối ngày <span th:text="${#temporals.format(day, 'dd/MM/yyyy')}"></span></h3>
                    <p class="text-muted small mb-0">Chốt ngày cho quản lý. Tự gửi email lúc 23h30 tới:
                        <span th:text="${#lists.isEmpty(recipients)} ? 'chưa có người nhận' : ${#strings.listJoin(recipients, ', ')}"></span>
                        <span th:unless="${mailConfigured}" class="text-danger">(chưa cấu hình mail)</span></p>
                </div>
                <div class="d-flex gap-2 no-print">
                    <form method="get" class="d-flex gap-2">
                        <input type="date" name="day" class="form-control form-control-sm" th:value="${day}">
                        <button class="btn btn-sm btn-outline-primary">Xem</button>
                    </form>
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="window.print()"><i class="bi bi-printer"></i></button>
                    <form sec:authorize="hasRole('ADMIN')" method="post" th:action="@{/admin/reports/daily/send(day=${day})}">
                        <button class="btn btn-sm btn-primary text-nowrap"><i class="bi bi-envelope me-1"></i>Gửi email ngay</button>
                    </form>
                </div>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <h6 class="fw-bold mt-2">Phòng</h6>
            <div class="row g-3 mb-4">
                <div class="col-6 col-lg-3"><div class="kpi"><div class="small text-muted">Công suất</div>
                    <div class="v" th:text="${r.kpi.occupancyRate} + '%'"></div>
                    <div class="small text-muted" th:text="${r.kpi.soldRoomNights} + ' / ' + ${r.kpi.availableRoomNights} + ' phòng'"></div></div></div>
                <div class="col-6 col-lg-3"><div class="kpi"><div class="small text-muted">ADR / RevPAR</div>
                    <div class="v" th:text="${#numbers.formatDecimal(r.kpi.adr, 1, 'POINT', 0, 'COMMA')}"></div>
                    <div class="small text-muted" th:text="'RevPAR ' + ${#numbers.formatDecimal(r.kpi.revPar, 1, 'POINT', 0, 'COMMA')}"></div></div></div>
                <div class="col-6 col-lg-3"><div class="kpi"><div class="small text-muted">Khách đến / đi</div>
                    <div class="v" th:text="${r.arrivalsDone} + '/' + ${r.arrivalsExpected} + ' · ' + ${r.departuresDone} + '/' + ${r.departuresExpected}"></div>
                    <div class="small text-muted" th:text="'Đang ở ' + ${r.inHouse} + ' phòng'"></div></div></div>
                <div class="col-6 col-lg-3"><div class="kpi"><div class="small text-muted">Không đến</div>
                    <div class="v" th:text="${#lists.size(r.noShowsMarked)}"></div>
                    <div class="small" th:classappend="${#lists.isEmpty(r.stillNotArrived)} ? 'text-muted' : 'text-danger fw-semibold'"
                         th:text="${#lists.size(r.stillNotArrived)} + ' khách quá giờ chưa đến'"></div></div></div>
            </div>

            <h6 class="fw-bold">Thu chi (VND)</h6>
            <div class="bg-white rounded shadow-sm p-3 mb-4">
                <table class="table table-sm mb-0">
                    <tbody>
                    <tr><td>Tiền mặt</td><td class="text-end" th:text="${#numbers.formatDecimal(r.income[T(com.hotel.entity.PaymentMethod).CASH], 1, 'POINT', 0, 'COMMA')}"></td></tr>
                    <tr><td>Chuyển khoản</td><td class="text-end" th:text="${#numbers.formatDecimal(r.income[T(com.hotel.entity.PaymentMethod).BANK_TRANSFER], 1, 'POINT', 0, 'COMMA')}"></td></tr>
                    <tr><td>Online (VNPay)</td><td class="text-end" th:text="${#numbers.formatDecimal(r.income[T(com.hotel.entity.PaymentMethod).ONLINE], 1, 'POINT', 0, 'COMMA')}"></td></tr>
                    <tr><td>Hoàn cọc</td><td class="text-end text-danger" th:text="'-' + ${#numbers.formatDecimal(r.refunds, 1, 'POINT', 0, 'COMMA')}"></td></tr>
                    <tr class="fw-bold"><td>Thực thu</td><td class="text-end" th:text="${#numbers.formatDecimal(r.net, 1, 'POINT', 0, 'COMMA')}"></td></tr>
                    </tbody>
                </table>
                <div class="small mt-2" th:unless="${#lists.isEmpty(r.shifts)}">
                    <span th:text="${#lists.size(r.shifts)} + ' ca trực đóng trong ngày, chênh lệch tiền mặt '"></span>
                    <b th:classappend="${r.shiftDifferenceTotal.signum() != 0} ? 'text-danger'"
                       th:text="${#numbers.formatDecimal(r.shiftDifferenceTotal, 1, 'POINT', 0, 'COMMA')}"></b>
                    <a class="no-print ms-1" th:each="s : ${r.shifts}" th:href="@{/admin/shifts/{id}(id=${s.shift.id})}" th:text="'#' + ${s.shift.id}"></a>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <h6 class="fw-bold">Đặt phòng trong ngày</h6>
                    <div class="bg-white rounded shadow-sm p-3 h-100 small">
                        <div th:text="'Đơn mới: ' + ${r.newBookings} + ' (' + ${#numbers.formatDecimal(r.newBookingsValue, 1, 'POINT', 0, 'COMMA')} + ' VND)'"></div>
                        <div th:text="'Đơn hủy: ' + ${#lists.size(r.cancellations)}"></div>
                        <ul class="mb-0 mt-1" th:unless="${#lists.isEmpty(r.noShowsMarked)}">
                            <li th:each="b : ${r.noShowsMarked}"><a th:href="@{/admin/bookings/{id}(id=${b.id})}" th:text="'#' + ${b.id}"></a>
                                <span th:text="' không đến · phòng ' + ${b.room.roomNumber} + ' · ' + ${b.guestName}"></span></li>
                        </ul>
                    </div>
                </div>
                <div class="col-md-6">
                    <h6 class="fw-bold">Việc còn tồn <span class="badge bg-warning text-dark" th:text="${r.pending.total}"></span></h6>
                    <div class="bg-white rounded shadow-sm p-3 h-100 small">
                        <div th:text="'Đơn chờ xác nhận: ' + ${r.pending.bookingsToConfirm}"></div>
                        <div th:text="'Hoàn cọc chờ chuyển: ' + ${r.pending.refunds}"></div>
                        <div th:text="'Nhận sớm / trả muộn chờ duyệt: ' + ${r.pending.stayTimeRequests}"></div>
                        <div th:text="'Spa / bàn chờ xác nhận: ' + ${r.pending.facilities}"></div>
                        <div th:text="'Gọi lên phòng chờ giao: ' + ${r.pending.roomService}"></div>
                        <div th:text="'Phiếu bảo trì chưa xong: ' + ${r.pending.maintenance}"></div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded shadow-sm p-3" th:unless="${#lists.isEmpty(r.stillNotArrived)}">
                <h6 class="fw-bold text-danger">Khách quá giờ nhận phòng mà chưa đến</h6>
                <ul class="small mb-0">
                    <li th:each="b : ${r.stillNotArrived}"><a th:href="@{/admin/bookings/{id}(id=${b.id})}" th:text="'#' + ${b.id}"></a>
                        <span th:text="' · phòng ' + ${b.room.roomNumber} + ' · ' + ${b.guestName} + ' · ' + ${b.guestPhone} + ' · nhận ' + ${#temporals.format(b.checkInDate, 'dd/MM')}"></span></li>
                </ul>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <h3 class="fw-bold mb-4">Danh sách khách hàng</h3>

            <div th:if="${#lists.isEmpty(customers)}" class="alert alert-info">
                Chưa có khách hàng nào đăng ký.
            </div>

            <table class="table table-striped bg-white align-middle" style="--bs-table-striped-bg: #eaf6ff;" th:if="${not #lists.isEmpty(customers)}">
                <thead>
                <tr>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Số điện thoại</th>
                    <th>Loại khách hàng</th>
                    <th>Ngày đăng ký</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${customers}">
                    <td th:text="${c.fullName}"></td>
                    <td th:text="${c.email}"></td>
                    <td th:text="${c.phoneNumber}"></td>
                    <td>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/admin/customers/{id}/update-type(id=${c.id})}" method="post" class="d-flex gap-1">
                            <select name="customerType" class="form-select form-select-sm" style="width: auto;" onchange="this.form.submit()">
                                <option th:each="ct : ${customerTypes}" th:value="${ct}" th:text="${ct.vietnameseLabel}"
                                        th:selected="${ct == c.customerType}"></option>
                            </select>
                        </form>
                        <span sec:authorize="!hasRole('ADMIN')" th:text="${c.customerType?.vietnameseLabel}"></span>
                    </td>
                    <td th:text="${#temporals.format(c.createdAt, 'dd/MM/yyyy')}"></td>
                    <td>
                        <span class="badge" th:classappend="${c.isLocked()} ? 'bg-danger' : 'bg-success'"
                              th:text="${c.isLocked()} ? 'Đã khóa' : 'Hoạt động'"></span>
                    </td>
                    <td class="text-end">
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/admin/customers/{id}/toggle-lock(id=${c.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Xác nhận thay đổi trạng thái khóa của tài khoản này?')">
                            <button type="submit" class="btn btn-sm"
                                    th:classappend="${c.isLocked()} ? 'btn-outline-success' : 'btn-outline-danger'"
                                    th:text="${c.isLocked()} ? 'Mở khóa' : 'Khóa'"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:replace="~{fragments/pagination :: pagination('/admin/customers', ${currentPage}, ${totalPages}, ${pageNumbers}, null, null)}"></div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đồ thất lạc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>
        <div class="col-md-9">
            <h3 class="fw-bold mb-1">Đồ thất lạc</h3>
            <p class="text-muted small" th:text="'Chọn phòng là tự gắn với khách đang ở / vừa trả phòng đó trong ' + ${linkDays} + ' ngày. Đồ cất quá ' + ${keepDays} + ' ngày sẽ được nhắc thanh lý.'"></p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form th:action="@{/admin/lost-found}" method="post" class="bg-white p-4 rounded shadow-sm mb-4 row g-2 align-items-end">
                <div class="col-md-2"><label class="form-label small">Phòng</label>
                    <select name="roomId" class="form-select form-select-sm"><option value="">--</option>
                        <option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.roomNumber}"></option></select></div>
                <div class="col-md-2"><label class="form-label small">Mã đơn (nếu biết)</label>
                    <input type="number" name="bookingId" class="form-control form-control-sm" min="1"></div>
                <div class="col-md-5"><label class="form-label small">Đồ vật</label>
                    <input type="text" name="description" class="form-control form-control-sm" maxlength="200" required placeholder="VD: Sạc điện thoại màu trắng"></div>
                <div class="col-md-3"><label class="form-label small">Cất ở</label>
                    <input type="text" name="storageLocation" class="form-control form-control-sm" maxlength="100" placeholder="VD: Tủ lễ tân ngăn 2"></div>
                <div class="col-12"><button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-plus-lg me-1"></i>Ghi nhận</button></div>
            </form>

            <div th:if="${#lists.isEmpty(items)}" class="alert alert-info">Chưa có đồ thất lạc nào.</div>
            <div class="bg-white p-4 rounded shadow-sm" th:unless="${#lists.isEmpty(items)}">
                <div th:each="i : ${items}" class="border-bottom py-2"
                     th:with="overdue=${T(com.hotel.service.LostItemService).overdue(i)}">
                    <div class="d-flex justify-content-between flex-wrap gap-2">
                        <div>
                            <b th:text="${i.description}"></b>
                            <span class="badge ms-1" th:classappend="${i.stored} ? 'bg-warning text-dark' : 'bg-secondary'" th:text="${i.status.vietnameseLabel}"></span>
                            <span th:if="${overdue}" class="badge bg-danger ms-1">Quá hạn cất giữ - nên thanh lý</span>
                            <div class="small text-muted"
                                 th:text="${(i.room != null ? 'Phòng ' + i.room.roomNumber + ' · ' : '') + 'tìm thấy ' + #temporals.format(i.foundAt, 'HH:mm dd/MM/yyyy')
                                          + (i.foundBy != null ? ' bởi ' + i.foundBy : '') + (i.storageLocation != null ? ' · cất ở ' + i.storageLocation : '')}"></div>
                            <div class="small" th:if="${i.booking != null}">
                                Khách: <a th:href="@{/admin/bookings/{id}(id=${i.booking.id})}" th:text="'#' + ${i.booking.id} + ' ' + ${i.booking.guestName}"></a>
                                <span class="text-muted" th:text="${i.booking.guestPhone}"></span>
                                <span class="text-success" th:if="${i.guestNotifiedAt != null}" th:text="' · đã báo ' + ${#temporals.format(i.guestNotifiedAt, 'dd/MM')}"></span>
                            </div>
                            <div class="small text-muted" th:if="${i.closeNote != null}" th:text="${i.closeNote}"></div>
                        </div>
                        <div class="d-flex gap-1 align-items-start" th:if="${i.stored}">
                            <form th:if="${i.booking != null}" method="post" th:action="@{/admin/lost-found/{id}/notify(id=${i.id})}">
                                <button type="submit" class="btn btn-sm btn-outline-primary"><i class="bi bi-envelope"></i> Báo khách</button>
                            </form>
                            <form method="post" class="d-flex gap-1" th:action="@{/admin/lost-found/{id}/close(id=${i.id})}">
                                <input type="text" name="note" class="form-control form-control-sm" maxlength="200" placeholder="Ghi chú" style="max-width: 140px">
                                <button type="submit" name="status" value="RETURNED" class="btn btn-sm btn-success text-nowrap">Đã trả</button>
                                <button type="submit" name="status" value="DISPOSED" class="btn btn-sm btn-outline-secondary text-nowrap">Thanh lý</button>
                            </form>
                        </div>
                    </div>
                </div>
                <div th:replace="~{fragments/pagination :: pager(${pager})}"></div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

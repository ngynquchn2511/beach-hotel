<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thống kê mã giảm giá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5" th:with="s=${stats}">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <a th:href="@{/admin/discount-codes}" class="small"><i class="bi bi-arrow-left"></i> Mã giảm giá</a>
            <h3 class="fw-bold mb-3">Mã <span class="font-monospace" th:text="${s.code.code}"></span></h3>

            <div class="row g-3 mb-4">
                <div class="col-sm-4"><div class="bg-white p-3 rounded shadow-sm h-100"><div class="small text-muted">Lượt đã dùng</div>
                    <div class="fw-bold fs-5" th:text="${s.uses} + (${s.code.maxUses != null} ? ' / ' + ${s.code.maxUses} : '')"></div></div></div>
                <div class="col-sm-4"><div class="bg-white p-3 rounded shadow-sm h-100"><div class="small text-muted">Tổng tiền đã giảm (VND)</div>
                    <div class="fw-bold fs-5" th:text="${#numbers.formatDecimal(s.discountTotal, 1, 'POINT', 0, 'COMMA')}"></div></div></div>
                <div class="col-sm-4"><div class="bg-white p-3 rounded shadow-sm h-100"><div class="small text-muted">Doanh thu các đơn dùng mã (VND)</div>
                    <div class="fw-bold fs-5" th:text="${#numbers.formatDecimal(s.revenue, 1, 'POINT', 0, 'COMMA')}"></div></div></div>
            </div>
            <p class="small text-muted">Không tính đơn đã hủy. Đơn đoàn: mỗi phòng một dòng, cả đoàn tính một lượt.</p>

            <div th:if="${#lists.isEmpty(bookings)}" class="alert alert-info">Chưa có đơn nào dùng mã này.</div>
            <div class="bg-white p-3 rounded shadow-sm" th:unless="${#lists.isEmpty(bookings)}">
                <table class="table table-sm align-middle mb-0">
                    <thead><tr><th>Đơn</th><th>Ngày đặt</th><th>Khách</th><th class="text-end">Giảm</th><th class="text-end">Tổng đơn</th><th>Trạng thái</th></tr></thead>
                    <tbody>
                    <tr th:each="b : ${bookings}" th:classappend="${b.status.name() == 'CANCELLED'} ? 'text-muted'">
                        <td><a th:href="@{/admin/bookings/{id}(id=${b.id})}" th:text="'#' + ${b.id}"></a>
                            <span th:if="${b.group != null}" class="badge bg-primary-subtle text-primary-emphasis">Đoàn</span></td>
                        <td class="small" th:text="${#temporals.format(b.createdAt, 'dd/MM/yyyy')}"></td>
                        <td th:text="${b.guestName}"></td>
                        <td class="text-end" th:text="${b.discountAmount != null} ? ${#numbers.formatDecimal(b.discountAmount, 1, 'POINT', 0, 'COMMA')} : '0'"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(b.totalAmount, 1, 'POINT', 0, 'COMMA')}"></td>
                        <td><span th:class="'badge ' + ${b.status.badgeClass}" th:text="${b.status.vietnameseLabel}"></span></td>
                    </tr>
                    </tbody>
                </table>
                <div th:replace="~{fragments/pagination :: pager(${pager})}"></div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

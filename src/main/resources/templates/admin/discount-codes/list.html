<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý mã giảm giá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold m-0">Mã giảm giá</h3>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/discount-codes/new}" class="btn btn-primary">Thêm mã giảm giá</a>
            </div>

            <div th:if="${#lists.isEmpty(discountCodes)}" class="alert alert-info">
                Chưa có mã giảm giá nào.
            </div>

            <table class="table table-striped bg-white align-middle" style="--bs-table-striped-bg: #eaf6ff;" th:if="${not #lists.isEmpty(discountCodes)}">
                <thead>
                <tr>
                    <th>Mã</th>
                    <th>Loại giảm</th>
                    <th>Giá trị</th>
                    <th>Áp dụng cho</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="dc : ${discountCodes}">
                    <td><span class="fw-bold" th:text="${dc.code}"></span></td>
                    <td th:text="${dc.discountType.vietnameseLabel}"></td>
                    <td th:text="${dc.discountType.name() == 'PERCENTAGE'} ? (${#numbers.formatDecimal(dc.discountValue, 1, 0)} + ' %') : (${#numbers.formatDecimal(dc.discountValue, 1, 0)} + 'VND')"></td>
                    <td th:text="${dc.applicableCustomerType != null} ? ${dc.applicableCustomerType.vietnameseLabel} : 'Tất cả khách hàng'"></td>
                    <td>
                        <span class="badge" th:classappend="${dc.active} ? 'bg-success' : 'bg-secondary'"
                              th:text="${dc.active} ? 'Đang áp dụng' : 'Đã tắt'"></span>
                    </td>
                    <td class="text-end">
                        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/discount-codes/{id}/edit(id=${dc.id})}" class="btn btn-sm btn-outline-secondary">Sửa</a>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/admin/discount-codes/{id}/toggle-active(id=${dc.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-warning" th:text="${dc.active} ? 'Tắt' : 'Bật'"></button>
                        </form>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/admin/discount-codes/{id}/delete(id=${dc.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Xóa mã giảm giá này?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:replace="~{fragments/pagination :: pagination('/admin/discount-codes', ${currentPage}, ${totalPages}, ${pageNumbers}, null, null)}"></div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

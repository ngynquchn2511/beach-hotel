<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Đặt phòng tại quầy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <a th:if="${preselectedRoomId != null}" th:href="@{/admin/rooms/{id}/view(id=${preselectedRoomId})}" class="d-inline-block mb-3">&laquo; Quay lại phòng</a>
            <a th:unless="${preselectedRoomId != null}" th:href="@{/admin/bookings}" class="d-inline-block mb-3">&laquo; Quay lại danh sách đặt phòng</a>
            <h3 class="fw-bold mb-4">Đặt phòng tại quầy (khách vãng lai)</h3>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="bg-white p-4 rounded shadow-sm mb-4">
                <h6 class="fw-bold mb-3">Bước 1: Tìm phòng còn trống</h6>
                <form th:action="@{/admin/bookings/walk-in/new}" method="get" class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label">Ngày nhận phòng</label>
                        <input type="date" name="checkIn" class="form-control" th:value="${checkIn}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Ngày trả phòng</label>
                        <input type="date" name="checkOut" class="form-control" th:value="${checkOut}" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Số khách</label>
                        <input type="number" name="guests" min="1" class="form-control" th:value="${guests}">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-outline-primary w-100">Tìm phòng</button>
                    </div>
                </form>
            </div>

            <div class="bg-white p-4 rounded shadow-sm" th:if="${checkIn != null and checkOut != null}">
                <h6 class="fw-bold mb-3">Bước 2: Thông tin khách và chọn phòng</h6>

                <div th:if="${#lists.isEmpty(availableRooms)}" class="alert alert-info">
                    Không có phòng trống trong khoảng ngày này.
                </div>

                <form th:if="${not #lists.isEmpty(availableRooms)}" th:action="@{/admin/bookings/walk-in/new}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Email nhan xac nhan</label>
                        <input type="email" name="guestEmail" class="form-control" required>
                    </div>
                    <input type="hidden" name="checkIn" th:value="${checkIn}">
                    <input type="hidden" name="checkOut" th:value="${checkOut}">
                    <input type="hidden" th:if="${guests != null}" name="guests" th:value="${guests}">

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Họ tên khách</label>
                            <input type="text" name="guestName" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" name="guestPhone" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Chọn phòng</label>
                        <select name="roomId" class="form-select" required>
                            <option th:each="room : ${availableRooms}" th:value="${room.id}"
                                    th:text="'Phòng ' + ${room.roomNumber} + ' - ' + ${room.roomType.name} + ' (' + ${#numbers.formatDecimal(room.price, 1, 0)} + 'VND/đêm)'"
                                    th:selected="${preselectedRoomId != null and room.id == preselectedRoomId}"></option>
                        </select>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Giờ nhận phòng</label>
                            <select name="checkInTime" class="form-select">
                                <option th:each="t : ${timeOptions}" th:value="${t}" th:text="${t}" th:selected="${t.toString() == '14:00'}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Giờ trả phòng</label>
                            <select name="checkOutTime" class="form-select">
                                <option th:each="t : ${timeOptions}" th:value="${t}" th:text="${t}" th:selected="${t.toString() == '12:00'}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Combo dịch vụ</label>
                        <select name="comboId" class="form-select">
                            <option value="">Phòng thường (không combo)</option>
                            <option th:each="c : ${combos}" th:value="${c.id}"
                                    th:text="${c.name} + ' (+' + ${#numbers.formatDecimal(c.price, 1, 0)} + 'VND)'"
                                    th:selected="${preselectedComboId != null and c.id == preselectedComboId}"></option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Xác nhận đặt phòng</button>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

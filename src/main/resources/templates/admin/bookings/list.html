<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý đặt phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container-fluid py-5 px-4">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="fw-bold m-0">Quản lý đặt phòng</h3>
                <a th:href="@{/admin/bookings/walk-in/new}" class="btn btn-primary">Đặt phòng tại quầy</a>
            </div>

            <div class="bg-white p-3 rounded shadow-sm mb-3">
                <form th:action="@{/admin/bookings}" method="get" class="d-flex gap-2 align-items-center flex-wrap">
                    <label class="form-label m-0">Lọc theo trạng thái:</label>
                    <select name="status" class="form-select form-select-sm" style="width: auto;" onchange="this.form.submit()">
                        <option value="">Tất cả</option>
                        <option th:each="s : ${allStatuses}" th:value="${s}" th:text="${s.vietnameseLabel}"
                                th:selected="${s == statusFilter}"></option>
                    </select>
                    <input type="text" name="q" th:value="${searchQuery}" class="form-control form-control-sm"
                           style="width: 260px;" placeholder="Tìm theo tên, email hoặc SĐT khách hàng">
                    <button type="submit" class="btn btn-sm btn-primary">Tìm kiếm</button>
                    <a th:if="${statusFilter != null or (searchQuery != null and !#strings.isEmpty(searchQuery))}"
                       th:href="@{/admin/bookings}" class="btn btn-sm btn-outline-secondary">Bỏ lọc</a>
                </form>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div th:if="${#lists.isEmpty(bookings)}" class="alert alert-info">
                Không có đơn đặt phòng nào phù hợp.
            </div>

            <table class="table table-striped bg-white align-middle" style="--bs-table-striped-bg: #eaf6ff;"
                   th:if="${not #lists.isEmpty(bookings)}">
                <thead>
                <tr>
                    <th>Mã đơn</th>
                    <th>Khách hàng</th>
                    <th>SĐT</th>
                    <th>Phòng</th>
                    <th>Ngày nhận</th>
                    <th>Ngày trả</th>
                    <th>Tổng tiền</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <!-- Don moi chua duoc staff xem qua se to nguyen ca dong 1 mau rieng, de len tren mau soc xen ke -->
                <tr th:each="b : ${bookings}" th:classappend="${b.newBooking} ? 'table-danger'">
                    <td th:text="'#' + ${b.id}"></td>
                    <td th:text="${b.guestName != null} ? ${b.guestName} : ${b.customer.fullName}"></td>
                    <td th:text="${b.guestPhone != null} ? ${b.guestPhone} : ${b.customer.phoneNumber}"></td>
                    <td th:text="'Phòng ' + ${b.room.roomNumber}"></td>
                    <td th:text="${b.checkInDate} + ' ' + ${b.checkInTime}"></td>
                    <td th:text="${b.checkOutDate} + ' ' + ${b.checkOutTime}"></td>
                    <td th:text="${#numbers.formatDecimal(b.totalAmount, 1, 0)} + 'VND'"></td>
                    <td>
                        <span th:class="'badge ' + ${b.status.badgeClass}" th:text="${b.status.vietnameseLabel}"></span>
                        <span th:if="${b.newBooking}" class="badge bg-danger d-block mt-1">Đơn mới</span>
                    </td>
                    <td>
                        <span th:if="${b.checkInTimeChanged}" class="badge bg-warning text-dark d-block mb-1">Khách đổi giờ nhận phòng</span>
                        <a th:href="@{/admin/bookings/{id}(id=${b.id})}" class="btn btn-sm btn-outline-primary">Xem chi tiết</a>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:replace="~{fragments/pagination :: pagination('/admin/bookings', ${currentPage}, ${totalPages}, ${pageNumbers}, ${statusFilter}, ${searchQuery})}"></div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

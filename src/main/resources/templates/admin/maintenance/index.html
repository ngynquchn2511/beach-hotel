<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bảo trì phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <h3 class="fw-bold mb-1">Bảo trì phòng</h3>
            <p class="text-muted small">Ghi phiếu khi phòng hỏng. Chọn "Khóa phòng" để không ai đặt / nhận phòng trong lúc sửa;
                sửa xong phòng chuyển sang "Chờ dọn" ở bảng Dọn phòng.</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <!-- Khach sap den ma phong dang bao tri -->
            <div class="alert alert-danger" th:unless="${#lists.isEmpty(atRisk)}">
                <div class="fw-bold mb-1"><i class="bi bi-exclamation-octagon me-1"></i>
                    <span th:text="'Khách sắp đến (' + ${warnDays} + ' ngày tới) nhưng phòng đang bảo trì - cần đổi phòng:'"></span></div>
                <div th:each="b : ${atRisk}" class="d-flex justify-content-between align-items-center py-1 border-top border-danger-subtle">
                    <span th:text="'#' + ${b.id} + ' · ' + ${b.guestName} + ' · phòng ' + ${b.room.roomNumber} + ' · nhận ' + ${#temporals.format(b.checkInDate, 'dd/MM')}"></span>
                    <a class="btn btn-sm btn-light" sec:authorize="hasAnyRole('ADMIN','STAFF')" th:href="@{/admin/bookings/{id}/move(id=${b.id})}"><i class="bi bi-arrow-left-right me-1"></i>Đổi phòng</a>
                </div>
            </div>

            <form th:action="@{/admin/maintenance}" method="post" class="bg-white p-4 rounded shadow-sm mb-4 row g-2 align-items-end">
                <h5 class="fw-bold col-12 mb-1">Báo hỏng</h5>
                <div class="col-md-2">
                    <label class="form-label small">Phòng</label>
                    <select name="roomId" class="form-select form-select-sm" required>
                        <option value="">--</option>
                        <option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.roomNumber}" th:selected="${r.id == selectedRoomId}"></option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label small">Hỏng gì</label>
                    <input type="text" name="title" class="form-control form-control-sm" maxlength="150" required placeholder="VD: Điều hòa chảy nước">
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Mức độ</label>
                    <select name="priority" class="form-select form-select-sm">
                        <option th:each="p : ${priorities}" th:value="${p}" th:text="${p.vietnameseLabel}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Dự kiến xong</label>
                    <input type="date" name="expectedDoneDate" class="form-control form-control-sm" th:min="${today}">
                </div>
                <div class="col-md-9">
                    <input type="text" name="description" class="form-control form-control-sm" maxlength="500" placeholder="Mô tả thêm (không bắt buộc)">
                </div>
                <div class="col-md-3 d-flex gap-2 align-items-center">
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox" name="blocksRoom" value="true" id="blocksRoom">
                        <label class="form-check-label small" for="blocksRoom">Khóa phòng</label>
                    </div>
                    <button type="submit" class="btn btn-sm btn-danger ms-auto">Ghi phiếu</button>
                </div>
            </form>

            <div class="bg-white p-4 rounded shadow-sm mb-4">
                <h5 class="fw-bold mb-3">Đang mở <span class="badge bg-secondary" th:text="${#lists.size(tickets)}"></span></h5>
                <p th:if="${#lists.isEmpty(tickets)}" class="text-muted mb-0">Không có phiếu nào đang mở.</p>
                <div th:each="t : ${tickets}" class="border rounded p-3 mb-2" th:classappend="${t.priority.name() == 'URGENT'} ? 'border-danger'">
                    <div class="d-flex justify-content-between flex-wrap gap-2">
                        <div>
                            <b th:text="'Phòng ' + ${t.room.roomNumber} + ': ' + ${t.title}"></b>
                            <span th:if="${t.priority.name() == 'URGENT'}" class="badge bg-danger ms-1">Khẩn</span>
                            <span th:if="${t.blocksRoom}" class="badge bg-secondary ms-1">Đang khóa phòng</span>
                            <span class="badge bg-info-subtle text-info-emphasis ms-1" th:text="${t.status.vietnameseLabel}"></span>
                            <div class="small text-muted" th:if="${t.description}" th:text="${t.description}"></div>
                            <div class="small text-muted"
                                 th:text="'Báo lúc ' + ${#temporals.format(t.createdAt, 'HH:mm dd/MM')} + (${t.reportedBy != null} ? ' bởi ' + ${t.reportedBy} : '')
                                          + (${t.assignee != null} ? ' · đang sửa: ' + ${t.assignee} : '')
                                          + (${t.expectedDoneDate != null} ? ' · dự kiến xong ' + ${#temporals.format(t.expectedDoneDate, 'dd/MM')} : '')"></div>
                            <div class="small text-danger fw-semibold" th:if="${t.expectedDoneDate != null and t.expectedDoneDate.isBefore(today)}">Quá hạn dự kiến</div>
                        </div>
                        <div class="d-flex gap-2 align-items-start">
                            <form th:if="${t.status.name() == 'OPEN'}" method="post" th:action="@{/admin/maintenance/{id}/start(id=${t.id})}">
                                <button type="submit" class="btn btn-sm btn-outline-primary">Nhận sửa</button>
                            </form>
                            <form method="post" class="d-flex gap-1" th:action="@{/admin/maintenance/{id}/resolve(id=${t.id})}">
                                <input type="text" name="note" class="form-control form-control-sm" maxlength="300" placeholder="Đã làm gì">
                                <button type="submit" class="btn btn-sm btn-success text-nowrap">Xong</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white p-4 rounded shadow-sm" th:unless="${#lists.isEmpty(resolved)}">
                <h5 class="fw-bold mb-3">Đã xong 7 ngày qua</h5>
                <ul class="list-unstyled small mb-0">
                    <li th:each="t : ${resolved}" class="border-bottom py-1">
                        <b th:text="'Phòng ' + ${t.room.roomNumber}"></b> · <span th:text="${t.title}"></span>
                        <span class="text-muted" th:text="' · ' + ${#temporals.format(t.resolvedAt, 'HH:mm dd/MM')}
                              + (${t.assignee != null} ? ' · ' + ${t.assignee} : '') + (${t.resolutionNote != null} ? ' · ' + ${t.resolutionNote} : '')"></span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Lịch trực ca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
    <style>
        .roster td, .roster th { min-width: 92px; vertical-align: top; }
        .roster th.today, .roster td.today { background: #fff8db; }
        .shift-tag { display: inline-flex; align-items: center; gap: 2px; font-size: .78rem; font-weight: 600; padding: .1rem .45rem;
                     border-radius: 6px; margin: 1px 0; white-space: nowrap; }
        .shift-MORNING { background: #e3f1fb; color: #1f6fa8; }
        .shift-AFTERNOON { background: #fff1cc; color: #8a5a00; }
        .shift-NIGHT { background: #ece6fb; color: #5b3fb0; }
        .shift-tag form { display: inline; }
        .shift-tag button { border: 0; background: none; padding: 0 0 0 2px; line-height: 1; color: inherit; opacity: .6; }
        .shift-tag button:hover { opacity: 1; }
    </style>
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>
        <div class="col-md-9">
            <h3 class="fw-bold mb-1">Lịch trực ca</h3>
            <p class="text-muted small">3 ca mỗi ngày: <b>sáng</b> 06:00-14:00, <b>chiều</b> 14:00-22:00, <b>đêm</b> 22:00-06:00 sáng hôm sau.
                Nhân viên vào cổng quản trị là hệ thống tự chấm công và biết ai đang có mặt.</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <div th:replace="~{fragments/on-duty :: box(${onDuty})}"></div>

            <div class="bg-white p-4 rounded shadow-sm mb-4">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                    <h5 class="fw-bold mb-0" th:text="'Tuần ' + ${#temporals.format(week.start, 'dd/MM')} + ' - ' + ${#temporals.format(week.start.plusDays(6), 'dd/MM/yyyy')}"></h5>
                    <div class="d-flex gap-2">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/duty-roster(week=${week.prev})}"><i class="bi bi-chevron-left"></i> Tuần trước</a>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/duty-roster}">Tuần này</a>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/duty-roster(week=${week.next})}">Tuần sau <i class="bi bi-chevron-right"></i></a>
                        <form sec:authorize="hasRole('ADMIN')" method="post" th:action="@{/admin/duty-roster/copy(week=${week.start})}"
                              onsubmit="return confirm('Chép toàn bộ lịch tuần này sang tuần sau? (ca đã có ở tuần sau giữ nguyên)')">
                            <button class="btn btn-sm btn-outline-primary"><i class="bi bi-copy me-1"></i>Chép sang tuần sau</button>
                        </form>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-bordered table-sm small roster mb-2">
                        <thead class="table-light">
                        <tr>
                            <th>Nhân viên</th>
                            <th th:each="d : ${week.days}" th:classappend="${d == today} ? 'today'" class="text-center">
                                <span th:text="${dowLabels[d.dayOfWeek.value - 1]}"></span><br>
                                <span class="fw-normal" th:text="${#temporals.format(d, 'dd/MM')}"></span>
                            </th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${week.rows}">
                            <td><div class="fw-semibold" th:text="${r.staff.fullName}"></div>
                                <div class="text-muted" th:text="${r.staff.role.vietnameseLabel}"></div></td>
                            <td th:each="cell, st : ${r.days}" th:classappend="${week.days[st.index] == today} ? 'today'">
                                <div th:each="d : ${cell}" class="shift-tag" th:classappend="'shift-' + ${d.shift.name()}"
                                     th:title="${d.shift.timeRange} + (${d.note != null} ? ' - ' + ${d.note} : '')">
                                    <span th:text="${d.shift.label.replace('Ca ', '')}"></span>
                                    <form sec:authorize="hasRole('ADMIN')" method="post" th:action="@{/admin/duty-roster/{id}/delete(id=${d.id}, week=${week.start})}">
                                        <button title="Bỏ ca này"><i class="bi bi-x"></i></button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${!#lists.isEmpty(week.gaps)}" class="small text-danger">
                    <i class="bi bi-exclamation-triangle me-1"></i>Ca chưa có ai trực: <span th:text="${#strings.listJoin(week.gaps, ', ')}"></span>
                </div>
            </div>

            <div sec:authorize="hasRole('ADMIN')" class="bg-white p-4 rounded shadow-sm">
                <h5 class="fw-bold">Xếp ca</h5>
                <form method="post" th:action="@{/admin/duty-roster/assign}" class="row g-2 align-items-end">
                    <div class="col-md-4"><label class="form-label small">Nhân viên</label>
                        <select name="staffId" class="form-select form-select-sm" required>
                            <option th:each="u : ${staffList}" th:value="${u.id}" th:text="${u.fullName} + ' - ' + ${u.role.vietnameseLabel}"></option>
                        </select></div>
                    <div class="col-md-3"><label class="form-label small">Ca</label>
                        <select name="shift" class="form-select form-select-sm">
                            <option th:each="s : ${shifts}" th:value="${s}" th:text="${s.label} + ' (' + ${s.timeRange} + ')'"></option>
                        </select></div>
                    <div class="col-md-2"><label class="form-label small">Từ ngày</label>
                        <input type="date" name="from" class="form-control form-control-sm" th:value="${week.start}" required></div>
                    <div class="col-md-2"><label class="form-label small">Đến ngày</label>
                        <input type="date" name="to" class="form-control form-control-sm" th:value="${week.start.plusDays(6)}"></div>
                    <div class="col-12 small">
                        <span class="me-2">Các thứ:</span>
                        <label th:each="w : ${weekdays}" class="me-2">
                            <input type="checkbox" name="weekdays" th:value="${w}" checked> <span th:text="${dowLabels[w.value - 1]}"></span>
                        </label>
                    </div>
                    <div class="col-md-8"><input type="text" name="note" maxlength="200" class="form-control form-control-sm" placeholder="Ghi chú (tùy chọn), VD: trực quầy lễ tân"></div>
                    <div class="col-md-4"><button class="btn btn-primary btn-sm w-100"><i class="bi bi-calendar-plus me-1"></i>Xếp ca</button></div>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý loại phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold m-0">Danh sách loại phòng</h3>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/room-types/new}" class="btn btn-primary">Thêm loại phòng</a>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div th:if="${#lists.isEmpty(roomTypes)}" class="alert alert-info">
                Chưa có loại phòng nào.
            </div>

            <table class="table table-striped bg-white" style="--bs-table-striped-bg: #eaf6ff;" th:if="${not #lists.isEmpty(roomTypes)}">
                <thead>
                <tr>
                    <th>Tên</th>
                    <th>Giá cơ bản</th>
                    <th>Sức chứa</th>
                    <th>Diện tích</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="rt : ${roomTypes}">
                    <td th:text="${rt.name}"></td>
                    <td th:text="${#numbers.formatDecimal(rt.basePrice, 1, 0)} + 'VND'"></td>
                    <td th:text="${rt.maxGuests} + ' người'"></td>
                    <td th:text="${rt.area} + ' m2'"></td>
                    <td class="text-end">
                        <a th:href="@{/admin/room-types/{id}/edit(id=${rt.id})}" class="btn btn-sm btn-outline-secondary">Sửa</a>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/admin/room-types/{id}/delete(id=${rt.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Xóa loại phòng này?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:replace="~{fragments/pagination :: pagination('/admin/room-types', ${currentPage}, ${totalPages}, ${pageNumbers}, null, null)}"></div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

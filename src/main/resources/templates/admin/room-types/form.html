<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Sửa loại phòng' : 'Thêm loại phòng'">Loại phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <h3 class="fw-bold mb-4" th:text="${isEdit} ? 'Sửa loại phòng' : 'Thêm loại phòng'"></h3>

            <div class="bg-white p-4 rounded shadow-sm" style="max-width: 600px;">
                <form th:action="${isEdit} ? @{/admin/room-types/{id}/edit(id=${roomTypeId})} : @{/admin/room-types/new}"
                      th:object="${roomTypeRequest}" method="post">

                    <div class="mb-3">
                        <label class="form-label">Tên loại phòng</label>
                        <input type="text" th:field="*{name}" class="form-control">
                        <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tên loại phòng <span class="badge bg-info text-dark">EN</span> <span class="text-muted small">(không bắt buộc — bỏ trống thì khách chọn tiếng Anh vẫn thấy bản tiếng Việt)</span></label>
                        <input type="text" th:field="*{nameEn}" class="form-control" maxlength="100" placeholder="VD: VIP Room">
                        <div class="text-danger small" th:if="${#fields.hasErrors('nameEn')}" th:errors="*{nameEn}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Giá cơ bản (VND / đêm)</label>
                        <input type="number" step="1000" th:field="*{basePrice}" class="form-control" th:readonly="${!#authorization.expression('hasRole(''ADMIN'')')}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('basePrice')}" th:errors="*{basePrice}"></div>
                        <div class="text-muted small mt-1" sec:authorize="!hasRole('ADMIN')">Chỉ quản trị viên được thay đổi giá.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Sức chứa tối đa (người)</label>
                        <input type="number" th:field="*{maxGuests}" class="form-control">
                        <div class="text-danger small" th:if="${#fields.hasErrors('maxGuests')}" th:errors="*{maxGuests}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Diện tích (m2)</label>
                        <input type="number" step="0.1" th:field="*{area}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mô tả</label>
                        <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mô tả <span class="badge bg-info text-dark">EN</span> <span class="text-muted small">(không bắt buộc — bỏ trống thì khách chọn tiếng Anh vẫn thấy bản tiếng Việt)</span></label>
                        <textarea th:field="*{descriptionEn}" class="form-control" rows="3" maxlength="1000"></textarea>
                        <div class="text-danger small" th:if="${#fields.hasErrors('descriptionEn')}" th:errors="*{descriptionEn}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tiện nghi (cách nhau bởi dấu phẩy)</label>
                        <input type="text" th:field="*{amenities}" class="form-control" placeholder="Wi-Fi, TV, Điều hòa, Mini Bar">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tiện nghi <span class="badge bg-info text-dark">EN</span> <span class="text-muted small">(không bắt buộc — bỏ trống thì khách chọn tiếng Anh vẫn thấy bản tiếng Việt)</span></label>
                        <input type="text" th:field="*{amenitiesEn}" class="form-control" maxlength="500" placeholder="Wi-Fi, TV, Air conditioning, Mini bar">
                        <div class="text-danger small" th:if="${#fields.hasErrors('amenitiesEn')}" th:errors="*{amenitiesEn}"></div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Lưu</button>
                        <a th:href="@{/admin/room-types}" class="btn btn-outline-secondary">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Đánh giá của khách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .stars .bi { color: #f2b705; }
        .review-comment { white-space: pre-line; margin: 0; }
        tr.is-hidden td { opacity: .55; }
    </style>
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container-fluid px-lg-5 py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="fw-bold m-0">Đánh giá của khách</h3>
                <span class="text-muted small">
                    <span th:text="|${totalElements} đánh giá|"></span>
                    <span th:if="${totalElements > 0}"> · trung bình <b th:text="${averageRating}"></b> <i class="bi bi-star-fill text-warning"></i></span>
                </span>
            </div>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/admin/reviews}" method="get" class="row g-2 bg-white p-3 rounded shadow-sm mb-3">
                <div class="col-md-5">
                    <input type="text" name="q" th:value="${q}" class="form-control form-control-sm"
                           placeholder="Tên / email khách, nội dung, hoặc mã đơn">
                </div>
                <div class="col-md-2">
                    <select name="rating" class="form-select form-select-sm">
                        <option value="">Mọi số sao</option>
                        <option th:each="n : ${#numbers.sequence(5, 1, -1)}" th:value="${n}" th:text="|${n} sao|"
                                th:selected="${rating == n}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select name="hidden" class="form-select form-select-sm">
                        <option value="">Mọi trạng thái</option>
                        <option value="false" th:selected="${hidden != null and !hidden}">Đang hiển thị</option>
                        <option value="true" th:selected="${hidden != null and hidden}">Đã ẩn</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex gap-1">
                    <button type="submit" class="btn btn-sm btn-primary flex-fill">Lọc</button>
                    <a th:href="@{/admin/reviews}" class="btn btn-sm btn-outline-secondary" title="Xóa bộ lọc">✕</a>
                </div>
            </form>

            <div th:if="${#lists.isEmpty(reviews)}" class="alert alert-info">Chưa có đánh giá nào.</div>

            <div class="table-responsive" th:if="${not #lists.isEmpty(reviews)}">
                <table class="table table-striped bg-white align-middle small" style="--bs-table-striped-bg: #eaf6ff;">
                    <thead>
                    <tr>
                        <th style="width: 140px;">Thời gian</th>
                        <th style="width: 190px;">Khách hàng</th>
                        <th style="width: 170px;">Đơn / phòng</th>
                        <th style="width: 110px;">Số sao</th>
                        <th>Nhận xét</th>
                        <th style="width: 120px;">Trạng thái</th>
                        <th style="width: 110px;"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${reviews}" th:classappend="${r.hidden} ? 'is-hidden'">
                        <td class="text-nowrap" th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <div class="fw-semibold" th:text="${r.customer.fullName}"></div>
                            <div class="text-muted" th:text="${r.customer.email}"></div>
                        </td>
                        <td>
                            <a th:href="@{/admin/bookings/{id}(id=${r.booking.id})}" th:text="|Đơn #${r.booking.id}|"></a>
                            <div class="text-muted" th:text="|Phòng ${r.booking.room.roomNumber} - ${r.booking.room.roomType.name}|"></div>
                        </td>
                        <td class="stars text-nowrap">
                            <i th:each="n : ${#numbers.sequence(1, 5)}" th:class="${n <= r.rating} ? 'bi bi-star-fill' : 'bi bi-star'"></i>
                        </td>
                        <td>
                            <p class="review-comment" th:if="${r.comment != null}" th:text="${r.comment}"></p>
                            <span class="text-muted fst-italic" th:if="${r.comment == null}">(Không có nhận xét)</span>
                            <div th:replace="~{fragments/review-media :: gallery(${r.media})}"></div>
                        </td>
                        <td>
                            <span th:if="${r.hidden}" class="badge bg-secondary">Đã ẩn</span>
                            <span th:unless="${r.hidden}" class="badge bg-success">Đang hiển thị</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/reviews/{id}/toggle-hidden(id=${r.id})}" method="post" class="m-0"
                                  th:attr="onsubmit=${r.hidden} ? null : 'return confirm(\'Ẩn đánh giá này khỏi trang khách hàng?\')'">
                                <input type="hidden" name="rating" th:value="${rating}">
                                <input type="hidden" name="hidden" th:value="${hidden}">
                                <input type="hidden" name="q" th:value="${q}">
                                <input type="hidden" name="page" th:value="${currentPage}">
                                <button type="submit" class="btn btn-sm"
                                        th:classappend="${r.hidden} ? 'btn-outline-success' : 'btn-outline-danger'"
                                        th:text="${r.hidden} ? 'Hiện lại' : 'Ẩn'"></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <nav th:if="${totalPages > 1}" aria-label="Phân trang">
                <ul class="pagination justify-content-center mt-3 mb-0">
                    <li class="page-item" th:classappend="${currentPage <= 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/reviews(page=${currentPage - 1}, q=${q}, rating=${rating}, hidden=${hidden})}">&laquo;</a>
                    </li>
                    <li th:each="p : ${pageNumbers}" class="page-item"
                        th:classappend="${p == 0} ? 'disabled' : (${p == currentPage} ? 'active')">
                        <span th:if="${p == 0}" class="page-link">&hellip;</span>
                        <a th:unless="${p == 0}" class="page-link" th:text="${p}"
                           th:href="@{/admin/reviews(page=${p}, q=${q}, rating=${rating}, hidden=${hidden})}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/reviews(page=${currentPage + 1}, q=${q}, rating=${rating}, hidden=${hidden})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

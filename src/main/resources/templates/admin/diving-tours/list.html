<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Tour lặn biển</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold m-0">Tour lặn biển</h3>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/diving-tours/new}" class="btn btn-primary">Thêm tour</a>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div th:if="${#lists.isEmpty(tours)}" class="alert alert-info">
                Chưa có tour nào. Thêm tour (lặn ống thở, lặn bình, kayak...) để khách đặt kèm đơn phòng.
            </div>

            <table class="table table-striped bg-white align-middle" style="--bs-table-striped-bg: #eaf6ff;" th:if="${not #lists.isEmpty(tours)}">
                <thead>
                <tr>
                    <th>Ảnh</th>
                    <th>Tên tour</th>
                    <th>Giá / người</th>
                    <th>Khởi hành</th>
                    <th>Số chỗ</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tour : ${tours}">
                    <td>
                        <img th:if="${tour.imageUrl}" th:src="${tour.imageUrl}" style="width: 70px; height: 50px; object-fit: cover;" class="rounded" alt="Ảnh tour">
                        <span th:unless="${tour.imageUrl}" class="text-muted small">Chưa có ảnh</span>
                    </td>
                    <td>
                        <div class="fw-semibold" th:text="${tour.name}"></div>
                        <div class="small text-muted" th:if="${tour.meetingPoint}" th:text="${tour.meetingPoint}"></div>
                    </td>
                    <td th:text="${#numbers.formatDecimal(tour.pricePerPerson, 1, 'POINT', 0, 'COMMA')} + ' VND'"></td>
                    <td th:text="${#temporals.format(tour.departureTime, 'HH:mm')} + ' · ' + ${tour.durationHours} + ' tiếng'"></td>
                    <td th:text="${tour.maxParticipants} + ' khách/chuyến'"></td>
                    <td>
                        <span class="badge" th:classappend="${tour.active} ? 'bg-success' : 'bg-secondary'"
                              th:text="${tour.active} ? 'Đang bán' : 'Đã ẩn'"></span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/admin/diving-tours/{id}/edit(id=${tour.id})}" class="btn btn-sm btn-outline-secondary">Sửa</a>
                        <form th:action="@{/admin/diving-tours/{id}/toggle-active(id=${tour.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-warning" th:text="${tour.active} ? 'Ẩn' : 'Hiện'"></button>
                        </form>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/admin/diving-tours/{id}/delete(id=${tour.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Xóa tour này?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:replace="~{fragments/pagination :: pagination('/admin/diving-tours', ${currentPage}, ${totalPages}, ${pageNumbers}, null, null)}"></div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dọn phòng</title>
    <meta http-equiv="refresh" content="120">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
    <style>
        .hk-col { background: var(--paper); border: var(--line); border-radius: 10px; box-shadow: var(--pop); padding: 16px; height: 100%; }
        .hk-col h5 { font-weight: 800; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .hk-room { border: 1px solid #dee2e6; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: #fff; }
        .hk-room.priority { border-color: #f08c00; box-shadow: inset 4px 0 0 #f08c00; }
        .hk-room .num { font-weight: 800; font-size: 1.1rem; }
    </style>
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <div class="mb-3">
                <h3 class="fw-bold m-0">Dọn phòng</h3>
                <div class="text-muted small">Khách trả phòng xong, phòng vào "Chờ dọn". Phòng chưa sạch thì chưa nhận phòng cho khách mới được.
                    Trang tự cập nhật mỗi 2 phút.</div>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <div class="row g-3">
                <!-- Cho don: phong co khach den hom nay len dau -->
                <div class="col-lg-4">
                    <div class="hk-col">
                        <h5><i class="bi bi-hourglass-split text-warning"></i>Chờ dọn
                            <span class="badge bg-warning text-dark" th:text="${#lists.size(board.waiting)}"></span></h5>
                        <p th:if="${#lists.isEmpty(board.waiting)}" class="text-muted small mb-0">Không có phòng nào chờ dọn.</p>
                        <div th:each="t : ${board.waiting}" class="hk-room" th:classappend="${t.priority()} ? 'priority'">
                            <div class="d-flex justify-content-between align-items-start gap-2">
                                <div>
                                    <div class="num" th:text="'Phòng ' + ${t.room.roomNumber}"></div>
                                    <div class="small text-muted" th:text="${t.room.roomType.name}"></div>
                                    <div class="small text-muted" th:if="${t.room.dirtySince}"
                                         th:text="'Khách trả lúc ' + ${#temporals.format(t.room.dirtySince, 'HH:mm dd/MM')}"></div>
                                    <div class="small fw-semibold text-warning-emphasis" th:if="${t.priority()}">
                                        <i class="bi bi-exclamation-triangle-fill"></i>
                                        <span th:text="|Ưu tiên: khách ${t.arrival.guestName} đến hôm nay|"></span>
                                    </div>
                                </div>
                                <form method="post" th:action="@{/admin/housekeeping/{id}/start(id=${t.room.id})}">
                                    <button type="submit" class="btn btn-sm btn-primary text-nowrap"><i class="bi bi-person-check me-1"></i>Nhận dọn</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Dang don -->
                <div class="col-lg-4">
                    <div class="hk-col">
                        <h5><i class="bi bi-stars text-info"></i>Đang dọn
                            <span class="badge bg-info" th:text="${#lists.size(board.inProgress)}"></span></h5>
                        <p th:if="${#lists.isEmpty(board.inProgress)}" class="text-muted small mb-0">Chưa có phòng nào đang dọn.</p>
                        <div th:each="t : ${board.inProgress}" class="hk-room" th:classappend="${t.priority()} ? 'priority'">
                            <div class="num" th:text="'Phòng ' + ${t.room.roomNumber}"></div>
                            <div class="small" th:text="|${t.room.cleaningBy} · từ ${#temporals.format(t.room.cleaningStartedAt, 'HH:mm')}|"></div>
                            <div class="small fw-semibold text-warning-emphasis" th:if="${t.priority()}"
                                 th:text="|Ưu tiên: khách ${t.arrival.guestName} đến hôm nay|"></div>
                            <div class="d-flex gap-2 mt-2">
                                <form method="post" th:action="@{/admin/housekeeping/{id}/finish(id=${t.room.id})}">
                                    <button type="submit" class="btn btn-sm btn-success"><i class="bi bi-check2-circle me-1"></i>Đã dọn xong</button>
                                </form>
                                <form method="post" th:action="@{/admin/housekeeping/{id}/release(id=${t.room.id})}">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary">Trả lại</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sach hom nay -->
                <div class="col-lg-4">
                    <div class="hk-col">
                        <h5><i class="bi bi-check-circle text-success"></i>Đã sạch hôm nay
                            <span class="badge bg-success" th:text="${#lists.size(board.cleanedToday)}"></span></h5>
                        <p th:if="${#lists.isEmpty(board.cleanedToday)}" class="text-muted small mb-0">Chưa có phòng nào dọn xong hôm nay.</p>
                        <ul class="list-unstyled small mb-0" th:unless="${#lists.isEmpty(board.cleanedToday)}">
                            <li th:each="r : ${board.cleanedToday}" class="d-flex justify-content-between py-1 border-bottom">
                                <b th:text="'Phòng ' + ${r.roomNumber}"></b>
                                <span class="text-muted">
                                    <span th:if="${r.lastCleanedBy}" th:text="${r.lastCleanedBy} + ' · '"></span><span th:text="${#temporals.format(r.lastCleanedAt, 'HH:mm')}"></span>
                                </span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

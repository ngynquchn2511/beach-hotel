<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thống kê buồng phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <a th:href="@{/admin/housekeeping}" class="small"><i class="bi bi-arrow-left"></i> Dọn phòng</a>
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
                <div>
                    <h3 class="fw-bold mb-1">Thống kê buồng phòng</h3>
                    <p class="text-muted small mb-0">Thời gian dọn tính từ lúc nhận dọn đến lúc báo xong. Tỷ lệ chưa đạt chỉ tính các lượt qua bước kiểm phòng.</p>
                </div>
                <form method="get" class="d-flex gap-2">
                    <input type="date" name="from" class="form-control form-control-sm" th:value="${from}">
                    <input type="date" name="to" class="form-control form-control-sm" th:value="${to}">
                    <button class="btn btn-sm btn-outline-primary">Xem</button>
                </form>
            </div>

            <div th:if="${#lists.isEmpty(stats.cleaners)}" class="alert alert-info">Chưa có lượt dọn nào trong khoảng này.</div>
            <div class="bg-white p-3 rounded shadow-sm mb-4" th:unless="${#lists.isEmpty(stats.cleaners)}">
                <div class="small text-muted mb-2" th:text="'Tổng ' + ${stats.totalCleaned} + ' phòng dọn xong'"></div>
                <table class="table table-sm align-middle mb-0 text-end">
                    <thead><tr><th class="text-start">Nhân viên</th><th>Phòng dọn xong</th><th>TB (phút)</th><th>Lượt kiểm</th><th>Chưa đạt</th><th>Tỷ lệ chưa đạt</th></tr></thead>
                    <tbody>
                    <tr th:each="c : ${stats.cleaners}">
                        <td class="text-start fw-semibold" th:text="${c.name}"></td>
                        <td th:text="${c.cleaned}"></td>
                        <td th:text="${c.avgMinutes != null} ? ${c.avgMinutes} : '-'"></td>
                        <td th:text="${c.inspected}"></td>
                        <td th:text="${c.failed}"></td>
                        <td th:classappend="${c.failRate >= 20} ? 'text-danger fw-semibold'" th:text="${c.inspected > 0} ? ${c.failRate} + '%' : '-'"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <h6 class="fw-bold">Lần kiểm chưa đạt gần đây</h6>
            <div th:if="${#lists.isEmpty(stats.recentFailures)}" class="text-muted small">Không có.</div>
            <div class="bg-white p-3 rounded shadow-sm" th:unless="${#lists.isEmpty(stats.recentFailures)}">
                <div th:each="l : ${stats.recentFailures}" class="small border-bottom py-1">
                    <b th:text="'Phòng ' + ${l.room.roomNumber}"></b>
                    <span class="text-muted" th:text="' · ' + ${#temporals.format(l.finishedAt, 'dd/MM HH:mm')} + ' · ' + ${l.cleanerName} + (${l.inspectedBy != null} ? ' · kiểm: ' + ${l.inspectedBy} : '')"></span>
                    <div class="fst-italic" th:text="${l.note}"></div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

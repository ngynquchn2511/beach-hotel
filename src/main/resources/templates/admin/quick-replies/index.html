<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mẫu trả lời nhanh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut eaut-admin">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row g-4">
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-9">
            <h3 class="fw-bold mb-1">Mẫu trả lời nhanh</h3>
            <p class="text-muted small">Lễ tân chọn mẫu trong khung «Tin nhắn với khách» ở trang chi tiết đơn; nội dung được điền sẵn theo đơn rồi mới gửi,
                lễ tân vẫn sửa được trước khi bấm Gửi. Biến dùng được:
                <code th:each="v, st : ${variables}" th:text="${v} + (${st.last} ? '' : ' ')"></code>.</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <div class="bg-white p-4 rounded shadow-sm mb-4">
                <h5 class="fw-bold mb-3">Thêm mẫu</h5>
                <form th:action="@{/admin/quick-replies}" method="post" class="row g-2">
                    <div class="col-md-8"><label class="form-label small">Tên mẫu</label>
                        <input type="text" name="title" class="form-control form-control-sm" maxlength="80" required></div>
                    <div class="col-md-2"><label class="form-label small">Thứ tự</label>
                        <input type="number" name="sortOrder" class="form-control form-control-sm" min="0" max="999"></div>
                    <div class="col-12"><label class="form-label small">Nội dung</label>
                        <textarea name="body" class="form-control form-control-sm" rows="3" th:maxlength="${bodyMax}" required
                                  placeholder="VD: Dạ chào anh/chị {ten_khach}, phòng {so_phong} đã sẵn sàng ạ."></textarea></div>
                    <div class="col-12"><button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-plus-lg me-1"></i>Thêm mẫu</button></div>
                </form>
            </div>

            <div class="bg-white p-4 rounded shadow-sm">
                <h5 class="fw-bold mb-3">Danh sách mẫu</h5>
                <div th:if="${#lists.isEmpty(replies)}" class="alert alert-info mb-0">Chưa có mẫu nào.</div>
                <div th:each="q : ${replies}" class="border rounded p-3 mb-2" th:classappend="${!q.open} ? 'bg-light text-muted'">
                    <form th:action="@{/admin/quick-replies/{id}(id=${q.id})}" method="post" class="row g-2">
                        <div class="col-md-8"><input type="text" name="title" class="form-control form-control-sm" maxlength="80" required th:value="${q.title}"></div>
                        <div class="col-md-2"><input type="number" name="sortOrder" class="form-control form-control-sm" min="0" max="999" th:value="${q.sortOrder}"></div>
                        <div class="col-md-2"><button type="submit" class="btn btn-sm btn-outline-primary w-100" title="Lưu"><i class="bi bi-check-lg"></i> Lưu</button></div>
                        <div class="col-12"><textarea name="body" class="form-control form-control-sm" rows="2" th:maxlength="${bodyMax}" required th:text="${q.body}"></textarea></div>
                    </form>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <span class="badge" th:classappend="${q.open} ? 'bg-success' : 'bg-secondary'" th:text="${q.open} ? 'Đang dùng' : 'Tạm ngừng'"></span>
                        <span class="d-flex gap-2">
                            <form method="post" th:action="@{/admin/quick-replies/{id}/toggle(id=${q.id})}">
                                <button type="submit" class="btn btn-sm btn-outline-secondary" th:text="${q.open} ? 'Tạm ngừng' : 'Dùng lại'"></button>
                            </form>
                            <form method="post" th:action="@{/admin/quick-replies/{id}/delete(id=${q.id})}" onsubmit="return confirm('Xóa mẫu này?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                            </form>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

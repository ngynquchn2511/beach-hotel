<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title th:text="#{compare.title}">So sánh phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
    <style>
        .compare-table { table-layout: fixed; min-width: 640px; }
        .compare-table th[scope=row] { width: 150px; color: #6c757d; font-weight: 600; background: #f8f9fa; }
        .compare-table img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .compare-table td.best { background: #ebfbee; }
    </style>
</head>
<body class="eaut" th:style="'--page-bg: url(' + @{/page-images/danhsachphong.jpg} + ')'">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1">
    <div class="eaut-head">
        <div class="eyebrow">Sóng Xanh Resort</div>
        <h1 th:text="#{compare.title}">So sánh phòng</h1>
        <div class="divider"></div>
        <p th:text="#{compare.lead}">Đặt các phòng cạnh nhau để chọn phòng hợp nhất.</p>
    </div>

    <div th:if="${#lists.size(rooms) < 2}" class="alert alert-info">
        <span th:text="#{compare.needTwo}">Hãy chọn ít nhất 2 phòng để so sánh.</span>
        <a th:href="@{/rooms}" th:text="#{favorite.browse}">Xem danh sách phòng</a>
    </div>

    <div class="bg-white p-3 rounded shadow-sm table-responsive" th:if="${#lists.size(rooms) >= 2}">
        <table class="table align-middle compare-table mb-0">
            <tbody>
            <tr>
                <th scope="row"></th>
                <td th:each="r : ${rooms}">
                    <img th:if="${r.coverImageUrl}" th:src="${r.coverImageUrl}" th:alt="#{common.roomPhoto}">
                    <div class="fw-bold fs-5 mt-2" th:text="#{common.room(${r.roomNumber})}"></div>
                </td>
            </tr>
            <tr>
                <th scope="row" th:text="#{common.roomType}">Loại phòng</th>
                <td th:each="r : ${rooms}" th:text="${r.roomType.localizedName}"></td>
            </tr>
            <tr>
                <th scope="row" th:text="#{compare.view}">View / vị trí</th>
                <td th:each="r : ${rooms}" class="small" th:text="${r.localizedDescription != null ? r.localizedDescription : r.roomType.localizedDescription}"></td>
            </tr>
            <tr>
                <th scope="row" th:text="#{compare.price}">Giá / đêm</th>
                <td th:each="r : ${rooms}" class="fw-bold text-primary" th:classappend="${r.price == minPrice} ? 'best'"
                    th:text="${#numbers.formatDecimal(r.price, 1, 'POINT', 0, 'COMMA')} + ' VND'"></td>
            </tr>
            <tr>
                <th scope="row" th:text="#{compare.area}">Diện tích</th>
                <td th:each="r : ${rooms}" th:classappend="${r.roomType.area != null and r.roomType.area == maxArea} ? 'best'"
                    th:text="${r.roomType.area != null} ? ${#numbers.formatDecimal(r.roomType.area, 1, 0)} + ' m²' : '-'"></td>
            </tr>
            <tr>
                <th scope="row" th:text="#{compare.guests}">Số khách tối đa</th>
                <td th:each="r : ${rooms}" th:classappend="${r.roomType.maxGuests == maxGuests} ? 'best'"
                    th:text="${r.roomType.maxGuests}"></td>
            </tr>
            <tr>
                <th scope="row" th:text="#{compare.amenities}">Tiện nghi</th>
                <td th:each="r : ${rooms}" class="small" th:text="${r.roomType.localizedAmenities != null ? r.roomType.localizedAmenities : '-'}"></td>
            </tr>
            <tr>
                <th scope="row" th:text="#{compare.status}">Tình trạng</th>
                <td th:each="r : ${rooms}"><span class="badge bg-secondary" th:text="#{'enum.RoomStatus.' + ${r.status}}"></span></td>
            </tr>
            <tr>
                <th scope="row"></th>
                <td th:each="r : ${rooms}">
                    <a th:href="@{/customer/rooms/{id}(id=${r.id})}" class="btn btn-primary btn-sm w-100" th:text="#{rooms.detailAndBook}">Xem chi tiết &amp; đặt phòng</a>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="small text-muted mt-2 mb-0"><span class="d-inline-block rounded me-1" style="width:12px;height:12px;background:#ebfbee;border:1px solid #b2f2bb"></span><span th:text="#{compare.bestHint}">Ô xanh: tốt nhất trong các phòng đang so sánh</span></p>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

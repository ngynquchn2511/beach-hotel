<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{gv.title}">Thẻ quà tặng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut" th:style="'--page-bg: url(' + @{/page-images/beach-hoang-hon.jpg} + ')'">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1" style="max-width: 720px;">
    <div class="eaut-head">
        <div class="eyebrow">Sóng Xanh Resort</div>
        <h1 th:text="#{gv.title}">Thẻ quà tặng</h1>
        <div class="divider"></div>
        <p th:text="#{gv.lead}">Tặng người thân một kỳ nghỉ bên vịnh Hạ Long.</p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/gift-vouchers}" method="post" class="bg-white p-4 rounded shadow-sm">
        <label class="form-label fw-semibold" th:text="#{gv.amount}">Mệnh giá</label>
        <div class="d-flex flex-wrap gap-2 mb-2">
            <th:block th:each="p, st : ${presets}">
                <input type="radio" class="btn-check" name="preset" th:id="'p' + ${st.index}" th:value="${p}" th:checked="${st.index == 1}">
                <label class="btn btn-outline-primary" th:for="'p' + ${st.index}" th:text="${#numbers.formatInteger(p, 1, 'POINT')} + 'đ'"></label>
            </th:block>
        </div>
        <input type="number" name="amount" id="amount" class="form-control mb-3" required step="10000"
               th:min="${minAmount}" th:max="${maxAmount}" value="1000000">
        <div class="row g-3">
            <div class="col-md-6"><label class="form-label" th:text="#{gv.purchaserName}">Tên bạn</label>
                <input type="text" name="purchaserName" class="form-control" maxlength="100" required></div>
            <div class="col-md-6"><label class="form-label" th:text="#{gv.purchaserEmail}">Email của bạn</label>
                <input type="email" name="purchaserEmail" class="form-control" maxlength="100" required></div>
            <div class="col-md-6"><label class="form-label" th:text="#{gv.recipientName}">Tên người nhận</label>
                <input type="text" name="recipientName" class="form-control" maxlength="100" required></div>
            <div class="col-md-6"><label class="form-label" th:text="#{gv.recipientEmail}">Email người nhận</label>
                <input type="email" name="recipientEmail" class="form-control" maxlength="100" required></div>
            <div class="col-12"><label class="form-label" th:text="#{gv.message}">Lời nhắn</label>
                <textarea name="message" class="form-control" rows="2" maxlength="300"></textarea></div>
        </div>
        <p class="small text-muted mt-2 mb-3" th:text="#{gv.terms}"></p>
        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-gift me-1"></i><span th:text="#{gv.continue}">Tiếp tục thanh toán</span></button>
    </form>
</main>

<script>
    document.querySelectorAll('input[name=preset]').forEach(function (r) {
        r.addEventListener('change', function () { document.getElementById('amount').value = r.value; });
    });
</script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title th:text="#{gv.title}">Thẻ quà tặng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut" th:style="'--page-bg: url(' + @{/page-images/beach-hoang-hon.jpg} + ')'">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1" style="max-width: 720px;">
    <div class="eaut-head">
        <div class="eyebrow">Sóng Xanh Resort</div>
        <h1 th:text="#{gv.title}">Thẻ quà tặng</h1>
        <div class="divider"></div>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="bg-white p-4 rounded shadow-sm">
        <p class="mb-1" th:text="#{gv.summary(${#numbers.formatDecimal(voucher.amount, 1, 'POINT', 0, 'COMMA')}, ${voucher.recipientName}, ${voucher.recipientEmail})}"></p>
        <p class="mb-3"><span class="badge" th:classappend="${voucher.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-warning text-dark'"
                              th:text="#{'gv.status.' + ${voucher.status}}"></span></p>

        <th:block th:if="${voucher.status.name() == 'PENDING_PAYMENT'}">
            <form th:if="${vnpayEnabled}" method="post" class="mb-3" th:action="@{/gift-vouchers/{id}/vnpay(id=${voucher.id})}">
                <input type="hidden" name="token" th:value="${token}">
                <button type="submit" class="btn btn-primary"><i class="bi bi-credit-card me-1"></i><span th:text="#{gv.payVnpay}">Thanh toán qua VNPay</span></button>
            </form>
            <p class="small text-muted mb-2" th:text="#{gv.orTransfer}"></p>
            <div class="row g-3 align-items-center">
                <div class="col-sm-5 text-center"><img th:src="${qrUrl}" th:alt="#{success.qrAlt}" class="img-fluid rounded border" style="max-width: 220px;"></div>
                <div class="col-sm-7 small">
                    <p class="mb-1"><span th:text="#{success.bank}">Ngân hàng:</span> <b th:text="${bankId}"></b></p>
                    <p class="mb-1"><span th:text="#{success.accountNo}">Số tài khoản:</span> <b th:text="${accountNo}"></b></p>
                    <p class="mb-1"><span th:text="#{success.accountName}">Chủ tài khoản:</span> <b th:text="${accountName}"></b></p>
                    <p class="mb-1"><span th:text="#{success.content}">Nội dung:</span> <b th:text="'QT' + ${voucher.id}"></b></p>
                </div>
            </div>
        </th:block>
        <p th:if="${voucher.status.name() == 'ACTIVE'}" class="mb-0" th:text="#{gv.sent}"></p>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

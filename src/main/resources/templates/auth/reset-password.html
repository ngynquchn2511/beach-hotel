<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{auth.reset.title}">Đặt lại mật khẩu | Sóng Xanh Resort</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: linear-gradient(115deg, rgba(10,31,53,.91), rgba(137,207,240,.55)), url('/page-images/dangnhap.jpg') center/cover fixed; }
        .auth-shell { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; }
        .auth-card { width: min(100%, 450px); border: 0; border-radius: 24px; box-shadow: 0 24px 70px rgba(0,0,0,.28); overflow: hidden; }
        .brand-mark { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 18px; background: linear-gradient(135deg, #3d9bd6, #89cff0); color: #fff; font-size: 26px; margin: 0 auto 1rem; }
        .brand-mark.danger { background: linear-gradient(135deg, #dc3545, #ea868f); }
        .form-control { border-radius: 12px; padding: .78rem .9rem; border-color: #d9e2ef; }
        .form-control:focus { border-color: #3d9bd6; box-shadow: 0 0 0 .22rem rgba(137,207,240,.35); }
        .btn-auth { border-radius: 12px; padding: .8rem; font-weight: 700; }
    </style>
</head>
<body class="eaut eaut-auth" th:style="'--page-bg: url(' + @{/page-images/dangnhap.jpg} + ')'">
<div class="position-fixed top-0 end-0 p-3" style="z-index: 10;"><div th:replace="~{fragments/lang-switch :: switch}"></div></div>
<main class="auth-shell">
    <section class="card auth-card">
        <div class="card-body p-4 p-md-5">

            <!-- Token sai hoac het han -->
            <div th:unless="${tokenValid}" class="text-center">
                <div class="brand-mark danger"><i class="bi bi-link-45deg"></i></div>
                <h1 class="h4 fw-bold mb-2" th:text="#{auth.reset.invalidTitle}">Liên kết không hợp lệ</h1>
                <p class="text-secondary mb-4" th:text="#{auth.reset.invalidText}">Liên kết đặt lại mật khẩu không đúng, đã được sử dụng hoặc đã hết hạn. Vui lòng yêu cầu liên kết mới.</p>
                <a th:href="@{/forgot-password}" class="btn btn-primary btn-auth w-100 mb-2" th:text="#{auth.reset.resendLink}">Gửi lại liên kết</a>
                <a th:href="@{/login}" class="btn btn-link text-decoration-none small" th:text="#{auth.backToLogin}">Quay lại đăng nhập</a>
            </div>

            <div th:if="${tokenValid}">
                <div class="text-center mb-4">
                    <div class="brand-mark"><i class="bi bi-shield-lock"></i></div>
                    <div class="text-uppercase text-primary fw-bold small" style="letter-spacing:.14em">Sóng Xanh Resort</div>
                    <h1 class="h3 fw-bold mt-2 mb-1" th:text="#{auth.reset.heading}">Đặt lại mật khẩu</h1>
                    <p class="text-secondary mb-0" th:text="#{auth.reset.lead}">Tạo mật khẩu mới cho tài khoản của bạn.</p>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger border-0 rounded-3 small" th:text="${errorMessage}"></div>
                <form th:action="@{/reset-password}" th:object="${resetPasswordRequest}" method="post">
                    <input type="hidden" th:field="*{token}">
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold small" th:text="#{account.newPassword}">Mật khẩu mới</label>
                        <input id="password" type="password" th:field="*{password}" class="form-control" th:placeholder="#{account.passwordHint}" autocomplete="new-password" autofocus>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label fw-semibold small" th:text="#{account.confirmPassword}">Xác nhận mật khẩu mới</label>
                        <input id="confirmPassword" type="password" th:field="*{confirmPassword}" class="form-control" th:placeholder="#{auth.reset.confirmPlaceholder}" autocomplete="new-password">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-auth w-100" th:text="#{auth.reset.submit}">Cập nhật mật khẩu</button>
                </form>
            </div>

        </div>
    </section>
</main>
</body>
</html>

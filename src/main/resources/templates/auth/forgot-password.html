<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{auth.forgot.title}">Quên mật khẩu | Sóng Xanh Resort</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: linear-gradient(115deg, rgba(10,31,53,.91), rgba(13,110,253,.50)), url('/page-images/dangnhap.jpg') center/cover fixed; }
        .auth-shell { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; }
        .auth-card { width: min(100%, 450px); border: 0; border-radius: 24px; box-shadow: 0 24px 70px rgba(0,0,0,.28); overflow: hidden; }
        .brand-mark { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 18px; background: linear-gradient(135deg, #0d6efd, #6ea8fe); color: #fff; font-size: 26px; margin: 0 auto 1rem; }
        .brand-mark.success { background: linear-gradient(135deg, #198754, #75b798); }
        .form-control { border-radius: 12px; padding: .78rem .9rem; border-color: #d9e2ef; }
        .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 .22rem rgba(13,110,253,.12); }
        .btn-auth { border-radius: 12px; padding: .8rem; font-weight: 700; }
    </style>
</head>
<body class="eaut eaut-auth" th:style="'--page-bg: url(' + @{/page-images/dangnhap.jpg} + ')'">
<div class="position-fixed top-0 end-0 p-3" style="z-index: 10;"><div th:replace="~{fragments/lang-switch :: switch}"></div></div>
<main class="auth-shell">
    <section class="card auth-card">
        <div class="card-body p-4 p-md-5">

            <!-- Da gui email -->
            <div th:if="${sent}" class="text-center">
                <div class="brand-mark success"><i class="bi bi-envelope-check"></i></div>
                <h1 class="h4 fw-bold mb-2" th:text="#{auth.forgot.sentTitle}">Kiểm tra email của bạn</h1>
                <p class="text-secondary mb-4" th:utext="#{auth.forgot.sentText(${#strings.escapeXml(email)})}"></p>
                <p class="small text-secondary mb-4" th:text="#{auth.forgot.spam}">Không thấy email? Hãy kiểm tra thư mục Spam hoặc gửi lại.</p>
                <form th:action="@{/forgot-password}" method="post" class="mb-3">
                    <input type="hidden" name="email" th:value="${email}">
                    <button type="submit" class="btn btn-outline-primary btn-auth w-100" th:text="#{auth.forgot.resend}">Gửi lại email</button>
                </form>
                <a th:href="@{/login}" class="btn btn-primary btn-auth w-100" th:text="#{auth.backToLogin}">Quay lại đăng nhập</a>
            </div>

            <!-- Form nhap email -->
            <div th:unless="${sent}">
                <div class="text-center mb-4">
                    <div class="brand-mark"><i class="bi bi-key"></i></div>
                    <div class="text-uppercase text-primary fw-bold small" style="letter-spacing:.14em">Sóng Xanh Resort</div>
                    <h1 class="h3 fw-bold mt-2 mb-1" th:text="#{auth.forgot.heading}">Quên mật khẩu?</h1>
                    <p class="text-secondary mb-0" th:text="#{auth.forgot.lead}">Nhập email đã đăng ký, chúng tôi sẽ gửi liên kết để bạn tạo mật khẩu mới.</p>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger border-0 rounded-3 small" th:text="${errorMessage}"></div>
                <form th:action="@{/forgot-password}" method="post">
                    <div class="mb-4">
                        <label for="email" class="form-label fw-semibold small">Email</label>
                        <input id="email" type="email" name="email" th:value="${email}" class="form-control" placeholder="name@example.com" autocomplete="email" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary btn-auth w-100" th:text="#{auth.forgot.submit}">Gửi liên kết đặt lại</button>
                </form>
                <div class="text-center mt-4 pt-3 border-top">
                    <a th:href="@{/login}" class="small fw-semibold text-decoration-none"><i class="bi bi-arrow-left me-1"></i><span th:text="#{auth.backToLogin}">Quay lại đăng nhập</span></a>
                </div>
            </div>

        </div>
    </section>
</main>
</body>
</html>

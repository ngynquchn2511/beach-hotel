about.story.eyebrow=About us
about.story.title=Not just a place to stay — an <span class="gradient-text">experience</span>
about.story.p1=Sóng Xanh Resort sits on the Bai Chay seafront in Ha Long, Quang Ninh — looking straight out over Ha Long Bay, a UNESCO World Heritage Site with nearly 2,000 limestone islands. It is perfect for a beach holiday with family, friends or your partner. Every room is bright and breezy while still fully equipped.
about.story.p2=With our online booking system you can find a free room, add a food combo, apply a discount code and get an email confirmation in just a few minutes.
about.story.check1=Spotless rooms, cleaned and inspected before every stay
about.story.check2=Transparent prices, with special offers for returning and VIP guests
about.story.check3=A front desk team for quick check-in and check-out
about.fac.eyebrow=Amenities
about.fac.title=Slow down and <span class="gradient-text">live by the sea</span>
about.fac1.t=Infinity pool
about.fac1.d=A rooftop pool looking straight over Ha Long Bay — watch the sun set behind the islands while you swim.
about.fac2.t=Sea-view balconies
about.fac2.d=Rooms with balconies facing the bay — open the door at dawn to sunrise among the limestone islands.
about.fac3.t=Private beach
about.fac3.d=Free sun loungers, umbrellas and towels for resort guests on our stretch of beach.
about.fac4.t=Seafood BBQ
about.fac4.d=Grill fresh seafood by the beach in the evening, or order a hotpot or seafood combo.
about.fac5.t=Diving tours
about.fac5.d=Book snorkelling, instructor-led scuba dives and kayaking right from your booking page.
about.fac6.t=Airport transfers
about.fac6.d=Transfers from Van Don, Noi Bai and Cat Bi airports — book online with clear prices per vehicle.
about.explore.eyebrow=Around Sóng Xanh Resort
about.explore.title=Discover <span class="gradient-text">Ha Long Bay</span>
about.explore.lead=A natural wonder of the world on our doorstep — every famous sight is easy to reach from the resort.
about.spot1.tag=Beach
about.spot1.t=Bai Chay
about.spot1.d=Ha Long's liveliest beach and town, right in front of Sóng Xanh Resort.
about.spot2.tag=Cave
about.spot2.t=Sung Sot Cave
about.spot2.d=One of the largest and most beautiful caves in the bay, full of extraordinary stalactites.
about.spot3.tag=Diving
about.spot3.t=Coral snorkelling
about.spot3.d=Snorkel or scuba dive with an instructor and discover the bay's coral and marine life.
about.spot4.tag=Landmark
about.spot4.t=Fighting Cocks Islet
about.spot4.d=Two rocks facing each other in the middle of the bay — the icon of Ha Long tourism.
about.spot5.tag=Island
about.spot5.t=Ti Top Island
about.spot5.d=Climb to the summit for a panoramic view of the bay, then swim at the crescent-shaped beach.
about.spot6.tag=Food
about.spot6.t=Ha Long Market & seafood
about.spot6.d=Hand-pounded squid cakes, peanut worms, clams and fresh seafood — Ha Long specialities to try.

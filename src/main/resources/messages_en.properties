chat.payment=You can pay by **cash** or **bank transfer** (scan the QR code, amount pre-filled) at check-out 💳 If you paid a deposit, Sóng deducts it and you only pay the rest.
chat.directions=Ha Long is about **150 km** from Hanoi — roughly **2 – 2.5 hours** on the expressway 🚗 If you fly into **Van Don** airport, the resort is only about **50 km** away (~50 minutes). We run **airport transfers** from Van Don, Noi Bai and Cat Bi — book one right on your booking page. Tap the button below and Google Maps will guide you straight to Sóng Xanh!

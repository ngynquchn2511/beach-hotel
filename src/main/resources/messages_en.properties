chat.directions=The resort is about **35 km** from **Cam Ranh airport** — roughly **40 minutes** by taxi or shuttle ✈️ From Ho Chi Minh City it is about **430 km** by road (7–8 hours), or take the train to Nha Trang station. We offer airport transfers — just let us know when you book. Tap the button below and Google Maps will guide you straight to Sóng Xanh!
chat.address=Sóng Xanh is at **{0}** 📍 — right next to Nha Trang''s main beach!
chat.contact.intro=You can reach Sóng Xanh here:
chat.contact.hotline=• Hotline: **{0}**
chat.contact.zalo=• Zalo: **{0}**
chat.contact.email=• Email: {0}
chat.contact.outro=Zalo is the fastest way to reach Sóng 💬
chat.checkTime.times=⏰ Check-in: **{0}** · Check-out: **{1}**
chat.checkTime.note=Want to arrive earlier or leave later? Pick a different time when you book. If there's a guest before or after you that day, Sóng will tell you which times work.
chat.weather=Sóng can't check today's forecast 🙈 But Nha Trang is sunny almost all year, at its best from **February to August** — calm sea, clear water ☀️ The rainy season is roughly **September – December** and may bring storms, so check the forecast before an island tour. Don't forget sunscreen and swimwear! 🩱
chat.explore.intro=There are lots of lovely places around Sóng Xanh 🗺️
chat.explore.1=• **Tran Phu beach** — right in front of the resort
chat.explore.2=• **Po Nagar Cham Towers** — a thousand years old
chat.explore.3=• **Hon Mun** — snorkel among colourful coral
chat.explore.4=• **4-island tour** by speedboat: Hon Tam, Hon Mot, Bai Tranh
chat.explore.5=• **Hon Chong** — sunrise over the rocks
chat.explore.outro=Island tour tickets and motorbike rental are available at reception 🛵
chat.food=In Nha Trang, be sure to try **fish-cake noodle soup**, **Ninh Hoa grilled pork rolls**, **banh can** and fresh seafood at **Dam Market** 😋 In the evening, order a seafood BBQ or hotpot combo at Sóng Xanh and listen to the waves!
chat.book.intro=Booking at Sóng Xanh is easy 📝
chat.book.1=• Go to **Rooms** and pick the one you like
chat.book.2=• Choose your check-in and check-out dates on the calendar
chat.book.3=• Enter your name, phone number and email, then confirm
chat.book.4=• If a deposit is needed, scan the QR code to pay it and hold the room
chat.book.outro=That's it — a confirmation email is on its way!
chat.cancel=Log in → **Booking history** → open the booking → tap **Cancel booking** (before check-in). If you've paid a deposit, Sóng Xanh will contact you about the refund. In a hurry? Zalo is the fastest way 💬
chat.thanks=You're welcome 🥰 Have a wonderful beach trip. Just ask Sóng if you need anything!
chat.bye=Goodbye 👋 See you on the beach in Nha Trang 🌊
chat.unknown.intro=Hmm, Sóng didn't quite get that 🥺 Try asking something like:
chat.unknown.1=• "How much is a sea-view room?"
chat.unknown.2=• "Any rooms free this weekend?"
chat.unknown.3=• "How do I get here from Cam Ranh airport?"
chat.unknown.outro=Or message us on Zalo and a real person at Sóng Xanh will reply 💬

chat.deposit.none=Sóng Xanh **doesn't require a deposit** right now 🥳 Just book online and pay at check-out.
chat.deposit.rule=To hold the room, pay a **{0}%** deposit within **{1} hours** of booking 🔒
chat.deposit.how=After booking you'll get a bank-transfer QR code with the amount filled in, and Sóng confirms as soon as the deposit arrives. The rest is paid at check-out.
chat.cancelPolicy=Deposit refund policy: cancel at least **{0} hours** before check-in for a **100%** refund, at least **{1} hours** before for **{2}%**, later than that it''s non-refundable. The booking page shows your refund amount before you confirm 💸
chat.fac.intro=Here's what Sóng Xanh has for you ✨
chat.fac.1=• 🏊 Infinity pool overlooking the bay
chat.fac.2=• 🌅 Bay-view balconies
chat.fac.3=• 🏖️ Private beach with loungers and umbrellas
chat.fac.4=• 🦐 Seafood BBQ by the beach
chat.fac.5=• 🤿 Diving tours and kayaking
chat.fac.6=• 📶 Wi-Fi, 🅿️ free parking and ✈️ airport transfers

about.spot2.d=A thousand-year-old Cham temple complex by the Cai River mouth, rich in culture.
about.spot3.tag=Diving
about.spot3.t=Hon Mun
about.spot3.d=A marine reserve with colourful coral reefs — the best snorkelling spot in Nha Trang.
about.spot4.tag=Nature
about.spot4.t=Hon Chong
about.spot4.d=Stacked granite boulders reaching into the sea — a beautiful spot for sunrise and crashing waves.
about.spot5.tag=Islands
about.spot5.t=Nha Trang Bay 4-island tour
about.spot5.d=Speedboat to Hon Tam, Hon Mot and Bai Tranh — swim, kayak and enjoy a seafood lunch on the island.

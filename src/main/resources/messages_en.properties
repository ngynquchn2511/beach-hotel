chat.checkTime.note=Want to arrive earlier or leave later? Pick a different time when you book. If there's a guest before or after you that day, Sóng will tell you which times work.
chat.weather=Sóng can't check today's forecast 🙈 Ha Long is at its best in **March – May** and **September – November**: mild weather and a calm sea ☀️ Summer (June – August) is hot — great for swimming and diving, but storms are possible, so check the forecast before a tour. Winter (December – February) is chilly with drizzle, so bring a jacket! 🧥
chat.explore.intro=There are lots of lovely places around Sóng Xanh 🗺️
chat.explore.1=• **Ha Long Bay cruise** — sail among nearly 2,000 limestone islands
chat.explore.2=• **Sung Sot Cave** — one of the most beautiful caves in the bay
chat.explore.3=• **Ti Top Island** — panoramic summit view and a beach
chat.explore.4=• **Fighting Cocks Islet** — the icon of Ha Long
chat.explore.5=• **Coral snorkelling & kayaking** — book a diving tour at the resort
chat.explore.outro=Book a diving tour on your booking page, or ask reception for cruise tickets 🚤
chat.food=In Ha Long, be sure to try **hand-pounded squid cakes**, **peanut worms**, **clams**, **rice rolls with squid cake** and fresh seafood at **Ha Long Market** 😋 In the evening, order a seafood BBQ or hotpot combo at Sóng Xanh and enjoy the view of the bay!
chat.book.intro=Booking at Sóng Xanh is easy 📝
chat.book.1=• Go to **Rooms** and pick the one you like
chat.book.2=• Choose your check-in and check-out dates on the calendar
chat.book.3=• Enter your name, phone number and email, then confirm
chat.book.4=• If a deposit is needed, scan the QR code to pay it and hold the room
chat.book.outro=That's it — a confirmation email is on its way!
chat.cancel=Log in → **Booking history** → open the booking → tap **Cancel booking** (before check-in). To move your stay, use **Change stay dates** on the booking page — it shows availability and the new price right away (up to 6 hours before check-in). In a hurry? Zalo is the fastest way 💬
chat.thanks=You're welcome 🥰 Have a wonderful beach trip. Just ask Sóng if you need anything!

# =====================================================================
# Cau hinh khi chay that (go-live). Bat bang:
#   java -jar beach-hotel.jar --spring.profiles.active=prod
# File nay ghi de len application.properties. Cac gia tri bi mat lay tu bien moi truong,
# KHONG ghi mat khau vao file nay. Bien nao khong co gia tri mac dinh ma thieu -> ung dung khong khoi dong.
#
# Bien moi truong can dat:
#   DB_URL, DB_USERNAME, DB_PASSWORD   - ket noi MySQL
#   ADMIN_PASSWORD, STAFF_PASSWORD     - mat khau tai khoan admin/nhan vien tao lan dau
#   MAIL_USERNAME, MAIL_PASSWORD       - Gmail gui email xac nhan (App Password 16 ky tu)
#   PAGE_IMAGES_DIR (tuy chon)         - thu muc anh rieng, ghi de anh di kem project
#   UPLOAD_DIR (tuy chon)              - thu muc luu anh phong/combo upload, mac dinh ./uploads
#   APP_BASE_URL                       - dia chi website (VD https://songxanhresort.vn), dung cho link xem don trong email
#   ZALO_PHONE (tuy chon)              - so Zalo cho nut "Nhan Zalo", mac dinh 0337196258
#   GUEST_EMAILS_ENABLED (tuy chon)    - email nhac lich nhan phong + moi danh gia, mac dinh true (dat false de tat)
#   DDL_AUTO (tuy chon)                - lan dau tren DB trong dat "update" de tao bang, sau do de mac dinh "validate"
# =====================================================================

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Khong cho Hibernate tu sua cau truc bang tren du lieu that
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Cache template de trang tai nhanh
spring.thymeleaf.cache=true

# Khong lo thong tin loi noi bo (stack trace, chi tiet exception) ra trinh duyet
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Tai khoan admin/nhan vien - bat buoc dat bien moi truong
app.admin.email=${ADMIN_EMAIL:admin@hotel.com}
app.admin.password=${ADMIN_PASSWORD}
app.staff.email=${STAFF_EMAIL:staff@hotel.com}
app.staff.password=${STAFF_PASSWORD}

# Link xem don trong email - de trong thi email khong kem link
app.base-url=${APP_BASE_URL:}

# Khong sinh khach hang / don dat phong gia lap
app.seed-fake-data=false

# Email nhac lich nhan phong + moi danh gia sau tra phong - bat mac dinh khi chay that
app.mail.guest-emails.enabled=${GUEST_EMAILS_ENABLED:true}

# Thu muc anh
app.page-images.dir=${PAGE_IMAGES_DIR:}
app.upload.base-dir=${UPLOAD_DIR:uploads}

# Cookie phien dang nhap chi gui qua HTTPS va khong doc duoc tu JavaScript
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.forward-headers-strategy=framework

# Cong chay: nen tang cloud (Render, Railway...) cap qua bien PORT, mac dinh 8080
server.port=${PORT:8080}

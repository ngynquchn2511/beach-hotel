spring.application.name=hotel-booking-test

# H2 in-memory DB for tests - MySQL compatibility mode so the real MySQL-dialect schema behaves the same way
spring.datasource.url=jdbc:h2:mem:hotel_booking_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Video danh gia toi da 30MB/tep (anh van chan o 5MB trong FileStorageService)
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=160MB
# Doc het request qua co de tra ve thong bao than thien thay vi ngat ket noi
server.tomcat.max-swallow-size=200MB
app.upload.base-dir=target/test-uploads
app.page-images.dir=target/test-page-images

server.error.include-message=always
app.contact.zalo-phone=0337196258

spring.mvc.locale=vi_VN
spring.mvc.locale-resolver=fixed

# Vo hieu hoa gui mail that trong test (EmailService se duoc mock/ignore loi neu khong ket noi duoc)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=2000
spring.mail.properties.mail.smtp.writetimeout=2000
